<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Georgia, serif; background: linear-gradient(160deg, #1E3A2E 0%, #122318 40%, #0a160f 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 28px 16px 48px; }

::-webkit-scrollbar{width:5px} ::-webkit-scrollbar-thumb{background:#4A7C6F;border-radius:3px}
.hdr{text-align:center;margin-bottom:26px}
.ey{font-size:11px;color:#D4A853;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;font-family:system-ui}

.hdr .sub{font-size:13px;color:#8FAF9F;font-family:system-ui;opacity:.85}
.card{width:100%;max-width:580px;background:white;border-radius:20px;overflow:hidden;box-shadow:0 20px 70px rgba(0,0,0,.5)}
.card-hdr{background:linear-gradient(135deg,#1E3A2E,#4A7C6F);padding:22px 24px 18px;color:white}
.card-hdr .e{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#D4A853;margin-bottom:6px;font-family:system-ui}
.card-hdr h2{font-size:19px;font-weight:700;margin-bottom:8px;line-height:1.3}
.card-hdr p{font-size:13px;color:rgba(255,255,255,.85);line-height:1.7;font-family:system-ui}
.body{padding:20px 24px 26px}
.feat{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.feat-icon{width:36px;height:36px;border-radius:10px;background:#F0F5F2;border:1px solid #D8EAE4;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;margin-top:1px}

.tip{background:linear-gradient(135deg,#FFF8EC,#FFF0D4);border-left:4px solid #C4923A;border-radius:10px;padding:13px 15px;font-size:13px;color:#1E2E28;line-height:1.7;font-family:system-ui;margin:14px 0}
.ehrlich{background:linear-gradient(135deg,#1E3A2E,#4A7C6F);border-radius:12px;padding:16px 18px;color:white;margin:14px 0}
.ehrlich p{font-size:14px;line-height:1.75;color:rgba(255,255,255,.9);font-style:italic}

.btn-p{background:linear-gradient(135deg,#1E3A2E,#4A7C6F);color:white;border:none;border-radius:10px;padding:13px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;width:100%}
.btn-p:disabled{background:#8FAF9F;cursor:not-allowed}
.btn-g{background:linear-gradient(135deg,#C4923A,#D4A853);color:white;border:none;border-radius:10px;padding:13px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;width:100%}
.btn-o{background:transparent;border:1.5px solid #1E3A2E;color:#1E3A2E;border-radius:10px;padding:12px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}

.btn-row{display:flex;gap:10px;margin-top:14px}
.btn-row .btn-p,.btn-row .btn-g{flex:1}
.prog-meta{display:flex;justify-content:space-between;font-size:11px;color:#6B8A7E;font-family:system-ui;margin-bottom:6px}
.prog-track{background:#D8EAE4;border-radius:999px;height:6px;overflow:hidden;margin-bottom:8px}
.prog-fill{height:100%;background:linear-gradient(90deg,#1E3A2E,#4A7C6F);border-radius:999px}
.dots{display:flex;gap:6px;margin-bottom:20px}
.dot{flex:1;height:4px;border-radius:999px}
.q-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#4A7C6F;font-family:system-ui;margin-bottom:4px}
.q-title{font-size:18px;font-weight:700;color:#1E3A2E;margin-bottom:8px;line-height:1.35}
.q-hint{font-size:13px;color:#6B8A7E;font-style:italic;font-family:system-ui;line-height:1.6}
.idk{font-size:12px;color:#6B8A7E;font-family:system-ui;line-height:1.6;margin:6px 0 12px;font-style:italic}
textarea{width:100%;font-family:Georgia,serif;font-size:14px;color:#1E2E28;background:#F0F5F2;border:1.5px solid #8FAF9F;border-radius:10px;padding:11px 13px;outline:none;resize:vertical;line-height:1.65;margin:12px 0 0;display:block}
textarea:focus{border-color:#4A7C6F}
.rbox{background:linear-gradient(135deg,#F0F5F2,#D8EAE4);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.rs-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.rs-txt{font-size:14px;color:#1E2E28;line-height:1.8}
.uebung-box{background:linear-gradient(135deg,#F0F5F2,#D8EAE4);border-radius:12px;padding:14px 16px;margin-bottom:14px;border-left:4px solid #2D4A3E}
.uebung-box .ut{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#2D4A3E;margin-bottom:10px;font-family:system-ui}
.uebung-item{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid rgba(45,74,62,.1)}
.uebung-item:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}
.uebung-nr{width:26px;height:26px;border-radius:50%;background:#2D4A3E;color:white;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;margin-top:1px;font-family:system-ui}
.uebung-text{font-size:13px;color:#1E2E28;line-height:1.65;font-family:system-ui}
.uebung-text strong{color:#2D4A3E;display:block;margin-bottom:3px}
.mensch-uebung{background:linear-gradient(135deg,#FFF8EC,#FFF0D4);border-radius:12px;padding:14px 16px;margin-bottom:14px;border-left:4px solid #C4923A}
.mensch-uebung .mt{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#C4923A;margin-bottom:10px;font-family:system-ui}
.copy-hint{font-size:11px;color:#6B8A7E;font-family:system-ui;margin:10px 0 4px}
.copy-field{width:100%;background:white;border:1.5px solid #4A7C6F;border-radius:8px;padding:9px 11px;font-size:13px;color:#1E2E28;font-family:inherit;line-height:1.7;resize:none;outline:none;cursor:text;display:block}
.spin-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:40px 0}
.spin{width:36px;height:36px;border:3px solid #D8EAE4;border-top-color:#4A7C6F;border-radius:50%;animation:spin .8s linear infinite}
.err{background:#fff0f0;border-left:4px solid #cc4444;border-radius:10px;padding:14px 16px;font-size:13px;color:#7a2222;font-family:system-ui}
.badge{display:inline-block;background:#1E3A2E;color:#D4A853;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;font-family:system-ui;letter-spacing:1px;text-transform:uppercase;margin-bottom:12px}
.abschluss{background:linear-gradient(135deg,#1E3A2E,#4A7C6F);border-radius:12px;padding:14px 16px;margin-bottom:14px;color:white;font-size:13px;font-family:system-ui;line-height:1.7}
.footer{margin-top:18px;font-size:11px;color:rgba(143,175,159,.4);font-family:system-ui}
</style>

<body>
<div class="hdr">
  <div class="ey">Die unsichtbaren Fäden</div>
  <h1>Warten lernen –<br>dein Hund und du</h1>
  <div class="sub">Frustrationstoleranz · für euch beide</div>
</div>
<div class="card" id="card"></div>
<div class="footer">🐾 Susanne Zischgl · Die unsichtbaren Fäden zwischen Mensch und Hund</div>

<script>
var QS = [
  {
    lbl: "Warten im Alltag",
    q: "In welchen Alltagssituationen fällt es deinem Hund am schwersten zu warten?",
    hint: "Konkret bitte – nicht allgemein. Vor der Futterstation, an der Tuer, beim Anleinen, wenn Besuch kommt, im Auto...?",
    ph: "z. B. Wenn ich sein Futter vorbereite dreht er komplett durch. Und an der Haustuer kann er nicht stillstehen..."
  },
  {
    lbl: "Deine Reaktion",
    q: "Was tust du, wenn dein Hund nicht warten kann und ungeduldig wird?",
    hint: "Ehrlich bitte. Gibst du nach? Wiederholst du Kommandos? Wirst du lauter? Oder bleibst du ruhig und konsequent?",
    ph: "z. B. Ich sage mehrmals Sitz und wenn er es nicht macht gebe ich meistens trotzdem das Futter. Ich habe nicht die Energie fuer einen langen Kampf..."
  },
  {
    lbl: "Wie lange haelt er durch",
    q: "Wie lange kann dein Hund in einer ruhigen Situation warten – bevor er anfaengt zu draengen, zu winseln oder aufzuspringen?",
    hint: "Keine Schätzung – denk an eine echte Situation. Sekunden? Eine Minute? Länger?",
    ph: "z. B. Vielleicht 10-15 Sekunden, dann fängt er an zu winseln. Manchmal sogar weniger..."
  },
  {
    lbl: "Frust bei dir",
    q: "Wie ist das bei dir – wie gut kannst du selbst Frust und Ungeduld aushalten, wenn etwas nicht sofort klappt?",
    hint: "Im Alltag generell – nicht nur mit dem Hund. Das ist relevant, weil sich deine Frustrationstoleranz direkt auf deinen Hund uebertraegt.",
    ph: "z. B. Ich bin eigentlich geduldig, aber bei Wiederholung verliere ich schnell die Ruhe. Wenn etwas nicht klappt werde ich innerlich angespannt..."
  },
  {
    lbl: "Was du dir wuenschst",
    q: "Wie soll Warten bei euch irgendwann aussehen – was waere das Ziel fuer euch beide?",
    hint: "Nicht perfektes Training. Sondern ein realistisches Bild: Wie koennte es sich anfuehlen wenn beide ruhiger geworden sind?",
    ph: "z. B. Ich wuensche mir, dass er ruhig wartet waehrend ich sein Futter vorbereite. Und dass ich dabei entspannt bleibe statt genervt..."
  }
];

var ANS = ["","","","",""];
var STEP = 0;
var RES = "";

function $(id){return document.getElementById(id);}


function showWelcome(){
  $("card").innerHTML =
    '<div class="card-hdr">'+
    '<div class="e">Frustrationstoleranz</div>'+
    '<h2>Warten ist eine Faehigkeit.<br>Fuer den Hund – und fuer dich.</h2>'+
    '<p>Ein Hund der nicht warten kann, hat meistens nie wirklich lernen duerfen zu warten. Und oft hat ihm dabei jemand geholfen – ohne es zu wissen.</p>'+
    '</div>'+
    '<div class="body">'+
    '<div class="badge">Die unsichtbaren Fäden</div>'+
    '<div class="ehrlich">'+
    '<p>Frustrationstoleranz entsteht nicht durch Strenge.<br>Sie entsteht durch <strong>konsequente Freundlichkeit</strong> – immer wieder, in kleinen Momenten.<br><br>'+
    'Ein Hund der jedes Mal sofort bekommt was er will, lernt:<br>'+
    '<strong>Draengen funktioniert.</strong><br><br>'+
    'Ein Hund der lernt zu warten, lernt:<br>'+
    '<strong>Ruhe bringt mich ans Ziel.</strong><br><br>'+
    'Das ist kein Training. Das ist ein Lebensprinzip.<br>'+
    'Und es beginnt bei dir.</p>'+
    '</div>'+
    '<div class="feat"><div class="feat-icon">&#128270;</div><div class="feat-text"><strong>Dein ehrlicher Spiegel</strong> – was passiert wirklich wenn dein Hund ungeduldig wird?</div></div>'+
    '<div class="feat"><div class="feat-icon">&#128062;</div><div class="feat-text"><strong>5 konkrete Warteuebungen fuer deinen Hund</strong> – alltagsnah, einfach, sofort umsetzbar.</div></div>'+
    '<div class="feat"><div class="feat-icon">&#129309;</div><div class="feat-text"><strong>3 Selbstbeobachtungsaufgaben fuer dich</strong> – weil deine Ruhe die Vorlage ist.</div></div>'+
    '<div class="feat"><div class="feat-icon">&#128336;</div><div class="feat-text"><strong>Dein 7-Tage-Warte-Plan</strong> – klein, machbar, wirksam.</div></div>'+
    '<div class="tip"><strong style="color:#C4923A">Wichtig:</strong> Steigere die Uebungen langsam &ndash; von leicht nach mittel nach schwer. Bleib bei einer Stufe bis dein Hund sie sicher beherrscht. Und schreib <strong>Ich weiss es nicht</strong> wenn du unsicher bist.</div>'+
    '<button class="btn-p" onclick="showQ(1)">&#128270; Ehrlich hinschauen</button>'+
    '</div>';
}

function showQ(n){
  STEP = n;
  var q = QS[n-1];
  var pct = Math.round((n/5)*100);
  var dots = "";
  for(var i=0;i<5;i++){
    var c = i<n-1?"#4A7C6F":i===n-1?"#1E3A2E":"#D8EAE4";
    dots += '<div class="dot" style="background:'+c+'"></div>';
  }
  var back = n>1?'<button class="btn-o" onclick="goBack()">&#8592; Zurueck</button>':'';
  var nextCls = n===5?"btn-g":"btn-p";
  var nextLbl = n===5?"&#128062; Uebungen & Plan zeigen":"Weiter &#8594;";
  $("card").innerHTML =
    '<div class="body">'+
    '<div class="prog-meta"><span>Frage '+n+' von 5</span><span>'+pct+'%</span></div>'+
    '<div class="prog-track"><div class="prog-fill" style="width:'+pct+'%"></div></div>'+
    '<div class="dots">'+dots+'</div>'+
    '<div class="q-label">'+q.lbl+'</div>'+
    '<div class="q-title">'+q.q+'</div>'+
    '<div class="q-hint">'+q.hint+'</div>'+
    '<textarea id="ta" rows="4" placeholder="'+q.ph+'" oninput="chk()">'+(ANS[n-1]||'')+'</textarea>'+
    '<p class="idk">&#128161; Du kannst auch schreiben: <strong>Ich weiss es nicht</strong> – das ist eine vollwertige Antwort.</p>'+
    '<div class="btn-row">'+back+'<button class="'+nextCls+'" id="nbtn" onclick="goNext()">'+nextLbl+'</button></div>'+
    '<button class="btn-lnk" onclick="reset()">&#8635; Von vorne starten</button>'+
    '</div>';
  chk();
}

function chk(){
  var ta=$("ta"), btn=$("nbtn");
  if(ta&&btn) btn.disabled = !ta.value.trim();
}

function goNext(){
  var ta=$("ta");
  if(!ta||!ta.value.trim()) return;
  ANS[STEP-1]=ta.value.trim();
  if(STEP<5){showQ(STEP+1);}
  else{generate();}
}

function goBack(){
  var ta=$("ta");
  if(ta) ANS[STEP-1]=ta.value.trim();
  showQ(STEP-1);
}

function showLoading(){
  $("card").innerHTML='<div class="body"><div class="spin-wrap"><div class="spin"></div><p style="font-size:14px;color:#6B8A7E;font-family:system-ui;font-style:italic">Susanne erstellt deinen persönlichen Warte-Plan...</p></div></div>';
}

function generate(){
  showLoading();
  var msg="";
  var labels=["Schwierigste Wartesituationen","Reaktion wenn Hund nicht wartet","Wie lange der Hund warten kann","Eigene Frustrationstoleranz","Wunschbild fuer kuenftige Warteситуationen"];
  for(var i=0;i<5;i++) msg+=labels[i]+": "+(ANS[i]||"keine Angabe")+"\n";

  var sys="Du bist Susanne, erfahrene Hundetrainerin, Physiotherapeutin und systemische Coach mit ueber 30 Jahren Erfahrung in der Mensch-Hund-Beziehung.\n\nDiese App befasst sich mit Frustrationstoleranz und Warten bei Hund UND Mensch. Kerngedanke: Frustrationstoleranz entsteht nicht durch Strenge, sondern durch konsequente Freundlichkeit. Ein Hund der immer sofort bekommt was er will, lernt dass Draengen funktioniert.\n\nWICHTIG fuer die Sprache: Schreibe so einfach und klar dass auch Menschen ohne Hundekenntnisse alles verstehen. Vermeide Fachbegriffe oder erklaere sie sofort. Zum Beispiel: Statt 'Tuerschwelle' schreibe 'die Tuer – warte bis dein Hund ruhig ist bevor ihr gemeinsam durchgeht'. Jede Uebung muss sofort verstaendlich sein ohne Erklaerung.\n\nBasierend auf den fuenf Antworten schreibst du sechs Abschnitte:\n\nWas du mir zeigst:\n[2-3 Saetze ehrlich und warm]\n\n5 Warteuebungen fuer deinen Hund:\n[Genau 5 Uebungen, klar gestaffelt von einfach bis schwer. Format pro Uebung: Nummer, Name, Schwierigkeitsgrad in Klammern (leicht/mittel/fortgeschritten), dann 2-3 Saetze Beschreibung in einfacher Alltagssprache. Beginne mit sehr einfachen Momenten die der Hund schon fast kann, steigere langsam. Hinweis am Ende: Bleib bei Stufe 1 bis dein Hund sie sicher beherrscht, bevor du weitermachst.]\n\n3 Selbstbeobachtungsaufgaben fuer dich:\n[3 Aufgaben, nummeriert. Fokus auf innere Wahrnehmung.]\n\nDein 7-Tage-Warte-Plan:\n[Aufbauend, klein, machbar. Tag 1-2: nur die leichteste Uebung. Tag 3-4: etwas mehr. Tag 5-6: naechste Stufe. Tag 7: Rueckblick.]\n\nDer Satz der alles veraendert:\n[1-2 Saetze]\n\nDeine eine Sache heute:\n[1 Satz konkret]\n\nAm Ende nach dem letzten Abschnitt schreibe noch diesen Hinweis:\n\nWenn du nicht weiterkommst:\n[2-3 Saetze: Wenn du merkst dass du alleine nicht weiterkommst oder dein Hund trotz Ueben nicht ruhiger wird – das ist kein Versagen. Dann ist der richtige Moment fuer professionelle Unterstuetzung. Als erfahrene Hundetrainerin begleite ich dich gerne persoenlich dabei. Susanne Zischgl – www.Tierakademie-Zischgl.de]\n\nKein Markdown. Deutsch, du-Ansprache.";

  fetch("https://tierakademie-proxy.tierakademie.workers.dev",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":"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","anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({
      model:"claude-haiku-4-5-20251001",
      max_tokens:2000,
      system:sys,
      messages:[{role:"user",content:"Hier sind die fuenf Antworten:\n\n"+msg}]
    })
  })
  .then(function(r){if(!r.ok)throw new Error("Fehler "+r.status);return r.json();})
  .then(function(d){
    if(d.error)throw new Error(d.error.message);
    RES=d.content&&d.content[0]?d.content[0].text:"";
    showResult();
  })
  .catch(function(e){
    $("card").innerHTML='<div class="body"><div class="err">&#9888; '+e.message+'<br><button class="btn-p" style="margin-top:12px;width:auto;padding:9px 16px" onclick="generate()">&#8635; Nochmal versuchen</button></div></div>';
  });
}

function showResult(){
  var secs=[
    {key:"was du mir zeigst",lbl:"&#128270; Was du mir zeigst",col:"#1E3A2E",type:"normal"},
    {key:"5 warteuebungen",lbl:"&#128062; 5 Warteuebungen fuer deinen Hund",col:"#2D4A3E",type:"uebungen"},
    {key:"3 selbstbeobachtungsaufgaben",lbl:"&#129309; 3 Selbstbeobachtungsaufgaben fuer dich",col:"#C4923A",type:"mensch"},
    {key:"dein 7-tage",lbl:"&#128197; Dein 7-Tage-Warte-Plan",col:"#4A7C6F",type:"plan"},
    {key:"der satz der alles",lbl:"&#128273; Der Satz der alles veraendert",col:"#D4A853",type:"copy"},
    {key:"deine eine sache",lbl:"&#128336; Deine eine Sache heute",col:"#8B5E3C",type:"copy"},
    {key:"wenn du nicht weiterkommst",lbl:"&#128081; Wenn du nicht weiterkommst",col:"#2D4A3E",type:"trainer"}
  ];
  var parsed=[],cur=null;
  var lines=RES.split("\n");
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim(),low=line.toLowerCase();
    var found=false;
    for(var j=0;j<secs.length;j++){
      if(low.indexOf(secs[j].key)!==-1){
        if(cur)parsed.push(cur);
        cur={lbl:secs[j].lbl,col:secs[j].col,type:secs[j].type,txt:""};
        found=true;break;
      }
    }
    if(!found&&cur&&line) cur.txt+=(cur.txt?"\n":"")+line;
  }
  if(cur)parsed.push(cur);
  if(!parsed.length)parsed=[{lbl:"&#128062; Dein Ergebnis",col:"#1E3A2E",type:"normal",txt:RES}];

  var html='<div class="body">'+
    '<p style="font-size:16px;font-weight:700;color:#1E3A2E;margin-bottom:4px">Dein Warte-Plan &#128062;</p>'+
    '<p style="font-size:13px;color:#6B8A7E;font-family:system-ui;margin-bottom:16px;line-height:1.65">Lies es in Ruhe. Fang dann mit einer einzigen Sache an.</p>';

  for(var k=0;k<parsed.length;k++){
    var s=parsed[k];
    var items=s.txt.split("\n").filter(function(l){return l.trim()!=="";});

    if(s.type==="uebungen"){
      html+='<div class="uebung-box"><div class="ut">'+s.lbl+'</div>';
      var nr=0;
      for(var m=0;m<items.length;m++){
        var item=items[m];
        if(item.match(/^[1-5][\.\)]/)){
          nr++;
          var rest=item.replace(/^[1-5][\.\)]\s*/,"");
          var parts=rest.split("–");
          var name=parts[0]?parts[0].trim():"";
          var desc=parts[1]?parts[1].trim():rest;
          html+='<div class="uebung-item"><div class="uebung-nr">'+nr+'</div><div class="uebung-text"><strong>'+name+'</strong>'+desc+'</div></div>';
        } else if(nr>0){
          html+='<div style="font-size:13px;color:#1E2E28;line-height:1.65;font-family:system-ui;margin-left:36px;margin-top:-6px;margin-bottom:8px">'+item+'</div>';
        }
      }
      html+='</div>';
    } else if(s.type==="mensch"){
      html+='<div class="mensch-uebung"><div class="mt">'+s.lbl+'</div>';
      var nr2=0;
      for(var m=0;m<items.length;m++){
        var item2=items[m];
        if(item2.match(/^[1-3][\.\)]/)){
          nr2++;
          var rest2=item2.replace(/^[1-3][\.\)]\s*/,"");
          var parts2=rest2.split("–");
          var name2=parts2[0]?parts2[0].trim():"";
          var desc2=parts2[1]?parts2[1].trim():rest2;
          html+='<div class="uebung-item" style="border-bottom-color:rgba(196,146,58,.15)"><div class="uebung-nr" style="background:#C4923A">'+nr2+'</div><div class="uebung-text" style=""><strong style="color:#C4923A">'+name2+'</strong>'+desc2+'</div></div>';
        } else if(nr2>0){
          html+='<div style="font-size:13px;color:#1E2E28;line-height:1.65;font-family:system-ui;margin-left:36px;margin-top:-6px;margin-bottom:8px">'+item2+'</div>';
        }
      }
      html+='</div>';
    } else if(s.type==="plan"){
      html+='<div class="rbox" style="border-left:4px solid '+s.col+'">'+
        '<div class="rs-lbl" style="color:'+s.col+'">'+s.lbl+'</div>'+
        '<div class="rs-txt">'+s.txt.replace(/\n/g,"<br>")+'</div>'+
        '<p class="copy-hint">&#128070; Klick ins Feld &#8594; alles markiert &#8594; Strg+C</p>'+
        '<textarea class="copy-field" readonly rows="6" onclick="this.select()">'+s.txt+'</textarea>'+
        '</div>';
    } else if(s.type==="copy"){
      html+='<div class="rbox" style="border-left:4px solid '+s.col+'">'+
        '<div class="rs-lbl" style="color:'+s.col+'">'+s.lbl+'</div>'+
        '<div class="rs-txt">'+s.txt.replace(/\n/g,"<br>")+'</div>'+
        '<p class="copy-hint">&#128070; Klick ins Feld &#8594; alles markiert &#8594; Strg+C</p>'+
        '<textarea class="copy-field" readonly rows="3" onclick="this.select()">'+s.txt+'</textarea>'+
        '</div>';
    } else if(s.type==="trainer"){
      html+='<div style="background:linear-gradient(135deg,#2D4A3E,#4A7C6F);border-radius:12px;padding:14px 16px;margin-bottom:14px;color:white">'+
        '<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#D4A853;margin-bottom:8px;font-family:system-ui">&#128081; Wenn du nicht weiterkommst</div>'+
        '<div style="font-size:13px;line-height:1.75;color:rgba(255,255,255,.92)">'+s.txt.replace(/\n/g,"<br>")+'</div>'+
        '<div style="margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.2)">'+
        '<div style="font-size:13px;font-weight:700;color:#D4A853;margin-bottom:4px">Susanne Zischgl</div>'+
        '<a href="https://www.Tierakademie-Zischgl.de" target="_blank" style="color:white;font-size:13px;font-family:system-ui;text-decoration:underline">www.Tierakademie-Zischgl.de</a>'+
        '</div>'+
        '</div>';
    } else {
      html+='<div class="rbox" style="border-left:4px solid '+s.col+'">'+
        '<div class="rs-lbl" style="color:'+s.col+'">'+s.lbl+'</div>'+
        '<div class="rs-txt">'+s.txt.replace(/\n/g,"<br>")+'</div>'+
        '</div>';
    }
  }

  html+='<div class="abschluss">'+
    '<strong style="color:#D4A853">&#128062; Denk daran:</strong> Kleine Momente zaehlen mehr als grosse Trainingseinheiten. Jedes Mal wenn dein Hund eine Sekunde laenger wartet als gestern – das ist Fortschritt. Fuer ihn. Und fuer dich.'+
    '</div>';

  html+='</div>';
  $("card").innerHTML=html;
}
