<script>
const QUIZ = {"title":"Was verrät dein Hund über dich?","intro":"Fünf Fragen zu eurem Alltag – ein Impuls zum Nachdenken.","questions":[{"q":"Wie reagiert dein Hund, wenn du nach Hause kommst?","hint":"Beobachte die Situation, ohne sie sofort zu bewerten.","options":[{"text":"Er dreht völlig durch – springt, bellt, dreht Runden","key":"care"},{"text":"Er freut sich herzlich, bleibt aber ruhig","key":"balance"},{"text":"Er schaut kurz auf und legt sich wieder hin","key":"structure"},{"text":"Es kommt sehr darauf an, wie ich drauf bin","key":"flexible"}]},{"q":"Was macht dein Hund, wenn du gestresst oder traurig bist?","hint":"Was beobachtest du in diesen Momenten konkret?","options":[{"text":"Er wird unruhig und klammert sich an mich","key":"care"},{"text":"Er kommt zu mir und legt sich an mich","key":"balance"},{"text":"Er zieht sich eher zurück","key":"structure"},{"text":"Er versucht mich abzulenken – bringt Spielzeug oder tobt","key":"flexible"}]},{"q":"Wie läuft ein typischer Spaziergang mit deinem Hund ab?","hint":"Der Alltag verrät mehr als besondere Momente.","options":[{"text":"Er zieht, ich folge – irgendwie","key":"care"},{"text":"Wir haben unseren Rhythmus, meist läuft es gut","key":"balance"},{"text":"Ich plane die Route, er kommt mit","key":"structure"},{"text":"Es ist jedes Mal anders – je nach Tagesform von uns beiden","key":"flexible"}]},{"q":"Wie reagierst du, wenn etwas anders läuft, als du möchtest?","hint":"Denke an eine kleine Schwierigkeit im Alltag.","options":[{"text":"Ich ärgere mich – manchmal mehr als ich möchte","key":"care"},{"text":"Ich versuche ruhig zu bleiben, aber es gelingt nicht immer","key":"balance"},{"text":"Ich überlege zuerst, was ich falsch gemacht habe","key":"structure"},{"text":"Ich nehme es meistens mit Humor","key":"flexible"}]},{"q":"Wenn dein Hund sprechen könnte – was würde er über euch sagen?","hint":"Stell dir das wirklich einen Moment vor.","options":[{"text":"\"Ich passe auf dich auf – du brauchst mich.\"","key":"care"},{"text":"\"Wir sind ein gutes Team – auch wenn es manchmal holpert.\"","key":"balance"},{"text":"\"Du gibst mir Sicherheit. Ich vertraue dir.\"","key":"structure"},{"text":"\"Du verstehst mich noch nicht ganz – aber du versuchst es.\"","key":"flexible"}]}],"results":{"care":{"title":"Nähe und Fürsorge","sections":[["Was deine Auswahl nahelegt","In deinen Antworten stehen starke Reaktionen und gegenseitige Aufmerksamkeit im Vordergrund. Vielleicht beschäftigt dich besonders, wie es deinem Hund geht und wie ihr aufeinander reagiert."],["Ein anderer Blick","Fürsorge darf auch bedeuten, Ruhe zu ermöglichen. Ein aufgeregter Hund sagt für sich allein nichts darüber aus, ob du zu wenig Sicherheit gibst oder zu viel Nähe suchst."],["Dein Impuls für diese Woche","Beobachte einen ruhigen Moment: Was hilft deinem Hund, sich zu entspannen? Und was hilft dir? Notiere beides getrennt, ohne sofort eine Erklärung zu suchen."]]},"balance":{"title":"Verbunden im Alltag","sections":[["Was deine Auswahl nahelegt","Du beschreibst mehrere Situationen, in denen Verbindung und ein gemeinsamer Rhythmus Platz haben. Vielleicht erkennst du euch besonders in den unspektakulären Momenten wieder."],["Ein anderer Blick","Auch ein gutes Miteinander kennt Missverständnisse. Ruhiges Verhalten ist ein Hinweis auf die jeweilige Situation, kein Beweis für eine perfekte Beziehung."],["Dein Impuls für diese Woche","Halte diese Woche einen kleinen Moment fest, der sich für euch beide gut anfühlt. Was war vorher passiert, und was hast du konkret beobachtet?"]]},"structure":{"title":"Orientierung und eigener Raum","sections":[["Was deine Auswahl nahelegt","Deine Auswahl richtet den Blick auf Eigenständigkeit, Orientierung und deinen eigenen Anteil am Alltag. Vielleicht hilft es dir, Situationen bewusst zu ordnen."],["Ein anderer Blick","Du musst nicht jede Reaktion deines Hundes auf dich beziehen. Rückzug kann ein Bedürfnis nach Ruhe ausdrücken; klare Abläufe können helfen, ohne jeden Moment festzulegen."],["Dein Impuls für diese Woche","Lass bei einem vertrauten Spaziergang eine kleine, sichere Wahl zu, etwa eine Schnüffelpause. Beobachte, wie es dir mit dieser Offenheit geht."]]},"flexible":{"title":"Offen für den Moment","sections":[["Was deine Auswahl nahelegt","In deinen Antworten fallen Unterschiede zwischen Situationen, Stimmungen und Tagesformen auf. Vielleicht erlebst du euer Miteinander eher beweglich als nach einem festen Muster."],["Ein anderer Blick","Flexibilität und Verlässlichkeit können zusammenpassen. Du darfst auf den Moment eingehen und gleichzeitig einfache, wiedererkennbare Abläufe anbieten."],["Dein Impuls für diese Woche","Wähle ein kleines Ritual, das euch beiden guttut. Beobachte an drei Tagen, was gleich bleibt und was sich verändert, ohne den Unterschied zu bewerten."]]}},"mixed":{"title":"Mehrere Seiten eures Miteinanders","sections":[["Was deine Auswahl nahelegt","Deine Antworten ergeben keinen eindeutigen Schwerpunkt. Das kann zu einem Alltag passen, der je nach Situation ganz unterschiedliche Seiten hat."],["Ein anderer Blick","Fünf Antworten können eure Beziehung nicht vollständig beschreiben. Du musst dich deshalb keinem Typ zuordnen."],["Dein Impuls für diese Woche","Wähle die Frage, bei der du am längsten überlegt hast. Beobachte diese Situation diese Woche einmal genauer: Was tut dein Hund, was tust du, und was bleibt zunächst offen?"]],"mixed":true},"reflections":[["Beim Heimkommen beschreibst du viel Aufregung. Für euren Alltag ist deshalb besonders interessant, wie aus der Begrüßung wieder Ruhe wird. Du musst die Intensität weder erwidern noch als Maß für seine Liebe verstehen.","Du beschreibst eine herzliche, ruhige Begrüßung. Hier erlebt ihr bereits Kontakt ohne viel Aufregung. Schau darauf, was diesen Übergang erleichtert: dein Tempo, ein vertrauter Ablauf oder Zeit zum Ankommen.","Dein Hund schaut auf und ruht weiter. Du lässt damit in deiner Beschreibung Raum für ein unspektakuläres Wiedersehen. Wenig sichtbare Begeisterung bedeutet für sich genommen weder Ablehnung noch besonders großes Vertrauen.","Du erlebst die Begrüßung unterschiedlich, je nachdem, wie du selbst ankommst. Du achtest also auf Zusammenhänge zwischen euch. Spannend ist, welche konkreten Dinge sich dabei verändern – etwa Stimme, Bewegung oder die Zeit für Kontakt."],["Wenn du belastet bist, bemerkst du bei deinem Hund Unruhe und verstärkte Nähe. Dann brauchen möglicherweise beide Entlastung. Du darfst dir Unterstützung außerhalb dieser Beziehung holen; dein Hund muss deine Stimmung nicht ausgleichen.","In schwierigen Momenten beschreibst du körperliche Nähe. Diese Nähe kann dir guttun. Lass deinem Hund zugleich die Wahl, ob und wie lange er bleiben möchte, statt aus seinem Kontakt eine Aufgabe zu machen.","Wenn du belastet bist, beobachtest du eher Rückzug. Das kann sich einsam anfühlen, muss aber keine Zurückweisung sein. Du kannst Abstand ermöglichen und für dein eigenes Bedürfnis nach Trost einen anderen Weg suchen.","Du beobachtest Spielzeug oder Toben und erlebst es als Ablenkung. Diese Deutung zeigt, wie du sein Verhalten in eure Beziehung einordnest. Ob er dich trösten möchte, lässt sich daraus nicht ablesen; schau auch darauf, ob das Spiel euch gerade wirklich guttut."],["Beim Spaziergang erlebst du dich häufig als die Person, die hinterhergeht. Hier wird dein eigener Handlungsspielraum zum Thema: Wo kannst du Tempo und Pausen so gestalten, dass du nicht nur reagierst? Ziehen allein sagt nichts über eure Bindung aus.","Draußen beschreibst du einen gemeinsamen Rhythmus. Das ist ein konkreter Anknüpfungspunkt: Welche kleinen Entscheidungen tragen dazu bei – genug Schnüffelzeit, eine passende Strecke oder rechtzeitige Pausen?","Du übernimmst beim Spaziergang die Planung. Das schafft einen Rahmen. Innerhalb dieses Rahmens kann auch Platz für die Interessen deines Hundes sein, zum Beispiel eine sichere Schnüffelpause, die er selbst beendet.","Eure Spaziergänge unterscheiden sich je nach Tagesform. Du nimmst diese Unterschiede wahr. Ein kleiner wiederkehrender Ablauf kann euch Orientierung geben, ohne jeden Spaziergang gleich gestalten zu müssen."],["Du bemerkst, dass dein Ärger manchmal größer wird, als du möchtest. Diese ehrliche Selbstbeobachtung ist ein konkreter Ansatzpunkt. Entscheidend ist der Moment vor deiner Reaktion: Erst eine Pause schaffen, dann überlegen, was dein Hund in dieser Situation lernen soll.","Du möchtest ruhig reagieren und erlebst, dass das nicht immer gelingt. Dein Anspruch und deine tatsächliche Belastbarkeit treffen hier aufeinander. Eine kurze Unterbrechung kann hilfreicher sein, als von dir sofort die perfekte Reaktion zu verlangen.","Du suchst bei Schwierigkeiten zuerst deinen eigenen Anteil. Damit übernimmst du Verantwortung. Achte darauf, Verantwortung nicht mit Schuld gleichzusetzen: Was kannst du konkret verändern, und welche Umstände liegen außerhalb deines Einflusses?","Humor hilft dir offenbar, kleine Pannen leichter zu nehmen. Das kann Spannung herausnehmen. Prüfe daneben, ob dein Hund gerade eine verständlichere Hilfestellung oder eine andere Umgebung braucht."],["In deinem vorgestellten Satz übernimmt dein Hund eine beschützende Rolle. Darin zeigt sich dein Bild von eurer Beziehung, nicht ein nachgewiesener Gedanke deines Hundes. Frage dich: Wo tut mir seine Nähe gut, und wo möchte ich selbst wieder mehr Halt finden?","Du stellst euch als Team dar, das auch mit holprigen Momenten zusammengehört. Dein Wunschbild enthält Verbindung und Fehlertoleranz. Welche kleine Alltagsszene passt schon heute genau dazu?","In deinem vorgestellten Satz stehen Sicherheit und Vertrauen im Mittelpunkt. Das beschreibt, was du deinem Hund geben möchtest. Wie wird diese Absicht für ihn im Alltag erkennbar – etwa durch klare Abläufe und respektierte Ruhe?","Du stellst dir vor, dass dein Hund dein Bemühen sieht, auch wenn noch Fragen offen sind. Dahinter steht der Wunsch, ihn besser zu verstehen. Hilfreich ist, zuerst sein beobachtbares Verhalten zu benennen und erst danach eine Erklärung zu suchen."]],"exercises":[["Eine Pause vor der Reaktion","Nimm dir für die nächste kleine Alltagspanne einen einzigen Schritt vor: Wenn die Situation sicher ist, halte kurz inne und atme ruhig aus, bevor du reagierst. Frage dich dann: Was soll mein Hund jetzt konkret tun können? Notiere später, ob die Pause deine Reaktion verändert hat."],["Ankommen ohne zusätzliche Aufregung","Probiere bei den nächsten drei Begrüßungen einen ruhigen, ähnlichen Ablauf aus: langsame Bewegungen, leise Ansprache und Kontakt, wenn dein Hund ihn möchte. Notiere, wie lange er ungefähr bis zu seiner üblichen Ruhe braucht. Vergleiche die Situationen, ohne ein bestimmtes Ergebnis erzwingen zu wollen."],["Ein Spaziergang mit einer bewussten Pause","Wähle auf einem vertrauten Spaziergang eine sichere, ruhige Stelle für eine Schnüffelpause. Halte die Leine ohne Rucken und gib innerhalb des sicheren Radius Zeit zum Erkunden. Achte darauf, ob du selbst ruhiger wirst. Es geht um einen gemeinsam gestalteten Moment, nicht um einen Gehorsamstest."],["Verantwortung ohne Selbstvorwurf","Schreibe nach einer kleinen Schwierigkeit drei kurze Sätze auf: Das habe ich beobachtet. Das kann ich beim nächsten Mal verändern. Das weiß ich noch nicht. Ersetze dabei „Ich mache alles falsch“ durch eine konkrete, veränderbare Handlung."],["Ein guter Moment, genauer betrachtet","Wähle morgen einen ruhigen Moment mit deinem Hund. Notiere drei sichtbare Einzelheiten: Was tat er, was tatest du, und was war in der Umgebung los? Wiederhole einen hilfreichen Teil davon am nächsten Tag und schau, ob er wieder passt."]]};
function chooseOutcome(quiz, answers) {
  const scores = Object.fromEntries(Object.keys(quiz.results).map(k => [k, 0]));
  answers.forEach((answer, i) => {
    const key = quiz.questions[i].options[answer]?.key;
    if (key && Object.hasOwn(scores, key)) scores[key]++;
  });
  const ranked = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  if (ranked[0][1] < 3 || ranked[0][1] === ranked[1][1]) return quiz.mixed;
  return quiz.results[ranked[0][0]];
}

function detailedDogOutcome(quiz, answers) {
 const sections = answers.map((a,i) => [ ['Euer Wiedersehen','Wenn du belastet bist','Euer Rhythmus draußen','Deine Reaktion auf Schwierigkeiten','Dein Bild von euch'][i], 'Du hast gewählt: „'+quiz.questions[i].options[a].text.replace(/^"|"$/g,'')+'“\n\n'+quiz.reflections[i][a] ]);
 const contact = ['viel Aufregung beim Wiedersehen','ein ruhiges, herzliches Wiedersehen','Raum für Ruhe beim Wiedersehen','wechselnde Begrüßungen'][answers[0]];
 const reaction = ['Ärger, den du früher bemerken möchtest','den Wunsch, auch bei Schwierigkeiten ruhig zu bleiben','einen starken Blick auf deinen eigenen Anteil','Humor im Umgang mit kleinen Pannen'][answers[3]];
 const synthesis = 'Du beschreibst '+contact+' und zugleich '+reaction+'. Diese Antworten müssen nicht zu einem einzigen Typ passen: Die erste beschreibt das Verhalten deines Hundes, die zweite deinen Umgang mit schwierigen Momenten. Dein Ansatzpunkt liegt dort, wo du selbst etwas gestalten kannst – bei deiner nächsten kleinen Reaktion.';
 const exerciseIndex = answers[3]===0 ? 0 : answers[0]===0 ? 1 : answers[2]===0 ? 2 : answers[3]===2 ? 3 : 4;
 return {title:'Euer Alltag – und dein Anteil daran',sections:[['Dein roter Faden',synthesis],...sections,['Zum Ausprobieren: '+quiz.exercises[exerciseIndex][0],quiz.exercises[exerciseIndex][1]]]};
}
(() => {
  'use strict';
  const card = document.getElementById('card');
  let step = 0;
  let answers = Array(QUIZ.questions.length).fill(null);
  function el(tag, text, cls) {
    const node = document.createElement(tag);
    if (text !== undefined) node.textContent = text;
    if (cls) node.className = cls;
    return node;
  }
  function button(text, action) {
    const b = el('button', text, 'local-button'); b.type = 'button';
    b.addEventListener('click', action); return b;
  }
  function frame(title, intro) {
    card.replaceChildren();
    const header = el('div', undefined, 'card-hdr');
    header.append(el('div', 'Die unsichtbaren Fäden', 'e'));
    const heading = el('h2', title); heading.tabIndex = -1;
    header.append(heading, el('p', intro));
    const body = el('div', undefined, 'body'); card.append(header, body);
    heading.focus(); return body;
  }
  function welcome() {
    const body = frame(QUIZ.title, QUIZ.intro);
    body.append(el('p', 'Fünf Fragen helfen dir, deine Wahrnehmung zu sortieren. Wähle jeweils die Antwort, die gerade am besten passt.', 'local-copy'));
    body.append(el('p', 'Deine Auswahl bleibt in diesem Browserfenster. Das Ergebnis entsteht aus vorbereiteten Texten, ohne KI-Auswertung. Es ist ein Reflexionsimpuls, keine Diagnose über dich oder deinen Hund.', 'local-note'));
    body.append(button('Los geht’s', () => { step = 0; question(); }));
  }
  function question() {
    const q = QUIZ.questions[step];
    const body = frame(QUIZ.title, 'Frage ' + (step + 1) + ' von ' + QUIZ.questions.length);
    const field = el('fieldset', undefined, 'local-options'); field.append(el('legend', q.q));
    if (q.hint) field.append(el('p', q.hint, 'local-copy'));
    const next = button(step === QUIZ.questions.length - 1 ? 'Mein Ergebnis anzeigen' : 'Weiter →', () => {
      if (answers[step] === null) return;
      if (step < QUIZ.questions.length - 1) { step++; question(); } else result();
    });
    next.disabled = answers[step] === null;
    q.options.forEach((option, index) => {
      const label = el('label', undefined, 'local-option');
      const input = document.createElement('input'); input.type = 'radio'; input.name = 'answer'; input.value = index;
      input.checked = answers[step] === index;
      input.addEventListener('change', () => { answers[step] = index; next.disabled = false; });
      label.append(input, el('span', option.text)); field.append(label);
    });
    body.append(field, next);
    if (step > 0) body.append(button('← Zurück', () => { step--; question(); }));
  }
  function result() {
    const outcome = QUIZ.reflections ? detailedDogOutcome(QUIZ, answers) : chooseOutcome(QUIZ, answers);
    const body = frame(outcome.title, 'Dein Ergebnis aus fünf ausgewählten Antworten');
    if (!QUIZ.reflections) body.append(el('p', outcome.mixed ? 'Deine Antworten zeigen mehrere Richtungen oder noch Unsicherheit. Deshalb erhältst du einen offenen Reflexionsimpuls.' : 'Mehrere deiner Antworten passen zu diesem Schwerpunkt. Das beschreibt deine Auswahl in diesem Moment, keine feste Eigenschaft.', 'local-note'));
    for (const section of outcome.sections) {
      const box = el('section', undefined, 'local-result'); box.append(el('h3', section[0]), el('p', section[1])); body.append(box);
    }
    body.append(el('p', 'Verhalten hat viele mögliche Ursachen, etwa Lernerfahrungen, Umgebung oder Gesundheit. Ob dieser Text zu euch passt, entscheidest du. Er ersetzt keine persönliche Beratung.', 'local-note'));
    const text = QUIZ.title + '\n\n' + outcome.title + '\n\n' + outcome.sections.map(s => s[0] + '\n' + s[1]).join('\n\n') + '\n\nReflexionsimpuls aus vorbereiteten Texten · Tierakademie Zischgl';
    const label = el('label', 'Dein Ergebnis zum Kopieren', 'local-copy'); label.htmlFor = 'local-share';
    const area = el('textarea'); area.id = 'local-share'; area.readOnly = true; area.rows = 6; area.value = text;
    const copy = button('Ergebnis zum Kopieren markieren', () => { area.focus(); area.select(); });
    const exportBox = el('details', undefined, 'local-export');
    exportBox.append(el('summary', 'Ergebnis zum Kopieren öffnen'), label, area, copy, el('p', 'Nach dem Markieren: Strg+C oder auf dem Handy „Kopieren“ wählen.', 'local-note'));
    body.append(exportBox);

  }
  welcome();
})();

</script>
