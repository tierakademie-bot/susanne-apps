<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Georgia, serif; background: linear-gradient(160deg, #2C3E2D 0%, #1a2e1a 40%, #0f1e0f 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 28px 16px 48px; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
::-webkit-scrollbar{width:5px} ::-webkit-scrollbar-thumb{background:#8FAF9F;border-radius:3px}

.ey { font-size: 11px; color: #D4A853; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 8px; font-family: system-ui; }
.hdr h1 { font-size: clamp(22px, 5vw, 28px); font-weight: 700; color: white; margin-bottom: 6px; line-height: 1.3; }
.hdr .sub { font-size: 13px; color: #8FAF9F; font-family: system-ui; }
.card { width: 100%; max-width: 600px; background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 20px 70px rgba(0,0,0,.35); animation: fadeIn 0.5s ease both; }
.card-hdr { background: linear-gradient(135deg, #2C4A3E, #4A7C6F); padding: 24px 24px 20px; color: white; }
.card-hdr .e { font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: #D4A853; margin-bottom: 6px; font-family: system-ui; }
.card-hdr h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; line-height: 1.3; }
.card-hdr p { font-size: 13px; color: rgba(255,255,255,.8); line-height: 1.7; font-family: system-ui; }
.body { padding: 22px 24px 28px; }
.qprog { font-size: 11px; color: #C4923A; font-family: system-ui; font-weight: 700; margin-bottom: 6px; }
.qbar { height: 4px; background: #E8DCC8; border-radius: 4px; margin-bottom: 20px; }
.qbar-fill { height: 4px; background: linear-gradient(90deg, #2C4A3E, #C4923A); border-radius: 4px; transition: width 0.4s ease; }
.question { font-size: 16px; font-weight: 700; color: #1E2E28; line-height: 1.5; margin-bottom: 6px; }
.question-hint { font-size: 12px; color: #8FAF9F; font-family: system-ui; margin-bottom: 16px; font-style: italic; }
.options { display: flex; flex-direction: column; gap: 10px; }
.opt { background: #F5F0E8; border: 2px solid #E8DCC8; border-radius: 12px; padding: 13px 16px; font-size: 14px; color: #1E2E28; cursor: pointer; font-family: inherit; text-align: left; transition: all 0.2s; line-height: 1.5; }
.opt:hover { border-color: #C4923A; background: #FFF8EC; transform: translateX(4px); }
.opt.selected { border-color: #2C4A3E; background: #2C4A3E; color: white; font-weight: 600; }
.opt.selected::before { content: "✓ "; color: #D4A853; }
.btn-next { background: linear-gradient(135deg, #2C4A3E, #4A7C6F); color: white; border: none; border-radius: 12px; padding: 13px 18px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; width: 100%; margin-top: 16px; transition: opacity 0.2s; }
.btn-next:disabled { opacity: 0.4; cursor: not-allowed; }
.spin-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 40px 0; }
.spin { width: 36px; height: 36px; border: 3px solid #E8DCC8; border-top-color: #C4923A; border-radius: 50%; animation: spin 0.8s linear infinite; }
.result-box { background: linear-gradient(135deg, #F5F0E8, #E8DCC8); border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; border-left: 4px solid #C4923A; animation: fadeIn 0.5s ease both; }
.result-box .rl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: #C4923A; margin-bottom: 10px; font-family: system-ui; }
.result-box .rt { font-size: 17px; font-weight: 700; color: #2C4A3E; margin-bottom: 10px; line-height: 1.3; }
.result-box .rb { font-size: 14px; color: #1E2E28; line-height: 1.8; }
.result-box2 { background: linear-gradient(135deg, #FFF8EC, #FFF0D4); border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; border-left: 4px solid #D4A853; animation: fadeIn 0.5s ease both 0.2s; opacity: 0; }
.result-box2.show { opacity: 1; }
.result-box2 .rl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: #D4A853; margin-bottom: 10px; font-family: system-ui; }
.result-box2 .rb { font-size: 14px; color: #1E2E28; line-height: 1.8; }
.share-box { background: linear-gradient(135deg, #2C4A3E, #1a3329); border-radius: 14px; padding: 18px 20px; margin-top: 4px; text-align: center; animation: fadeIn 0.5s ease both 0.4s; opacity: 0; }
.share-box.show { opacity: 1; }
.share-box p { font-size: 13px; color: rgba(255,255,255,.85); font-family: system-ui; line-height: 1.6; margin-bottom: 14px; }
.share-box strong { color: #D4A853; }
.copy-result { width: 100%; background: rgba(255,255,255,.1); border: 1.5px solid rgba(255,255,255,.2); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: white; font-family: inherit; line-height: 1.6; resize: none; outline: none; cursor: text; margin-bottom: 12px; }
.copy-result:focus { border-color: #D4A853; }
.btn-copy { background: linear-gradient(135deg, #C4923A, #D4A853); color: white; border: none; border-radius: 10px; padding: 11px 18px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; width: 100%; }
.btn-restart { background: none; border: none; color: #8FAF9F; font-size: 12px; cursor: pointer; font-family: inherit; text-decoration: underline; margin-top: 14px; display: block; text-align: center; }
.footer { margin-top: 18px; font-size: 11px; color: rgba(143,175,159,.5); font-family: system-ui; text-align: center; }

</style>
<meta http-equiv="Content-Security-Policy" content="connect-src 'none'; object-src 'none'; base-uri 'self'">
<style>
.local-copy,.local-note,.local-result p{font:15px/1.7 system-ui,sans-serif;margin:0 0 16px;color:#385448}
.local-note{font-size:13px;background:#f3f5ed;padding:14px;border-radius:10px}
.local-options{border:0;min-width:0;padding:0;margin:0 0 18px}.local-options legend{font-size:19px;font-weight:bold;line-height:1.45;margin-bottom:16px}
.local-option{display:flex;align-items:flex-start;gap:12px;padding:14px;margin:10px 0;border:1px solid #b7c9c0;border-radius:10px;font:15px/1.5 system-ui;cursor:pointer}
.local-option:has(input:checked){background:#edf3e9;border-color:#2c4a3e}.local-option input[type=radio]{display:block;width:18px;height:18px;flex-shrink:0;margin:3px 0 0;accent-color:#2c4a3e}
.local-button{display:block;width:100%;padding:14px;margin:12px 0;border:0;border-radius:10px;background:#2c4a3e;color:white;font:600 15px system-ui;cursor:pointer}.local-button:disabled{opacity:.45;cursor:default}
.local-button:focus-visible,.local-option:focus-within{outline:3px solid #bc882c;outline-offset:3px}.local-result{padding:16px 0;border-bottom:1px solid #d8e4dc}.local-result h3{font-size:17px;color:#2c4a3e;margin-bottom:10px}
#local-share{box-sizing:border-box;width:100%;font:14px/1.6 system-ui;padding:12px;border:1px solid #b7c9c0;border-radius:8px}
</style>

<body>

<div class="hdr">
  <div class="ey">Tierakademie Zischgl · Susanne Zischgl</div>
  <h1>Was verrät dein Hund<br>über dich?</h1>
  <div class="sub">5 Fragen · überraschend ehrlich · in 2 Minuten</div>
</div>

<div class="card" id="card"></div>
<div class="footer">🐾 Susanne Zischgl · Die unsichtbaren Fäden zwischen Mensch und Hund</div>

<script>
const QUIZ = {"title":"Was verrät dein Hund über dich?","intro":"Fünf Fragen zu eurem Alltag – ein Impuls zum Nachdenken.","questions":[{"q":"Wie reagiert dein Hund, wenn du nach Hause kommst?","hint":"Beobachte die Situation, ohne sie sofort zu bewerten.","options":[{"text":"Er dreht völlig durch – springt, bellt, dreht Runden","key":"care"},{"text":"Er freut sich herzlich, bleibt aber ruhig","key":"balance"},{"text":"Er schaut kurz auf und legt sich wieder hin","key":"structure"},{"text":"Es kommt sehr darauf an, wie ich drauf bin","key":"flexible"}]},{"q":"Was macht dein Hund, wenn du gestresst oder traurig bist?","hint":"Hunde sind Meister darin, unsere Stimmung zu lesen.","options":[{"text":"Er wird unruhig und klammert sich an mich","key":"care"},{"text":"Er kommt zu mir und legt sich an mich","key":"balance"},{"text":"Er zieht sich eher zurück","key":"structure"},{"text":"Er versucht mich abzulenken – bringt Spielzeug oder tobt","key":"flexible"}]},{"q":"Wie läuft ein typischer Spaziergang mit deinem Hund ab?","hint":"Der Alltag verrät mehr als besondere Momente.","options":[{"text":"Er zieht, ich folge – irgendwie","key":"care"},{"text":"Wir haben unseren Rhythmus, meist läuft es gut","key":"balance"},{"text":"Ich plane die Route, er kommt mit","key":"structure"},{"text":"Es ist jedes Mal anders – je nach Tagesform von uns beiden","key":"flexible"}]},{"q":"Was passiert, wenn dein Hund etwas falsch macht?","hint":"Unsere erste Reaktion zeigt viel über uns.","options":[{"text":"Ich ärgere mich – manchmal mehr als ich möchte","key":"care"},{"text":"Ich versuche ruhig zu bleiben, aber es gelingt nicht immer","key":"balance"},{"text":"Ich überlege zuerst, was ich falsch gemacht habe","key":"structure"},{"text":"Ich nehme es meistens mit Humor","key":"flexible"}]},{"q":"Wenn dein Hund sprechen könnte – was würde er über euch sagen?","hint":"Stell dir das wirklich einen Moment vor.","options":[{"text":"\"Ich passe auf dich auf – du brauchst mich.\"","key":"care"},{"text":"\"Wir sind ein gutes Team – auch wenn es manchmal holpert.\"","key":"balance"},{"text":"\"Du gibst mir Sicherheit. Ich vertraue dir.\"","key":"structure"},{"text":"\"Du verstehst mich noch nicht ganz – aber du versuchst es.\"","key":"flexible"}]}],"results":{"care":{"title":"Nähe und Fürsorge","sections":[["Was deine Auswahl nahelegt","In deinen Antworten stehen starke Reaktionen und gegenseitige Aufmerksamkeit im Vordergrund. Vielleicht beschäftigt dich besonders, wie es deinem Hund geht und wie ihr aufeinander reagiert."],["Ein anderer Blick","Fürsorge darf auch bedeuten, Ruhe zu ermöglichen. Ein aufgeregter Hund sagt für sich allein nichts darüber aus, ob du zu wenig Sicherheit gibst oder zu viel Nähe suchst."],["Dein Impuls für diese Woche","Beobachte einen ruhigen Moment: Was hilft deinem Hund, sich zu entspannen? Und was hilft dir? Notiere beides getrennt, ohne sofort eine Erklärung zu suchen."]]},"balance":{"title":"Verbunden im Alltag","sections":[["Was deine Auswahl nahelegt","Du beschreibst mehrere Situationen, in denen Verbindung und ein gemeinsamer Rhythmus Platz haben. Vielleicht erkennst du euch besonders in den unspektakulären Momenten wieder."],["Ein anderer Blick","Auch ein gutes Miteinander kennt Missverständnisse. Ruhiges Verhalten ist ein Hinweis auf die jeweilige Situation, kein Beweis für eine perfekte Beziehung."],["Dein Impuls für diese Woche","Halte diese Woche einen kleinen Moment fest, der sich für euch beide gut anfühlt. Was war vorher passiert, und was hast du konkret beobachtet?"]]},"structure":{"title":"Orientierung und eigener Raum","sections":[["Was deine Auswahl nahelegt","Deine Auswahl richtet den Blick auf Eigenständigkeit, Orientierung und deinen eigenen Anteil am Alltag. Vielleicht hilft es dir, Situationen bewusst zu ordnen."],["Ein anderer Blick","Du musst nicht jede Reaktion deines Hundes auf dich beziehen. Rückzug kann ein Bedürfnis nach Ruhe ausdrücken; klare Abläufe können helfen, ohne jeden Moment festzulegen."],["Dein Impuls für diese Woche","Lass bei einem vertrauten Spaziergang eine kleine, sichere Wahl zu, etwa eine Schnüffelpause. Beobachte, wie es dir mit dieser Offenheit geht."]]},"flexible":{"title":"Offen für den Moment","sections":[["Was deine Auswahl nahelegt","In deinen Antworten fallen Unterschiede zwischen Situationen, Stimmungen und Tagesformen auf. Vielleicht erlebst du euer Miteinander eher beweglich als nach einem festen Muster."],["Ein anderer Blick","Flexibilität und Verlässlichkeit können zusammenpassen. Du darfst auf den Moment eingehen und gleichzeitig einfache, wiedererkennbare Abläufe anbieten."],["Dein Impuls für diese Woche","Wähle ein kleines Ritual, das euch beiden guttut. Beobachte an drei Tagen, was gleich bleibt und was sich verändert, ohne den Unterschied zu bewerten."]]}},"mixed":{"title":"Mehrere Seiten eures Miteinanders","sections":[["Was deine Auswahl nahelegt","Deine Antworten ergeben keinen eindeutigen Schwerpunkt. Das kann zu einem Alltag passen, der je nach Situation ganz unterschiedliche Seiten hat."],["Ein anderer Blick","Fünf Antworten können eure Beziehung nicht vollständig beschreiben. Du musst dich deshalb keinem Typ zuordnen."],["Dein Impuls für diese Woche","Wähle die Frage, bei der du am längsten überlegt hast. Beobachte diese Situation diese Woche einmal genauer: Was tut dein Hund, was tust du, und was bleibt zunächst offen?"]],"mixed":true}};
function chooseOutcome(quiz, answers) {
  const scores = Object.fromEntries(Object.keys(quiz.results).map(k => [k, 0]));
  answers.forEach((answer, i) => {
    const key = quiz.questions[i].options[answer]?.key;
    if (key && Object.hasOwn(scores, key)) scores[key]++;
  });
  const ranked = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  if (ranked[0][1] < 3 || ranked[0][1] === ranked[1][1]) return quiz.mixed;
  return quiz.results[ranked[0][0]];
}

(() => {
  'use strict';
  const card = document.getElementById('card');
  let step = 0;
  let answers = Array(QUIZ.questions.length).fill(null);
  function el(tag, text, cls) {
    const node = document.createElement(tag);
    if (text !== undefined) node.textContent = text;
    if (cls) node.className = cls;
    return node;
  }
  function button(text, action) {
    const b = el('button', text, 'local-button'); b.type = 'button';
    b.addEventListener('click', action); return b;
  }
  function frame(title, intro) {
    card.replaceChildren();
    const header = el('div', undefined, 'card-hdr');
    header.append(el('div', 'Die unsichtbaren Fäden', 'e'));
    const heading = el('h2', title); heading.tabIndex = -1;
    header.append(heading, el('p', intro));
    const body = el('div', undefined, 'body'); card.append(header, body);
    heading.focus(); return body;
  }
  function welcome() {
    const body = frame(QUIZ.title, QUIZ.intro);
    body.append(el('p', 'Fünf Fragen helfen dir, deine Wahrnehmung zu sortieren. Wähle jeweils die Antwort, die gerade am besten passt.', 'local-copy'));
    body.append(el('p', 'Deine Auswahl bleibt in diesem Browserfenster. Das Ergebnis entsteht aus vorbereiteten Texten, ohne KI-Auswertung. Es ist ein Reflexionsimpuls, keine Diagnose über dich oder deinen Hund.', 'local-note'));
    body.append(button('Los geht’s', () => { step = 0; question(); }));
  }
  function question() {
    const q = QUIZ.questions[step];
    const body = frame(QUIZ.title, 'Frage ' + (step + 1) + ' von ' + QUIZ.questions.length);
    const field = el('fieldset', undefined, 'local-options'); field.append(el('legend', q.q));
    if (q.hint) field.append(el('p', q.hint, 'local-copy'));
    const next = button(step === QUIZ.questions.length - 1 ? 'Mein Ergebnis anzeigen' : 'Weiter →', () => {
      if (answers[step] === null) return;
      if (step < QUIZ.questions.length - 1) { step++; question(); } else result();
    });
    next.disabled = answers[step] === null;
    q.options.forEach((option, index) => {
      const label = el('label', undefined, 'local-option');
      const input = document.createElement('input'); input.type = 'radio'; input.name = 'answer'; input.value = index;
      input.checked = answers[step] === index;
      input.addEventListener('change', () => { answers[step] = index; next.disabled = false; });
      label.append(input, el('span', option.text)); field.append(label);
    });
    body.append(field, next);
    if (step > 0) body.append(button('← Zurück', () => { step--; question(); }));
  }
  function result() {
    const outcome = chooseOutcome(QUIZ, answers);
    const body = frame(outcome.title, 'Dein Ergebnis aus fünf ausgewählten Antworten');
    body.append(el('p', outcome.mixed ? 'Deine Antworten zeigen mehrere Richtungen oder noch Unsicherheit. Deshalb erhältst du einen offenen Reflexionsimpuls.' : 'Mehrere deiner Antworten passen zu diesem Schwerpunkt. Das beschreibt deine Auswahl in diesem Moment, keine feste Eigenschaft.', 'local-note'));
    for (const section of outcome.sections) {
      const box = el('section', undefined, 'local-result'); box.append(el('h3', section[0]), el('p', section[1])); body.append(box);
    }
    body.append(el('p', 'Verhalten hat viele mögliche Ursachen, etwa Lernerfahrungen, Umgebung oder Gesundheit. Ob dieser Text zu euch passt, entscheidest du. Er ersetzt keine persönliche Beratung.', 'local-note'));
    const text = QUIZ.title + '\n\n' + outcome.title + '\n\n' + outcome.sections.map(s => s[0] + '\n' + s[1]).join('\n\n') + '\n\nReflexionsimpuls aus vorbereiteten Texten · Tierakademie Zischgl';
    const label = el('label', 'Dein Ergebnis zum Kopieren', 'local-copy'); label.htmlFor = 'local-share';
    const area = el('textarea'); area.id = 'local-share'; area.readOnly = true; area.rows = 6; area.value = text;
    const copy = button('Ergebnis zum Kopieren markieren', () => { area.focus(); area.select(); });
    body.append(label, area, copy, el('p', 'Nach dem Markieren: Strg+C oder auf dem Handy „Kopieren“ wählen. Du entscheidest selbst, ob du dein Ergebnis teilst.', 'local-note'));
    body.append(button('Noch einmal starten', () => { answers = Array(QUIZ.questions.length).fill(null); welcome(); }));
  }
  welcome();
})();

</script>
<footer style="text-align:center; padding: 20px; font-size: 0.85em; color: #6B7C47; margin-top: 40px; border-top: 1px solid #C8B89A;">

  &copy; Susanne Zischgl &middot; Tierakademie Zischgl
</footer>
</body>
</html>
