<script>
const QUIZ = {"title":"Deine Beziehungsmuster","intro":"Wie erlebst du Nähe, Bedürfnisse und kleine Konflikte? Schau mit fünf Auswahlfragen auf deinen Alltag.","questions":[{"q":"Wie erlebst du dich in Beziehungen?","hint":"Wähle, was im Moment am ehesten passt.","options":[{"text":"Ich passe mich oft an und stelle eigene Wünsche zurück.","key":"adapt"},{"text":"Ich fühle mich wohler, wenn ich planen und den Überblick behalten kann.","key":"control"},{"text":"Ich wünsche mir Nähe, brauche aber manchmal plötzlich Abstand.","key":"closeness"},{"text":"Ich versuche, eigene Bedürfnisse und die des Gegenübers zu berücksichtigen.","key":"balanced"},{"text":"Das ist unterschiedlich oder ich weiß es noch nicht.","key":null}]},{"q":"Was wiederholt sich im Zusammenleben mit deinem Hund?","options":[{"text":"Ich gebe oft nach, obwohl ich eigentlich etwas anderes wollte.","key":"adapt"},{"text":"Wenn ein Ablauf anders ist als geplant, werde ich unruhig.","key":"control"},{"text":"Ich genieße viel Nähe, bis sie mir manchmal zu viel wird.","key":"closeness"},{"text":"Wir finden häufig einen Rhythmus mit Raum für uns beide.","key":"balanced"},{"text":"Ich erkenne noch kein wiederkehrendes Muster.","key":null}]},{"q":"Wie gehst du mit Nähe und Abstand um?","options":[{"text":"Ich lasse Nähe zu, auch wenn ich gerade lieber Ruhe hätte.","key":"adapt"},{"text":"Ich möchte möglichst selbst bestimmen, wann Nähe und Abstand passen.","key":"control"},{"text":"Mein Wunsch nach Nähe oder Rückzug wechselt deutlich.","key":"closeness"},{"text":"Ich biete Nähe an und respektiere auch Ruhe und Rückzug.","key":"balanced"},{"text":"Das kann ich noch nicht gut einschätzen.","key":null}]},{"q":"Was bemerkst du bei kleinen Konflikten?","options":[{"text":"Ich gebe schnell nach, damit die Spannung verschwindet.","key":"adapt"},{"text":"Ich versuche, die Situation sofort wieder unter Kontrolle zu bringen.","key":"control"},{"text":"Ich schwanke zwischen Kontakt suchen und mich zurückziehen.","key":"closeness"},{"text":"Ich versuche erst ruhiger zu werden und dann zu entscheiden.","key":"balanced"},{"text":"Es hängt stark von der Situation ab.","key":null}]},{"q":"Welchen eigenen Wunsch möchtest du genauer anschauen?","options":[{"text":"Eigene Bedürfnisse ernst nehmen, ohne ein schlechtes Gewissen zu haben.","key":"adapt"},{"text":"Mehr Gelassenheit, wenn nicht alles nach Plan läuft.","key":"control"},{"text":"Nähe und Rückzug früher wahrnehmen und klarer gestalten.","key":"closeness"},{"text":"Bewusster erkennen, was in unserem Miteinander bereits gut funktioniert.","key":"balanced"},{"text":"Ich möchte erst beobachten, bevor ich mich festlege.","key":null}]}],"results":{"adapt":{"title":"Fürsorge mit Platz für dich","sections":[["Was deine Auswahl nahelegt","In mehreren Antworten stellst du Anpassung und das Vermeiden von Spannung in den Vordergrund. Vielleicht nimmst du die Wünsche anderer schnell wahr und deine eigenen erst später."],["Ein anderer Blick","Ein eigenes Bedürfnis zu bemerken ist noch keine Zurückweisung deines Hundes. Du kannst fürsorglich sein und zugleich für angemessene Ruhe, Abstand oder Unterstützung sorgen."],["Dein Impuls für diese Woche","Frage dich in einer ruhigen Alltagssituation: Was brauche ich gerade, und was braucht mein Hund? Schreibe beide Antworten auf, bevor du nach einer Lösung suchst."]]},"control":{"title":"Sicherheit durch Überblick","sections":[["Was deine Auswahl nahelegt","Deine Auswahl betont Planung und den Wunsch, Situationen überschaubar zu halten. Struktur kann dir Orientierung geben; Unvorhergesehenes kostet vielleicht besonders viel Kraft."],["Ein anderer Blick","Verlässliche Abläufe sind hilfreich. Gleichzeitig lässt sich das Verhalten eines Lebewesens nicht vollständig planen. Eine Abweichung ist nicht automatisch dein Fehler."],["Dein Impuls für diese Woche","Bemerke bei einer kleinen, ungefährlichen Planänderung zuerst deinen eigenen Gedanken. Was befürchtest du, und was ist tatsächlich passiert? Lass die beiden Antworten nebeneinanderstehen."]]},"closeness":{"title":"Nähe und Freiraum im Wechsel","sections":[["Was deine Auswahl nahelegt","Mehrere Antworten beschreiben wechselnde Wünsche nach Kontakt und Abstand. Vielleicht merkst du manchmal erst spät, wann aus schöner Nähe ein Zuviel wird."],["Ein anderer Blick","Nähe und Rückzug müssen keine Gegensätze sein. Beide können Bedürfnisse ausdrücken. Auch dein Hund kann Kontakt suchen und später ungestört ruhen wollen."],["Dein Impuls für diese Woche","Achte in einem ruhigen Moment auf ein frühes Zeichen deines eigenen Ruhebedürfnisses. Wie könntest du rechtzeitig eine Pause ermöglichen, die für euch beide angenehm ist?"]]},"balanced":{"title":"Beide Seiten im Blick","sections":[["Was deine Auswahl nahelegt","Deine Antworten betonen gegenseitige Bedürfnisse und das Bemühen, bewusst zu reagieren. Vielleicht helfen dir kleine Pausen, nicht sofort jedem Impuls zu folgen."],["Ein anderer Blick","Das ist keine Bewertung als „besserer“ Beziehungstyp. Auch wenn vieles gut läuft, bleiben schwierige Tage und offene Fragen Teil einer Beziehung."],["Dein Impuls für diese Woche","Notiere eine Situation, in der du sowohl dein eigenes Bedürfnis als auch das deines Hundes berücksichtigen konntest. Welche konkrete Entscheidung hat dabei geholfen?"]]}},"mixed":{"title":"Ein Muster muss noch keinen Namen haben","sections":[["Was deine Auswahl nahelegt","Deine Auswahl zeigt mehrere Richtungen oder enthält noch offene Fragen. Aus diesen fünf Antworten lässt sich deshalb kein klarer Schwerpunkt ableiten."],["Ein anderer Blick","Du darfst Unterschiede zwischen Situationen stehen lassen. Ein Reflexionstest ist keine psychologische Diagnose und muss dich nicht auf einen Typ festlegen."],["Dein Impuls für diese Woche","Wähle eine wiederkehrende Alltagssituation. Notiere getrennt: Was ist passiert? Was habe ich gefühlt? Was habe ich gebraucht? Was habe ich beim Hund tatsächlich gesehen?"]],"mixed":true},"reflections":[["Du bemerkst, dass du dich häufig anpasst und eigene Wünsche zurückstellst. Das kann helfen, ein Miteinander angenehm zu gestalten. Gleichzeitig lohnt sich die Frage, wann aus Rücksicht ein Übergehen deiner eigenen Bedürfnisse wird. Was hättest du in einer konkreten Situation selbst gebraucht?","Du fühlst dich mit Überblick und Planung wohler. Ein verlässlicher Rahmen kann entlasten und Orientierung geben. Wenn etwas anders läuft, darfst du zunächst unterscheiden: Was braucht wirklich eine Entscheidung, und was darf für einen Moment offenbleiben?","Du wünschst dir Nähe und brauchst manchmal plötzlich Abstand. Beide Wünsche dürfen nebeneinander bestehen. Vielleicht hilft es, schon ein frühes Zeichen von Anspannung wahrzunehmen, bevor du eine größere Pause brauchst.","Du versuchst, die eigenen Bedürfnisse und die des Gegenübers zu berücksichtigen. Darin liegt Aufmerksamkeit für beide Seiten. Im Alltag kann es helfen, die Bedürfnisse zunächst getrennt zu benennen, bevor du eine gemeinsame Lösung suchst.","Du erlebst dich unterschiedlich oder bist noch unsicher. Das ist eine brauchbare Ausgangslage: Schau auf eine konkrete Situation, statt eine allgemeine Aussage über dich finden zu müssen. Was hast du getan, und was hättest du dir gewünscht?"],["Du beschreibst, dass du im Zusammenleben häufig nachgibst, obwohl du etwas anderes möchtest. Frage dich bei einer kleinen Alltagssituation: War das eine bewusste Entscheidung oder wolltest du vor allem Spannung vermeiden? Dein Wunsch verdient ebenso Beachtung wie ein passender Umgang mit deinem Hund.","Wenn Abläufe anders sind als geplant, wirst du unruhig. Dein Bedürfnis nach Verlässlichkeit wird hier sichtbar. Eine kleine Unterbrechung vor der nächsten Entscheidung kann dir helfen zu prüfen, was jetzt tatsächlich wichtig ist.","Du genießt Nähe und bemerkst manchmal erst später, dass es zu viel wird. Das ist ein Hinweis auf deinen eigenen Rhythmus, keine Aussage über die Absichten deines Hundes. Eine rechtzeitige, ruhige Pause kann euch beiden guttun.","Du erlebst häufig einen Rhythmus mit Platz für euch beide. Überlege, woran du das konkret erkennst: Gibt es Zeiten für Kontakt, Ruhe und eigene Wege? Was davon möchtest du auch an schwierigeren Tagen bewahren?","Du erkennst noch kein wiederkehrendes Muster. Wähle eine alltägliche Situation, zum Beispiel den Moment vor dem Spaziergang, und beobachte sie an zwei Tagen. Achte auf Unterschiede, statt vorschnell eine feste Erklärung zu suchen."],["Du lässt manchmal Nähe zu, obwohl du Ruhe brauchst. Nähe und eine eigene Grenze schließen sich nicht aus. Du könntest einen angenehmen Ruheplatz anbieten und selbst eine kurze Pause nehmen, bevor du erschöpft bist.","Du möchtest mitbestimmen, wann Nähe und Abstand passen. Dein eigener Freiraum ist wichtig. Achte gleichzeitig darauf, ob auch dein Hund Kontakt sucht oder sich zurückziehen möchte – beide Seiten dürfen Wahlmöglichkeiten haben.","Dein Wunsch nach Kontakt oder Rückzug verändert sich deutlich. Versuche, ohne Bewertung wahrzunehmen, was gerade passt. Ein kleines Signal für dich selbst – etwa „Ich brauche fünf Minuten Ruhe“ – kann helfen, früher zu reagieren.","Du beschreibst, dass du Nähe anbietest und Ruhe respektierst. Ein guter nächster Schritt ist, auf konkrete Signale zu achten: Kommt dein Hund von selbst, bleibt er entspannt, oder entfernt er sich wieder?","Du kannst Nähe und Abstand noch nicht gut einschätzen. Beobachte beim nächsten Kontakt nur, wer ihn beginnt und wann er endet. Anschließend kannst du fragen: Wie ging es mir dabei, und was habe ich beim Hund tatsächlich gesehen?"],["In kleinen Konflikten gibst du schnell nach, damit die Spannung endet. Das kann kurzfristig Erleichterung bringen. Bei der nächsten ungefährlichen Situation kannst du vor dem Nachgeben kurz prüfen, was du selbst möchtest und welche ruhige Alternative möglich ist.","Du versuchst, eine schwierige Situation rasch wieder überschaubar zu machen. Das kann aus dem Wunsch nach Sicherheit entstehen. Wenn keine unmittelbare Gefahr besteht, nimm dir einen Atemzug Zeit und wähle dann eine einfache nächste Handlung.","Du schwankst in Konflikten zwischen Kontakt und Rückzug. Vielleicht ist im Moment der Anspannung nicht sofort klar, was du brauchst. Eine kurze Pause kann dir Raum geben, bevor du entscheidest, ob gerade Nähe oder Abstand hilfreich ist.","Du versuchst, zuerst ruhiger zu werden und dann zu entscheiden. Das gibt dir Zeit, eine bewusste Reaktion zu wählen. Überlege, was dir diese Pause erleichtert – ein Schritt zurück, ein Ausatmen oder eine kurze Unterbrechung.","Deine Reaktion hängt stark von der Situation ab. Das ist nachvollziehbar: Verschiedene Auslöser und Belastungen können einen Unterschied machen. Wähle eine einzelne kleine Konfliktsituation und betrachte, was unmittelbar davor geschah."],["Du möchtest eigene Bedürfnisse ernster nehmen, ohne dich dafür schuldig zu fühlen. Das ist ein konkreter Wunsch nach mehr Raum für dich. Beginne mit einer kleinen Entscheidung, bei der du sowohl deinen Bedarf als auch das Wohlergehen deines Hundes berücksichtigen kannst.","Du wünschst dir mehr Gelassenheit, wenn Pläne sich ändern. Du musst dafür nicht auf Struktur verzichten. Suche dir eine kleine, sichere Abweichung und übe, zunächst wahrzunehmen, was du befürchtest und was tatsächlich passiert.","Du möchtest Nähe und Rückzug früher bemerken und klarer gestalten. Achte auf ein frühes Zeichen in deinem Körper oder deiner Stimmung. Eine freundliche Pause ist leichter zu gestalten, bevor dir alles zu viel wird.","Du möchtest bewusster erkennen, was bereits gut funktioniert. Wähle eine kleine Alltagsszene und halte fest, was du und dein Hund konkret getan habt. So wird aus dem allgemeinen Gefühl ein hilfreicher Anhaltspunkt für später.","Du möchtest erst beobachten, bevor du dich festlegst. Das ist ein sinnvoller eigener Wunsch. Notiere bei einer wiederkehrenden Szene getrennt, was du gesehen hast und was du dir dazu gedacht hast; beides darf zunächst offenbleiben."]],"exercises":[["Platz für dein Bedürfnis","Wähle diese Woche eine ruhige Alltagssituation. Schreibe zwei kurze Sätze auf: „Ich brauche gerade …“ und „Mein Hund braucht möglicherweise …“. Überlege dann eine kleine, für euch beide passende Handlung – zum Beispiel erst eine Ruhepause und danach einen Spaziergang."],["Eine kleine Planänderung","Lass bei einem vertrauten Spaziergang eine ungefährliche Kleinigkeit offen, etwa die Länge einer Schnüffelpause. Atme aus und notiere danach: Was hatte ich erwartet? Was ist tatsächlich passiert? Es geht um eine kleine Erfahrung, nicht darum, Sicherheit aufzugeben."],["Nähe und Pause früh erkennen","Nimm dir einmal am Tag einen kurzen Moment und frage dich: Möchte ich gerade Kontakt oder Ruhe? Achte auch darauf, ob dein Hund Nähe sucht oder Abstand nimmt. Gestalte eine kleine Pause, bevor einer von euch überfordert ist."],["Einen guten Moment festhalten","Notiere an zwei Tagen je einen Moment, in dem euer Miteinander angenehm war. Was hast du konkret getan? Was hast du beim Hund beobachtet? Wähle eine hilfreiche Kleinigkeit aus, die du wiederholen möchtest."],["Beobachten ohne dich festzulegen","Wähle eine wiederkehrende Alltagssituation und notiere an zwei Tagen drei Dinge: Was ist passiert? Was habe ich gefühlt oder gedacht? Was habe ich beim Hund tatsächlich gesehen? Vergleiche die Notizen, ohne sofort ein Muster bestimmen zu müssen."]],"kind":"relationship"};
function chooseOutcome(quiz, answers) {
  const scores = Object.fromEntries(Object.keys(quiz.results).map(k => [k, 0]));
  answers.forEach((answer, i) => {
    const key = quiz.questions[i].options[answer]?.key;
    if (key && Object.hasOwn(scores, key)) scores[key]++;
  });
  const ranked = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  if (ranked[0][1] < 3 || ranked[0][1] === ranked[1][1]) return quiz.mixed;
  return quiz.results[ranked[0][0]];
}

function detailedDogOutcome(quiz, answers) {
 const sections = answers.map((a,i) => [ ['Euer Wiedersehen','Wenn du belastet bist','Euer Rhythmus draußen','Deine Reaktion auf Schwierigkeiten','Dein Bild von euch'][i], 'Du hast gewählt: „'+quiz.questions[i].options[a].text.replace(/^"|"$/g,'')+'“\n\n'+quiz.reflections[i][a] ]);
 const contact = ['viel Aufregung beim Wiedersehen','ein ruhiges, herzliches Wiedersehen','Raum für Ruhe beim Wiedersehen','wechselnde Begrüßungen'][answers[0]];
 const reaction = ['Ärger, den du früher bemerken möchtest','den Wunsch, auch bei Schwierigkeiten ruhig zu bleiben','einen starken Blick auf deinen eigenen Anteil','Humor im Umgang mit kleinen Pannen'][answers[3]];
 const synthesis = 'Du beschreibst '+contact+' und zugleich '+reaction+'. Diese Antworten müssen nicht zu einem einzigen Typ passen: Die erste beschreibt das Verhalten deines Hundes, die zweite deinen Umgang mit schwierigen Momenten. Dein Ansatzpunkt liegt dort, wo du selbst etwas gestalten kannst – bei deiner nächsten kleinen Reaktion.';
 const exerciseIndex = answers[3]===0 ? 0 : answers[0]===0 ? 1 : answers[2]===0 ? 2 : answers[3]===2 ? 3 : 4;
 return {title:'Euer Alltag – und dein Anteil daran',sections:[['Dein roter Faden',synthesis],...sections,['Zum Ausprobieren: '+quiz.exercises[exerciseIndex][0],quiz.exercises[exerciseIndex][1]]]};
}
function detailedRelationshipOutcome(quiz, answers) {
 const headings=['Wie du dich in Beziehungen erlebst','Euer gemeinsamer Alltag','Nähe und Freiraum','Dein Umgang mit Konflikten','Was du dir wünschst'];
 const sections=answers.map((a,i)=>[headings[i],'Du hast gewählt: „'+quiz.questions[i].options[a].text+'“\n\n'+quiz.reflections[i][a]]);
 const first=['dein Wunsch manchmal zurücksteht','Planung dir Orientierung gibt','Nähe und Abstand für dich wechseln','du beide Seiten berücksichtigen möchtest','du dein Erleben noch erkundest'][answers[0]];
 const last=['deine Bedürfnisse ernster nehmen','gelassener auf Veränderungen reagieren','Nähe und Rückzug früher wahrnehmen','gelungene Momente bewusster erkennen','zunächst genauer beobachten'][answers[4]];
 const summary='Du beschreibst, dass '+first+'. Gleichzeitig möchtest du '+last+'. Beides darf nebeneinanderstehen: Deine erste Antwort zeigt, wie du dich im Moment erlebst; dein Wunsch zeigt, wo du genauer hinschauen möchtest. Die folgenden Abschnitte greifen jede deiner Antworten auf.';
 const exercise=quiz.exercises[answers[4]];
 return {title:'Dein Blick auf eure Beziehung',sections:[['Dein roter Faden',summary],...sections,['Zum Ausprobieren: '+exercise[0],exercise[1]]]};
}
(() => {
  'use strict';
  const card = document.getElementById('card');
  let step = 0;
  let answers = Array(QUIZ.questions.length).fill(null);
  function el(tag, text, cls) {
    const node = document.createElement(tag);
    if (text !== undefined) node.textContent = text;
    if (cls) node.className = cls;
    return node;
  }
  function button(text, action) {
    const b = el('button', text, 'local-button'); b.type = 'button';
    b.addEventListener('click', action); return b;
  }
  function frame(title, intro) {
    card.replaceChildren();
    const header = el('div', undefined, 'card-hdr');
    header.append(el('div', 'Die unsichtbaren Fäden', 'e'));
    const heading = el('h2', title); heading.tabIndex = -1;
    header.append(heading, el('p', intro));
    const body = el('div', undefined, 'body'); card.append(header, body);
    heading.focus(); return body;
  }
  function welcome() {
    const body = frame(QUIZ.title, QUIZ.intro);
    body.append(el('p', 'Fünf Fragen helfen dir, deine Wahrnehmung zu sortieren. Wähle jeweils die Antwort, die gerade am besten passt.', 'local-copy'));
    body.append(el('p', 'Deine Auswahl bleibt in diesem Browserfenster. Das Ergebnis entsteht aus vorbereiteten Texten, ohne KI-Auswertung. Es ist ein Reflexionsimpuls, keine Diagnose über dich oder deinen Hund.', 'local-note'));
    body.append(button('Los geht’s', () => { step = 0; question(); }));
  }
  function question() {
    const q = QUIZ.questions[step];
    const body = frame(QUIZ.title, 'Frage ' + (step + 1) + ' von ' + QUIZ.questions.length);
    const field = el('fieldset', undefined, 'local-options'); field.append(el('legend', q.q));
    if (q.hint) field.append(el('p', q.hint, 'local-copy'));
    const next = button(step === QUIZ.questions.length - 1 ? 'Mein Ergebnis anzeigen' : 'Weiter →', () => {
      if (answers[step] === null) return;
      if (step < QUIZ.questions.length - 1) { step++; question(); } else result();
    });
    next.disabled = answers[step] === null;
    q.options.forEach((option, index) => {
      const label = el('label', undefined, 'local-option');
      const input = document.createElement('input'); input.type = 'radio'; input.name = 'answer'; input.value = index;
      input.checked = answers[step] === index;
      input.addEventListener('change', () => { answers[step] = index; next.disabled = false; });
      label.append(input, el('span', option.text)); field.append(label);
    });
    body.append(field, next);
    if (step > 0) body.append(button('← Zurück', () => { step--; question(); }));
  }
  function result() {
    const outcome = QUIZ.kind === 'relationship' ? detailedRelationshipOutcome(QUIZ, answers) : QUIZ.reflections ? detailedDogOutcome(QUIZ, answers) : chooseOutcome(QUIZ, answers);
    const body = frame(outcome.title, 'Dein Ergebnis aus fünf ausgewählten Antworten');
    if (!QUIZ.reflections) body.append(el('p', outcome.mixed ? 'Deine Antworten zeigen mehrere Richtungen oder noch Unsicherheit. Deshalb erhältst du einen offenen Reflexionsimpuls.' : 'Mehrere deiner Antworten passen zu diesem Schwerpunkt. Das beschreibt deine Auswahl in diesem Moment, keine feste Eigenschaft.', 'local-note'));
    for (const section of outcome.sections) {
      const box = el('section', undefined, 'local-result'); box.append(el('h3', section[0]), el('p', section[1])); body.append(box);
    }
    body.append(el('p', 'Verhalten hat viele mögliche Ursachen, etwa Lernerfahrungen, Umgebung oder Gesundheit. Ob dieser Text zu euch passt, entscheidest du. Er ersetzt keine persönliche Beratung.', 'local-note'));
    const text = QUIZ.title + '\n\n' + outcome.title + '\n\n' + outcome.sections.map(s => s[0] + '\n' + s[1]).join('\n\n') + '\n\nReflexionsimpuls aus vorbereiteten Texten · Tierakademie Zischgl';
    const label = el('label', 'Dein Ergebnis zum Kopieren', 'local-copy'); label.htmlFor = 'local-share';
    const area = el('textarea'); area.id = 'local-share'; area.readOnly = true; area.rows = 6; area.value = text;
    const copy = button('Ergebnis zum Kopieren markieren', () => { area.focus(); area.select(); });
    const exportBox = el('details', undefined, 'local-export');
    exportBox.append(el('summary', 'Ergebnis zum Kopieren öffnen'), label, area, copy, el('p', 'Nach dem Markieren: Strg+C oder auf dem Handy „Kopieren“ wählen.', 'local-note'));
    body.append(exportBox);

  }
  welcome();
})();

</script>
