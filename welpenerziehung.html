function QuestionBox({ apiTopic }) {
  const [text, setText] = useState("");
  const [response, setResponse] = useState("");
  const [loading, setLoading] = useState(false);
  const [count, setCount] = useState(0);

  const ask = async (e) => {
    e.stopPropagation();
    if (!text.trim() || loading || count >= 3) return;
    setLoading(true);
    setResponse("Einen Moment...");
    try {
      const res = await fetch(PROXY, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-20250514", max_tokens:1000,
          system:`Du bist eine hilfreiche Assistentin von Susanne Zischgl, zertifizierte Hundetrainerin (§11 TierSchG) und Physiotherapeutin mit 35 Jahren Erfahrung. Beantworte Fragen zur Welpenerziehung auf Deutsch, klar und praktisch. Du arbeitest mit allen vier Lernquadranten (R+, R−, P+, P−). Du siehst den Menschen als wichtigen Teil der Lösung. Aktuelles Thema: ${apiTopic}. Antworte in max. 120 Wörtern, konkret und direkt.`,
          messages:[{ role:"user", content:text.trim() }]
        })
      });
      const data = await res.json();
      setResponse(data.content[0].text);
      setCount(c => c + 1);
      setText("");
    } catch {
      setResponse("Es gab einen Fehler. Bitte versuch es nochmal.");
    }
    setLoading(false);
  };

  return React.createElement('div', { style:{ marginTop:20, paddingTop:16, borderTop:"0.5px solid #e5e7eb" }, onClick:e => e.stopPropagation() },
    React.createElement('div', { style:LS },
      "Deine Frage ", count < 3 && React.createElement('span', { style:{ fontWeight:400 }}, `(${3-count} verbleibend)`)
    ),

function Card({ t, isOpen, onToggle }) {

  return React.createElement('div', null,
    React.createElement('div', {
      onClick: onToggle,
      style:{ cursor:"pointer", borderRadius:12, padding:14, touchAction:"manipulation", userSelect:"none", WebkitTapHighlightColor:"transparent",
        border: t.featured ? (isOpen?"1.5px solid #111827":"1.5px solid #2C4A3E") : (isOpen?"1.5px solid #374151":"0.5px solid #e5e7eb"),
        background: t.featured ? (isOpen?"#e8f0ed":"#f0f5f3") : (isOpen?"#f9fafb":"#fff") }
    },

            React.createElement('div', { style:{ fontSize:28 }}, t.icon),
            React.createElement('div', null,

            React.createElement('div', { style:{ fontSize:20, marginBottom:8 }}, t.icon),

            React.createElement('div', { style:{ fontSize:12, color:"#6b7280", marginTop:2 }}, t.sub)

      t.blocks.map((b,i) => React.createElement(Block, { key:i, ...b })),
      React.createElement('div', { style:{ background:"#f9fafb", borderLeft:"2px solid #d1d5db", borderRadius:"0 8px 8px 0", padding:14, marginBottom:14 }},
        React.createElement('div', { style:LS }, "Mensch-Check"),
        React.createElement('p', { style:{ fontSize:13, color:"#4b5563", lineHeight:1.65, margin:0 }}, t.mensch)
      ),

        React.createElement('div', { style:LS }, "So gehst du vor"),

          t.steps.map((s,i) => React.createElement('li', { key:i, style:{ fontSize:13, color:"#1f2937", lineHeight:1.5 }}, s))
        )
      ),

        React.createElement('button', {
          onClick: e => { e.stopPropagation(); setShowTheory(v => !v); },

        }, (showTheory ? "▾" : "▸") + " Lerntheorie"),
        showTheory && React.createElement('div', { style:{ marginTop:12, paddingTop:12, borderTop:"0.5px solid #e5e7eb" }},
          React.createElement('div', { style:LS }, "Lerntheorie"),
          t.theory.map((th,i) => React.createElement('div', { key:i, style:{ display:"flex", gap:10, alignItems:"flex-start", marginBottom:8 }},
            React.createElement(Badge, { q:th.q, large:true }),
            React.createElement('span', { style:{ fontSize:13, color:"#1f2937", lineHeight:1.5 }}, th.t)
          )),
          t.id === 12 && React.createElement('p', { style:{ fontSize:12, color:"#6b7280", marginTop:8 }}, "P+ und P− sind bei echter Angst kontraindiziert.")
        )

    )

}

function App() {
  const [openIds, setOpenIds] = useState(new Set());
  const toggle = (id) => setOpenIds(prev => {
    const next = new Set(prev);
    next.has(id) ? next.delete(id) : next.add(id);
    return next;
  });

  return React.createElement('div', { style:{ fontFamily:"system-ui, -apple-system, sans-serif" }},
    React.createElement('div', { style:{ display:"flex", justifyContent:"space-between", alignItems:"flex-end", marginBottom:20, paddingBottom:14, borderBottom:"0.5px solid #e5e7eb" }},
      React.createElement('div', null,
        React.createElement('div', { style:{ fontSize:22, fontWeight:500, color:"#111827" }}, "Welpenerziehung"),
        React.createElement('div', { style:{ fontSize:13, color:"#6b7280", marginTop:4 }}, "Tierakademie Zischgl")
      ),
      React.createElement('span', { style:{ fontSize:11, color:"#9ca3af" }}, "© Susanne Zischgl")
    ),
    React.createElement(QuadrantExplainer),
    React.createElement('div', { style:{ display:"flex", flexDirection:"column", gap:10 }},
      TOPICS.map(t => React.createElement(Card, { key:t.id, t, isOpen:openIds.has(t.id), onToggle:() => toggle(t.id) }))
    )
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
