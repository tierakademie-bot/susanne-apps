te gehören in die Unsicherheiten. Bei kleinen Datenmengen (insgesamt wenige Reaktionen, Anfragen oder Gespräche) ist die Sicherheit der Einschätzung niedrig und die Diagnose eine vorläufige Einschätzung. Behaupte dann nicht, dass ein Kanal funktioniert, dass das Problem sicher beim Übergang von Anfrage zu Buchung liegt, dass die Verbindung abbricht oder dass es kein Reichweitenproblem ist. Sage stattdessen, dass die Datenmenge noch nicht ausreicht, um Kanal-, Angebots- und Übergangsproblem sicher zu unterscheiden. Zähle Personen nicht doppelt: Ist unklar, ob die Person aus einem Gespräch zu den genannten Anfragen gehört, behandle die Zahlen nicht als verschiedene Kontakte. Empfiehl keine erneute Kontaktaufnahme zu früheren Interessenten oder abgebrochenen Gesprächen, solange die Person nicht angegeben hat, dass das Gespräch noch offen ist, eine Fortsetzung vereinbart wurde oder eine erneute Nachricht passend ist. Beschreibe bei Ernährung und Gesundheit nie, woran man eine Allergie, Unverträglichkeit oder Krankheit erkennt; nenne stattdessen, welche Angaben die Beratung benötigt und wann Beschwerden zuerst tierärztlich abgeklärt werden sollten. Erfolgskriterien beschreiben nur eigene Handlungen und Dokumentation (zum Beispiel Nachrichten versendet, nächster Schritt klar erklärt, Antworten festgehalten), niemals Reaktionen oder Gespräche anderer Menschen. Empfiehl einen neuen Kanal nur, wenn die Person laut Angabe dafür offen ist, und nur aus den von ihr gewählten Kanälen. Empfiehl niemals, überall gleichzeitig aktiv zu sein. Ziel sind nicht möglichst viele Kanäle, sondern mehrere sinnvoll verbundene Wege, über die Menschen dich finden, verstehen, kennenlernen und buchen können. Erfinde keine Kundenstimmen, Fallbeispiele oder Arbeitsergebnisse; fehlen Beweise, schlage vor, echte Beispiele zu sammeln. Gib Klartext ohne Markdownzeichen aus. Gliedere mit kurzen Überschriften und Leerzeilen. Beende jeden Text vollständig. Prüfe intern: Fakten erfunden? Reichweite passend? function callAI(sys,user,history,cb,errcb,model){
  model=model||MODEL;
  var msgs=history?history.concat([{role:"user",content:user}]):[{role:"user",content:user}];
  fetch("https://tierakademie-proxy.tierakademie.workers.dev",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:model,max_tokens:1800,system:sys+"\n\n"+GUARDRAILS,messages:msgs})
  }).then(function(r){if(!r.ok){var e=new Error("Fehler "+r.status);e.retryModel=(r.status>=400&&r.status<500&&r.status!==429);throw e;}return r.json();})
  .then(function(d){if(d.error){var e2=new Error(d.error.message||"Fehler");e2.retryModel=true;throw e2;}var out=cleanAI(d.content&&d.content[0]?d.content[0].text:"");if(!out)throw new Error("Leere Antwort");cb(out);})
  .catch(function(e){
    if(e.retryModel&&model!==FALLBACK_MODEL){callAI(sys,user,history,cb,errcb,FALLBACK_MODEL);return;}
    errcb(e.message||"Verbindungsfehler");
  });
}

function needsReview(s){
  return /(allergische Symptome|oft liegt.{0,50}(Futter|Fütterung)|bevor.{0,80}Tierarzt|Futter.{0,40}(löst|heilt|verursacht|triggert)|Tierarztkosten|kostenlos|zertifiziert|\bKollegin\b|\bKollege\b|an alle [0-9]+|leerer Raum|zahlen keine Rechnungen|innerhalb von 24 Stunden|Anfragequote ist gut|Conversion.{0,30}(bricht|zusammen)|keine Rückmeldung.{0,50}kein.{0,20}Interesse|mindestens.{0,80}(antwort|buch|Interesse)|garantiert|das funktioniert|identifiziere.{0,100}(Person|Tierhalter).{0,100}Direktnachricht|erkennst.{0,80}(Allergie|Unverträglichkeit)|(Allergie|Unverträglichkeit).{0,60}erkenn|kein Reichweitenproblem|Skool (generiert|funktioniert)|Verbindung bricht|Angebot.{0,30}(klar|gut|schlüssig) strukturiert|führt zu einem Gespräch|Conversion|lädt sich)/i.test(s);
}

function callCheckedAI(sys,user,history,cb,errcb){
  callAI(sys,user,history,function(first){
    if(!needsReview(first)){cb(first);return;}
    var review="Prüfe den folgenden Entwurf streng gegen alle Qualitätsregeln. Korrigiere insbesondere medizinische Kausalbehauptungen, erfundene Qualifikationen oder Gratisangebote, falsche Gleichstellung mit Tierärzten, pauschale Massenansprache und respektlosen Ton. Symptome nie als Diagnose bezeichnen; bei Beschwerden tierärztliche Abklärung vor ergänzender Beratung nennen. Erhalte die hilfreiche Marketingaussage, aber ändere riskante Stellen. Gib nur die vollständig korrigierte Endfassung in Klartext aus.\n\nVERIFIZIERTE ANGABEN:\n"+user+"\n\nENTWURF:\n"+first;
    callAI(SYS,review,null,cb,function(){errcb("Die Sicherheitsprüfung konnte nicht abgeschlossen werden. Bitte erneut versuchen.");});
  },errcb);
}

function parseJSONResponse(text){
  var s=String(text||"").replace(/```json|```/gi,"").trim(),start=s.indexOf("{"),end=s.lastIndexOf("}");
  if(start<0||end<start)throw new Error("Die Antwort hatte nicht das erwartete Format.");
  return JSON.parse(s.slice(start,end+1));
}

function callJSON(sys,user,cb,errcb){
  callAI(sys+"\n\nAntworte ausschließlich mit einem gültigen JSON-Objekt. Kein Text vor oder nach dem JSON.",user,null,function(raw){
    try{cb(parseJSONResponse(raw));}catch(e){errcb(e.message);}
  },errcb);
}

function callJSONChecked(sys,user,cb,errcb){
  callJSON(sys,user,function(data){
    var raw=JSON.stringify(data);
    if(!needsReview(raw)){cb(data);return;}
    var review="Prüfe dieses JSON streng gegen alle Qualitätsregeln. Entferne Garantien, Kaltakquise an Fremde, erfundene Fakten, medizinische Behauptungen und unzulässige Schlussfolgerungen. Bewahre exakt dieselben JSON-Schlüssel und Datentypen. Gib nur das korrigierte JSON zurück.\n\nVERIFIZIERTE ANGABEN:\n"+user+"\n\nJSON:\n"+raw;
    callJSON(SYS,review,cb,function(){errcb("Die Sicherheitsprüfung konnte nicht abgeschlossen werden. Bitte erneut versuchen.");});
  },errcb);
}

}

function saveCurrentAnswer(){
  var type=QUESTIONS[dCurQ].type,a;
  if(type==="goal")a={choice:selectedValue("goal"),detail:$("goal-detail").value.trim()};
  else if(type==="offer")a={model:selectedValue("offer-model"),offer:$("offer-name").value.trim(),priceStatus:$("offer-price-status").value,price:$("offer-price").value.trim(),action:$("offer-action").value};
  else if(type==="text"||type==="channelDetails")a=$("qa").value.trim();
  else if(type==="channels")a=selectedValues("channels");
  else if(type==="situation")a={items:selectedValues("situation"),other:$("situation-other").value.trim()};
  else if(type==="content")a={items:selectedValues("content")};
  else if(type==="results")a={reactions:$("res-reactions").value.trim(),inquiries:$("res-inquiries").value.trim(),talks:$("res-talks").value.trim(),sales:$("res-sales").value.trim(),who:$("res-who").value.trim(),why:$("res-why").value.trim(),answered:$("res-answered").value,speed:$("res-speed").value.trim(),last:$("res-last").value.trim(),unknown:$("res-unknown").checked,overlap:$("res-overlap").value,age:$("res-age").value,open:$("res-open").value,agreed:$("res-agreed").value,fit:$("res-fit").value};
  else if(type==="path")a={choice:selectedValue("path"),other:$("path-other").value.trim()};
  else if(type==="openness"){var oc=selectedValue("open");a={choice:oc,channels:oc===OPEN_OPTS[1]?selectedValues("openchannels"):[]};}
  else if(type==="capacity")a={time:$("cap-time").value,budget:$("cap-budget").value.trim(),formats:selectedValues("formats"),noGo:$("cap-nogo").value.trim()};
  dAnswers[dCurQ]=a;return validateAnswer(type,a);
}

function validateAnswer(type,a){
  if(type==="goal"&&(!a.choice||!a.detail))return "Bitte wähle ein Ziel und beschreibe es kurz.";
  if(type==="offer"&&(!a.model||!a.offer||!a.priceStatus||!a.action))return "Bitte wähle Angebotsart, Preisstatus und nächsten Schritt und beschreibe dein Angebot.";
  if(type==="offer"&&a.priceStatus==="Preis steht fest"&&!a.price)return "Bitte trage den festgelegten Preis ein.";
  if((type==="text"||type==="channelDetails")&&!a)return "Bitte beantworte die Frage – 'Ich weiß es nicht' ist ebenfalls möglich.";
  if(type==="channels"&&!a.length)return "Bitte wähle mindestens eine Möglichkeit.";
  if(type==="situation"&&!a.items.length&&!a.other)return "Bitte wähle mindestens eine Situation oder ergänze sie.";
  if(type==="content"&&!a.items.length)return "Bitte wähle mindestens eine Möglichkeit.";
  if(type==="content"&&a.items.indexOf("Kaum Content")>=0&&a.items.length>1)return "'Kaum Content' kann nicht zusammen mit anderen Inhalten gewählt werden.";
  if(type==="channels"&&a.indexOf("Bisher gar nicht")>=0&&a.length>1)return "'Bisher gar nicht' kann nicht zusammen mit anderen Marketingwegen gewählt werden.";
  if(type==="results"&&!a.unknown&&!a.reactions&&!a.inquiries&&!a.talks&&!a.sales)return "Bitte trage mindestens ein Ergebnis ein oder wähle 'nicht gemessen'.";
  if(type==="results"&&num(a.inquiries)>0&&(!a.who||!a.answered))return "Bei vorhandenen Anfragen: Bitte gib an, wer angefragt hat und ob du geantwortet hast.";
  if(type==="results"&&num(a.inquiries)>0&&num(a.talks)>0&&!a.overlap)return "Bitte gib an, ob die Person aus dem Gespräch eine der genannten Anfragen war – 'Ich weiß es nicht' ist möglich.";
  if(type==="path"&&!a.choice)return "Bitte wähle den aktuellen nächsten Schritt.";
  if(type==="path"&&a.choice==="Etwas anderes"&&!a.other)return "Bitte beschreibe den nächsten Schritt kurz im Feld darunter.";
  if(type==="openness"&&!a.choice)return "Bitte wähle eine Antwort – 'Ich weiß es noch nicht' ist auch möglich.";
  if(type==="openness"&&a.choice===OPEN_OPTS[1]&&!a.channels.length)return "Bitte wähle mindestens einen Kanal.";
  if(type==="capacity"&&(!a.time||!a.budget||!a.formats.length))return "Bitte wähle deine verfügbare Zeit, dein Marketingbudget und mindestens ein umsetzbares Format.";
  return "";
}

function answersSummary(){

}

function answerText(i,a){
  var t=QUESTIONS[i].type;
  if(!a)return "keine Angabe";
  if(Array.isArray(a))return a.join(", ");
  if(typeof a==="string")return a;
  if(t==="goal")return a.choice+" – "+a.detail;
  if(t==="offer")return "Hauptsächlich verkauft wird: "+a.model+"; Angebot: "+a.offer+"; Preisstatus: "+a.priceStatus+"; Betrag: "+(a.price||"nicht angegeben")+"; nächster Kundenschritt: "+a.action;
  if(t==="situation")return a.items.join("; ")+(a.other?"; "+a.other:"");
  if(t==="content")return a.items.join(", ");
  if(t==="results"){
    if(a.unknown)return "bisher nicht gemessen";
    return "Reaktionen: "+(a.reactions||"0")+"; Anfragen: "+(a.inquiries||"0")+"; Gespräche: "+(a.talks||"0")+"; Verkäufe: "+(a.sales||"0")+"; Art der Anfragenden: "+(a.who||"unbekannt")+"; bekanntes Kaufhindernis: "+(a.why||"unbekannt")+"; beantwortet: "+(a.answered||"unbekannt")+"; Reaktionszeit: "+(a.speed||"unbekannt")+"; letzter Schritt: "+(a.last||"unbekannt")+"; Person aus dem Gespräch war eine der genannten Anfragen: "+(a.overlap||"nicht angegeben")+"; letzte Anfrage/letztes Gespräch liegt zurück: "+(a.age||"nicht angegeben")+"; Gespräch noch offen: "+(a.open||"nicht angegeben")+"; weitere Kontaktaufnahme vereinbart: "+(a.agreed||"nicht angegeben")+"; erneute Nachricht laut Person passend: "+(a.fit||"nicht angegeben");
  }
  if(t==="path")return a.choice+(a.other?" – "+a.other:"");
  if(t==="openness")return a.choice+(a.channels&&a.channels.length?" ("+a.channels.join(", ")+")":"");
  if(t==="capacity")return "Zeit: "+a.time+"; Budget: "+(a.budget||"nicht angegeben")+"; mögliche Formate: "+a.formats.join(", ")+"; ausgeschlossen: "+(a.noGo||"nichts angegeben");
  return JSON.stringify(a);
}

function buildClarifications(){
  var items=[],offer=dAnswers[qIdx("offer")]||{},res=dAnswers[qIdx("results")]||{};

  if(offer.action==="Noch nicht festgelegt")items.push({q:qIdx("offer"),message:"Bitte lege fest, was ein interessierter Mensch als Nächstes tun soll. Ohne diesen Schritt kann die App keinen passenden Call-to-Action erstellen."});
  if(offer.priceStatus==="Preis noch nicht festgelegt")items.push({q:qIdx("offer"),message:"Dein Preis ist noch nicht festgelegt. Du kannst das so lassen, aber für eine Verkaufsdiagnose ist zuerst eine Preisentscheidung oder ein klarer Weg zum individuellen Angebot nötig."});
  if(num(res.inquiries)>0&&/unklar|weiß nicht/i.test(res.who||""))items.push({q:qIdx("results"),message:"Bitte ordne soweit möglich ein, ob die Anfragen von potenziellen Kunden, Fachkollegen oder anderen Personen kamen."});
  if(num(res.inquiries)>0&&res.answered!=="Nein"&&res.answered!=="Weiß ich nicht mehr"&&(!res.speed||!res.last))items.push({q:qIdx("results"),message:"Bitte ergänze ungefähr, wie schnell du geantwortet hast und was dein letzter Schritt in der Unterhaltung war."});

function runStructuredDiagnosis(){
  dStep=1;dDiag="";dTask="";diagData=null;planData=null;renderMain();
  var facts=profileContext()+"\n\nANTWORTEN:\n"+answersSummary()+"\n\nSICHTBARKEITSSYSTEM (nur aus den Angaben abgeleitet):\n"+visibilityFacts()+(aiClarificationText?"\n\nZUSAETZLICHE KLAERUNGEN:\n"+aiClarificationText:"");
  var prompt="Analysiere, ob alle entscheidenden Informationen für eine belastbare Marketingdiagnose vorliegen. Wenn Zielgruppe der Reaktionen, Art eines ausgewählten Kanals, Verkaufsweg oder Herkunft wichtiger Kontakte unklar ist und dies die Empfehlung ändern würde, setze status auf needs_clarification und stelle höchstens 4 kurze Fragen. In diesem Status dürfen diagnosis und priority leer bleiben. Wenn genug Informationen vorliegen, setze status auf ready. Unterscheide Marketingkanal, Übergang von Anfrage zu Buchung und Bindung. Keine Kaltakquise an Fremde. REGELN FÜR DIE DIAGNOSE: (1) Bei insgesamt weniger als 10 Reaktionen, Anfragen und Gesprächen oder höchstens 2 Gesprächen ist confidence zwingend niedrig. Dann ist central_problem eine vorläufige Einschätzung und sagt, dass die Datenmenge noch nicht ausreicht, um Kanal-, Angebots- und Übergangsproblem sicher zu unterscheiden; priority_type ist dann klaerung, außer das SICHTBARKEITSSYSTEM zeigt eine klar belegte strukturelle Lücke (zum Beispiel nur ein Kanal, kein Handlungsweg, kein sichtbares Angebot); dann darf die Priorität diese Lücke sein, ohne Ergebnisversprechen. (2) Zähle Personen nicht doppelt: Antwortet die Person Nein oder Ich weiß es nicht auf die Frage, ob die Person aus dem Gespräch eine der Anfragen war, oder fehlt die Angabe, nenne das unter uncertainties und addiere die Zahlen nicht zu verschiedenen Kontakten. (3) evidence enthält nur nachprüfbare Tatsachen aus den Angaben, keine Bewertungen. (4) Bewerte das Angebot nicht. Fehlende Angebotsdetails wie Leistungsumfang, Ablauf nach dem Erstkontakt, Vergütungsmodell, Zielgruppe gehören in uncertainties. (5) Berücksichtige die Antwort zur Offenheit für andere Kanäle. (6) Empfiehl keine Wiederansprache früherer Interessenten, außer die Person hat angegeben, dass das Gespräch noch offen ist, eine Fortsetzung vereinbart wurde oder eine erneute Nachricht passend ist. (7) Die Beispiele weak_example und improved_example beziehen sich nur auf Formulierung oder Vorgehen, nicht auf eine Deutung der Zahlen. (8) business_type: Leite aus Beruf, Angebot und Kundensituation ab, ob das Geschäft überwiegend ein Suchgeschäft (Kunden suchen aktiv, meist bei akutem Problem), Vertrauensgeschäft (längerer Vertrauensaufbau, zum Beispiel Ausbildung oder Coaching), Wunschgeschäft (Emotion und Vorstellungskraft, zum Beispiel Fotografie) oder Vorsorgegeschäft (Vorbeugung, zum Beispiel Welpenberatung) ist; bei unklarer Lage mischform. business_type_reason ist ein Satz. (9) blind_spot: ein konkreter Satz, der nur aus den Angaben und dem SICHTBARKEITSSYSTEM belegbar ist, zum Beispiel nur ein einziger Kanal, kein klarer Handlungsweg, viel Fachwissen aber kein sichtbares Angebot oder Inhalte, die bei der Lösung beginnen, bevor der Kunde sein Problem erkannt hat. Steht laut Angaben nur ein Kanal zur Verfügung, sage sinngemäß, dass die Sichtbarkeit auf nur einem Bein steht und von diesem einen Kanal abhängt. Ist Flyer der einzige Weg, erkläre, dass Flyer lokal sinnvoll sein können, aber meist nur ein kurzer Kontakt sind und ohne digitale Vertiefung wie Website, Google oder Angebotsseite kaum weitere Begegnungen ermöglichen. (10) bottleneck: type ist genau einer aus: fehlende Klarheit, zu wenig Reichweite, falscher Kanal, nur ein Kanal, fehlende Auffindbarkeit, zu wenig Vertrauen, zu wenig Angebot, kein klarer Kaufweg, zu viel Fachsprache, zu wenig Kundenperspektive, unregelmäßige Sichtbarkeit, zu wenige Kontaktpunkte, zu wenig Beweis, noch nicht sicher bestimmbar. explanation sind ein bis zwei Sätze aus den Angaben. Bei unsicherer Datenlage wähle noch nicht sicher bestimmbar oder formuliere vorsichtig. (11) content_mix: Prozentwerte für erkennen, verstehen, vertrauen, beweis, angebot mit Summe 100, abhängig von Beruf, Geschäftsart und bisherigem Content. content_mix_note ist ein Satz mit der Begründung. Gibt es laut Angaben keine Fallbeispiele oder Kundenstimmen, setze beweis niedrig und erfinde keine Beweise. (12) profession_note: zwei Sätze, die konkret zum angegebenen Beruf sagen, was Kunden erkennen oder verstehen müssen, ohne Diagnosen, Heilversprechen oder Ursachenbehauptungen. (13) Empfiehl nie, überall gleichzeitig aktiv zu sein. JSON-Schema exakt: {\"status\":\"ready|needs_clarification\",\"questions\":[\"...\"],\"diagnosis\":{\"central_problem\":\"...\",\"confidence\":\"hoch|mittel|niedrig\",\"evidence\":[\"...\"],\"uncertainties\":[\"...\"],\"priority_type\":\"marketingkanal|uebergang|bindung|angebotsklaerung|klaerung\",\"priority\":\"...\",\"rationale\":\"...\",\"weak_example\":\"...\",\"improved_example\":\"...\",\"business_type\":\"suchgeschaeft|vertrauensgeschaeft|wunschgeschaeft|vorsorgegeschaeft|mischform\",\"business_type_reason\":\"...\",\"blind_spot\":\"...\",\"bottleneck\":{\"type\":\"...\",\"explanation\":\"...\"},\"content_mix\":{\"erkennen\":30,\"verstehen\":20,\"vertrauen\":20,\"beweis\":15,\"angebot\":15},\"content_mix_note\":\"...\",\"profession_note\":\"...\"}}. Kleine Stichproben vorsichtig bewerten.\n\n"+facts;
  callJSONChecked(SYS,prompt,function(data){
    if(data.status==="needs_clarification"){
      var qs=Array.isArray(data.questions)?data.questions.filter(Boolean).slice(0,4):[];
      if(!qs.length){dDiag="Fehler: Die Klärungsfragen konnten nicht erstellt werden.";renderMain();return;}
      clarifyItems=qs;clarifySource="ai";clarifyMode=true;dStep=0;renderMain();return;
    }
    if(data.status!=="ready"||!data.diagnosis||!data.diagnosis.central_problem){dDiag="Fehler: Die Diagnose war unvollständig. Bitte erneut versuchen.";renderMain();return;}
    diagData=data.diagnosis;if(smallSample())diagData.confidence="niedrig";dDiag=diagnosisText(diagData);renderMain();generateStructuredPlan(facts);
  },function(e){dDiag="Fehler: "+e;renderMain();});
}

function diagnosisText(d){
  var out=(d.confidence==="niedrig"?"Deine vorläufige Einschätzung":"Deine Diagnose")+"\n"+d.central_problem+"\n\nSicherheit der Einschätzung: "+(d.confidence||"nicht angegeben");
  if(d.business_type&&BTYPES[d.business_type])out+="\n\nGeschäftsart (Einschätzung)\n"+BTYPES[d.business_type]+(d.business_type_reason?"\n"+d.business_type_reason:"");
  if(d.blind_spot)out+="\n\nDein blinder Fleck\n"+d.blind_spot;
  if(d.bottleneck&&d.bottleneck.type)out+="\n\nDein größter Engpass\n"+d.bottleneck.type+(d.bottleneck.explanation?": "+d.bottleneck.explanation:"");
  if(d.profession_note)out+="\n\nFür deinen Beruf\n"+d.profession_note;
  if(d.evidence&&d.evidence.length)out+="\n\nWoran die Einschätzung erkennbar ist\n- "+d.evidence.join("\n- ");
  if(d.uncertainties&&d.uncertainties.length)out+="\n\nWas noch unsicher ist\n- "+d.uncertainties.join("\n- ");
  out+="\n\nWas jetzt Vorrang hat\n"+typeLabel(d.priority_type)+": "+(d.priority||"")+"\n"+(d.rationale||"");
  if(d.weak_example)out+="\n\nSchwaches Beispiel\n"+d.weak_example;
  if(d.improved_example)out+="\n\nVerbessertes Beispiel\n"+d.improved_example;
  return out;
}

function generateStructuredPlan(facts){
  var prompt="Erstelle auf Basis der fertigen Diagnose einen 7-Tage-Plan. Genau 3 Schritte, nur die festgelegte Priorität, insgesamt innerhalb der angegebenen Wochenzeit und des Budgets. Keine neue Strategie, keine Kaltakquise, keine garantierten Antworten oder Verkäufe. Ist die Priorität klaerung, bestehen die Schritte darin, vorhandene Kontakte und Gesprächsverläufe festzuhalten, offene Fragen zu klären und den eigenen Antwortweg auf Anfragen aufzuschreiben. Keine erneute Kontaktaufnahme zu früheren Interessenten, außer die Angaben nennen das Gespräch als offen, eine vereinbarte Fortsetzung oder eine laut Person passende erneute Nachricht. Erfolgskriterien beschreiben ausschließlich eigene Handlungen und Dokumentation (zum Beispiel: Nachrichten versendet, nächster Schritt klar erklärt, Antworten und Reaktionen festgehalten) und niemals, dass jemand antwortet, bucht oder ein Gespräch führt. Nenne keinen neuen Kanal, wenn die Person dafür nicht offen ist. Die Schritte gehen den größten Engpass und den blinden Fleck aus der Diagnose an, soweit die Priorität das zulässt. Nenne den Zeitraum nur als sieben Tage. JSON-Schema exakt: {\"weekly_time\":\"...\",\"priority_type\":\"...\",\"steps\":[{\"title\":\"...\",\"action\":\"...\",\"minutes\":30,\"goal\":\"...\"}],\"success_metrics\":[\"...\"]}.\n\nFAKTEN:\n"+facts+"\n\nDIAGNOSE:\n"+JSON.stringify(diagData);
  callJSONChecked(SYS,prompt,function(data){
    if(!Array.isArray(data.steps)||data.steps.length!==3){dTask="Fehler: Der Wochenplan war unvollständig. Bitte erneut versuchen.";renderMain();return;}
    planData=data;dTask=planText(data);renderMain();
  },function(e){dTask="Fehler: "+e;renderMain();});
}

function planText(p){
  var out="Dein Plan für die nächsten 7 Tage\nVerfügbare Zeit: "+(p.weekly_time||"laut deiner Angabe")+"\nArt: "+typeLabel(p.priority_type||diagData.priority_type);
  p.steps.forEach(function(s,i){out+="\n\n"+(i+1)+". "+s.title+"\n"+s.action+"\nZeit: "+s.minutes+" Minuten\nZiel: "+s.goal;});
  if(p.success_metrics&&p.success_metrics.length)out+="\n\nErfolg nach 7 Tagen prüfen\n- "+p.success_metrics.join("\n- ");
  return out;
}

function channelList(){return (dAnswers[qIdx("channels")]||[]).filter(function(x){return x!=="Bisher gar nicht"&&x!=="Etwas anderes";});}
function visibilityAreas(){
  var ch=dAnswers[qIdx("channels")]||[],ct=(dAnswers[qIdx("content")]||{items:[]}).items||[],path=(dAnswers[qIdx("path")]||{}).choice||"",offer=dAnswers[qIdx("offer")]||{};

    {k:"Vertrauen",ok:has(["YouTube","Blog","Newsletter / E-Mail-Liste","Community (z. B. Skool)"],ch)||has(["Fachwissen","Erklärbeiträge","Videos","Fallbeispiele"],ct),basis:"Fachbeiträge, Videos, Community, Newsletter oder Fallbeispiele"},
    {k:"Angebot",ok:ch.indexOf("Landingpage / Angebotsseite")>=0||/Angebotsseite/.test(path)||offer.action==="Angebotsseite öffnen",basis:"eine klare Angebotsseite"},
    {k:"Beweis",ok:has(["Fallbeispiele","Kundenstimmen"],ct),basis:"Erfahrungen, Arbeitsbeispiele oder Kundenstimmen"},
    {k:"Handlungsweg",ok:!!path&&NOPATH.indexOf(path)<0,basis:"Kontakt, Terminbuchung, Kauf oder Anmeldung"}
  ];
}
function visibilityFacts(){

function renderVisibilityPanel(){
  return '<div class="vis"><div class="rl" style="color:#2D4A3E">Dein Sichtbarkeitssystem – nach deinen Angaben</div>'+visibilityAreas().map(function(r){return '<div class="vis-row '+(r.ok?'ok':'no')+'"><span class="vis-ic">'+(r.ok?'&#10003;':'&#8212;')+'</span><span><strong>'+r.k+'</strong> – '+(r.ok?'erkennbar':'noch nicht erkennbar')+'<br><small>'+r.basis+'</small></span></div>';}).join('')+'<p class="field-help">Das ist keine Bewertung deiner Arbeit, sondern eine Übersicht aus deinen Antworten. Du brauchst nicht überall gleichzeitig aktiv zu sein, sondern mehrere sinnvoll verbundene Wege.</p></div>';
}
function normalizedMix(m){
  var keys=["erkennen","verstehen","vertrauen","beweis","angebot"],labels=["Erkennen","Verstehen","Vertrauen","Beweis","Angebot"];
  var vals=keys.map(function(k){return m?num(m[k]):0;}),sum=vals.reduce(function(a,b){return a+b;},0);
  if(!sum)return null;
  var out=vals.map(function(v){return Math.round(v*100/sum);}),diff=100-out.reduce(function(a,b){return a+b;},0);
  out[out.indexOf(Math.max.apply(null,out))]+=diff;
  return keys.map(function(k,i){return {label:labels[i],v:out[i]};});
}
function renderMixPanel(){
  var m=diagData&&normalizedMix(diagData.content_mix);if(!m)return '';
  return '<div class="vis"><div class="rl" style="color:#2D4A3E">Dein persönlicher Content-Mix – Richtwert</div>'+m.map(function(x){return '<div class="mix-row"><span class="mix-lbl">'+x.label+'</span><span class="mix-bar"><span class="mix-fill" style="display:block;width:'+x.v+'%"></span></span><span class="mix-val">'+x.v+' %</span></div>';}).join('')+(diagData.content_mix_note?'<p class="field-help">'+esc(diagData.content_mix_note)+'</p>':'')+'</div>';
}

function renderStepBar(){
  var steps=["Diagnose","Plan","Gespräch","Umsetzung"],cur=Math.min(dStep,3);
  var html='<div class="sbar">';
  for(var i=0;i<steps.length;i++){
    var done=i<cur,active=i===cur;
    html+='<div style="display:flex;flex-direction:column;align-items:center;gap:3px"><div class="sc '+(done?"done":active?"act":"idle")+'">'+(done?"&#10003;":i+1)+'</div><div class="sl" style="color:'+(active?"#2D4A3E":"#6B8A7E")+';font-weight:'+(active?"700":"400")+'">'+steps[i]+'</div></div>';
    if(i<steps.length-1)html+='<div class="sln" style="background:'+(done?"#4A7C6F":"#E8DCC8")+'"></div>';
  }
  return html+'</div>';
}

function renderChat(){
  var msgs="";
  if(dChat.length===0)msgs='<div style="font-size:12px;color:#6B8A7E;font-style:italic;text-align:center;padding:10px 0">Schreib deine erste Frage oder Reaktion...</div>';
  for(var i=0;i<dChat.length;i++){
    msgs+='<div style="display:flex;justify-content:'+(dChat[i].r==="u"?"flex-end":"flex-start")+'"><div class="bm '+(dChat[i].r==="u"?"u":"a")+'">'+formatAI(dChat[i].c)+'</div></div>';
  }
  return '<div class="chat-w" id="cw">'+msgs+'</div>'+
    '<div class="ci-row"><input type="text" id="ci" placeholder="Deine Antwort..." onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();sendChat()}" oninput="var b=$(&apos;csend&apos;);if(b)b.disabled=!this.value.trim()"><button id="csend" onclick="sendChat()" disabled>&#8594;</button></div>'+
    '<button class="btn-g" onclick="genCont()" style="margin-top:8px;width:100%">&#9997;&#65039; Passende Maßnahme erstellen</button>';
}

function renderContArea(){
  if(!dCont)return '<div class="spin-w"><div class="spin"></div></div>';
  var html='<div class="rbox"><div class="rl">&#9997;&#65039; Deine fertige Marketing-Maßnahme</div><p>'+formatAI(dCont)+'</p>';
  if(measureData&&measureData.content){
    html+='<p class="copy-hint">&#128070; Klick ins Feld &#8594; nur der fertige Text ist markiert &#8594; Strg+C</p>'+
      '<textarea class="copy-field" readonly rows="'+Math.min(14,Math.max(5,String(measureData.content).split("\n").length+2))+'" onclick="this.select()">'+esc(measureData.content)+'</textarea>';
  }
  return html+'</div>';
}

function renderContent(){
  var opts=CATS.map(function(c){return '<option'+(c===cCat?" selected":"")+'>'+c+'</option>';}).join("");
  var popts=PILLAR_OPTS.map(function(c){return '<option'+(c===cPillar?" selected":"")+'>'+c+'</option>';}).join("");
  return '<p style="font-size:13px;color:#6B8A7E;line-height:1.65;margin-bottom:12px">Konkrete Beitragsideen für deinen Beruf – passend zu Kanal, Inhaltssäule und dem nächsten Schritt, den Kunden bei dir gehen können.'+(diagData?' Deine Kompass-Diagnose fließt dabei ein.':' Mit abgeschlossener Kompass-Diagnose werden die Ideen noch passender.')+'</p>'+
    '<span class="lbl" style="margin-top:0">Kanal oder Maßnahme</span><select id="ccat" onchange="cCat=this.value">'+opts+'</select>'+
    '<span class="lbl">Inhaltssäule</span><select id="cpillar" onchange="cPillar=this.value">'+popts+'</select>'+
    '<span class="lbl">Angebot oder Thema</span><input type="text" id="ctop" placeholder="z. B. Ernährungsberatung, Neukundenaktion..." value="'+esc(cTopic)+'" oninput="cTopic=this.value">'+
    '<button class="btn-p" id="cgenbtn" onclick="genContent()">&#9997;&#65039; Marketing-Ideen erstellen</button>'+
    (cResult?'<div class="rbox" style="margin-top:12px"><p>'+formatAI(cResult)+'</p></div>':"");
}

function sendChat(){
  var ci=$("ci");if(!ci||!ci.value.trim())return;
  var msg=ci.value.trim();dChat.push({r:"u",c:msg});ci.value="";
  var b=$("csend");if(b)b.disabled=true;
  var cw=$("cw");
  if(cw){cw.innerHTML+='<div style="display:flex"><div class="bm a"><div style="display:flex;gap:4px"><div style="width:6px;height:6px;border-radius:50%;background:#8FAF9F;animation:bounce 1s ease 0s infinite"></div><div style="width:6px;height:6px;border-radius:50%;background:#8FAF9F;animation:bounce 1s ease .2s infinite"></div><div style="width:6px;height:6px;border-radius:50%;background:#8FAF9F;animation:bounce 1s ease .4s infinite"></div></div></div></div>';cw.scrollTop=cw.scrollHeight;}
  var summary=answersSummary();
  var hist=[{role:"user",content:profileContext()+"\n\n"+summary},{role:"assistant",content:dDiag+"\n\n"+dTask}];
  for(var i=0;i<dChat.length-1;i++)hist.push({role:dChat[i].r==="u"?"user":"assistant",content:dChat[i].c});
  callAI(SYS+"\n\nCoaching-Gespräch. Antworte kurz, klar und respektvoll, mit Rückfrage oder einem konkreten Hinweis. Nutze keine Angaben, die nicht im Profil oder Gespräch stehen. Maximal 100 Wörter.",msg,hist,
    function(rep){dChat.push({r:"a",c:rep});renderMain();setTimeout(function(){var cw=$("cw");if(cw)cw.scrollTop=cw.scrollHeight;},50);},
    function(e){dChat.push({r:"a",c:"Fehler: "+e});renderMain();});
}

function genCont(){
  dStep=3;dCont="";renderMain();
  var facts=profileContext()+"\n\nANTWORTEN:\n"+answersSummary()+"\n\nDIAGNOSE:\n"+JSON.stringify(diagData)+"\n\nPLAN:\n"+JSON.stringify(planData);
  var prompt="Erstelle genau ein direkt verwendbares Ergebnis passend zur festgelegten Priorität. Wiederhole weder Diagnose noch Wochenplan. Wähle ein Format: antwortvorlage (Antwort auf eine Anfrage), beitrag (ein Beitrag für genau einen Kanal), flyertext oder gespraechsablauf (Ablauf eines Erstgesprächs). Bei den Prioritäten klaerung und uebergang passt meist antwortvorlage oder gespraechsablauf; bei marketingkanal beitrag oder flyertext, und zwar nur für einen Kanal, für den die Person offen ist. content ist der fertige Text, den die Person kopieren und mit wenig Anpassung nutzen kann, höchstens 180 Wörter, mit [Platzhaltern] für fehlende Angaben wie Preis, Link oder Termin. Im content stehen keine Erklärungen, Pläne oder Erfolgskennzahlen. adjust_notes: höchstens 3 kurze Hinweise, was die Person vor der Nutzung anpassen oder prüfen soll. Keine ungefragte Direktnachricht an fremde Personen. Bei bestehenden Kontakten nur, wenn laut Angaben das Gespräch noch offen ist, eine Fortsetzung vereinbart wurde oder die Person eine erneute Nachricht für passend hält. Der Call-to-Action entspricht exakt den Nutzerangaben. Keine Garantien. Bei Beschwerden eines Tieres tierärztliche Abklärung nennen, keine Ursachen oder Diagnosen. JSON-Schema exakt: {\"measure_type\":\"uebergang|marketingkanal|bindung|angebotsklaerung|klaerung\",\"format\":\"antwortvorlage|beitrag|flyertext|gespraechsablauf\",\"title\":\"...\",\"content\":\"...\",\"adjust_notes\":[\"...\"]}.\n\n"+facts;
  callJSONChecked(SYS,prompt,function(c){
    if(c&&Array.isArray(c.content))c.content=c.content.join("\n");
    if(!c||!c.title||!c.content){dCont="Fehler: Die Maßnahme war unvollständig. Bitte erneut versuchen.";renderMain();return;}
    measureData=c;dCont=measureText(c);renderMain();
  },
    function(e){dCont="Fehler: "+e;renderMain();});
}

function measureText(m){
  var out="Deine fertige Maßnahme\n"+(FORMATS[m.format]||"Vorlage")+" · "+typeLabel(m.measure_type)+"\n"+m.title+"\n\n"+m.content;
  if(m.adjust_notes&&m.adjust_notes.length)out+="\n\nVor dem Einsatz anpassen\n- "+m.adjust_notes.join("\n- ");
  return out;
}

function genContent(){
  if(!cTopic.trim()){alert("Bitte trage zuerst dein konkretes Angebot oder Thema ein.");return;}
  var btn=$("cgenbtn");if(btn)btn.disabled=true;
  cResult="";renderMain();
  var facts=profileContext()+"\nKanal/Maßnahme: "+cCat+"\nInhaltssäule: "+cPillar+"\nAngebot/Thema: "+cTopic;
  if(diagData)facts+="\n\nANGABEN AUS DEM KOMPASS:\n"+answersSummary()+"\nKOMPASS-DIAGNOSE:\n"+JSON.stringify(diagData);
  var prompt="Erstelle genau 3 konkrete Beitragsideen für genau diesen Beruf innerhalb genau eines passenden Kanals. Jede Idee gehört zu einer Inhaltssäule (erkennen, verstehen, vertrauen, beweis, angebot oder entscheiden). Ist die Säule automatisch gewählt und liegt ein content_mix vor, nimm die Säulen mit dem höchsten Anteil. Der title ist eine konkrete Beitragsüberschrift aus Kundensicht, nicht nur eine Kategorie. Der cta passt zur Geschäftsart und nennt nur Wege, die laut Angaben existieren, zum Beispiel Termin ansehen, Erstgespräch vereinbaren, mehr über die Behandlung erfahren, Kurs ansehen, Platz reservieren, Angebot kennenlernen, Community beitreten, Nachricht senden oder Buchungsseite öffnen; nicht pauschal Jetzt kaufen. Bei automatischer Kanalwahl nimm nur einen Kanal, den die Person bereits nutzt oder für den sie offen ist. Keine Kaltakquise. Keine erfundenen Fakten, Fallbeispiele oder Ergebnisgarantien. Bei Gesundheitsthemen keine Diagnosen oder Heilversprechen, sondern Beobachtungen und den Hinweis auf tierärztliche Abklärung. Wenn ein erforderlicher Link oder Preis fehlt, nutze [Platzhalter]. JSON-Schema exakt: {\"channel\":\"...\",\"ideas\":[{\"pillar\":\"...\",\"title\":\"...\",\"content\":\"...\",\"cta\":\"...\",\"measurement\":\"...\"}]}.\n\n"+facts;
  callJSONChecked(SYS,prompt,function(r){
    if(!r||!Array.isArray(r.ideas)||r.ideas.length!==3){cResult="Fehler: Die Ideen waren unvollständig. Bitte erneut versuchen.";renderMain();return;}
    cResult="Gewählter Kanal: "+r.channel+r.ideas.map(function(x,i){return "\n\nIdee "+(i+1)+": "+x.title+(x.pillar?"\nSäule: "+x.pillar:"")+"\n"+x.content+"\nNächster Schritt: "+x.cta+"\nMessung: "+x.measurement;}).join("");renderMain();
  },
    function(e){cResult="Fehler: "+e;renderMain();});
}

function resetDiag(){dStep=0;dAnswers=[];dCurQ=0;dDiag="";dTask="";dChat=[];dCont="";clarifyMode=false;clarifyItems=[];clarifySource="form";aiClarificationText="";clarificationRounds=0;diagData=null;planData=null;measureData=null;renderMain();}

document.addEventListener("change",function(e){
  if(e.target&&e.target.name==="prof"){var ow=$("other-wrap");if(ow)ow.className=selectedValues("prof").indexOf("Andere Tätigkeit")>=0?"":"hidden";}
  if(e.target&&e.target.name==="open"){var w=$("open-wrap");if(w)w.className=e.target.value===OPEN_OPTS[1]?"":"hidden";}
});
document.addEventListener("input",function(e){
  if(e.target&&(e.target.id==="res-inquiries"||e.target.id==="res-talks")){
    var x=$("res-extra"),a=$("res-inquiries"),t=$("res-talks");
    if(x)x.className=((a&&num(a.value)>0)||(t&&num(t.value)>0))?"":"hidden";
  }
});
render();
