<script>
var CATS=["Automatisch passenden Kanal wählen","Instagram","Facebook","LinkedIn","TikTok","YouTube","Pinterest","Google-Unternehmensprofil","Website / Angebotsseite","Flyer / Plakat","Kooperationen","E-Mail / Newsletter","Skool Community (Austausch)","Skool Classroom (Lernen)"];
var ANIMALS=["Hunde","Katzen","Pferde","Vögel","Kleintiere (zum Beispiel Kaninchen, Meerschweinchen)","Reptilien und Exoten","Nutztiere, Lamas und Alpakas","Andere Tierart oder vor allem Menschen"];
var PROFESSIONS=["Hundetraining / Hundeschule","Hundeverhaltensberatung","Hundetrainerausbildung","Pferdetraining","Reitunterricht","Tierphysiotherapie","Tierosteopathie","Tierheilpraxis","Tierernährungsberatung","Tierpsychologie / Verhaltensberatung","Grooming / Tierpflege","Tierfotografie","Tierbetreuung / Gassi-Service","Zucht","Tierkommunikation","Tiergestützte Arbeit","Coaching mit Tierbezug","Online-Angebote","Produkte / Shop","Andere Tätigkeit"];
var SYS="Du bist Susanne, erfahrene Business-Coachin fuer Menschen in Tierberufen mit 35 Jahren Erfahrung. Du arbeitest mit dem Tierberufler-Kompass (5 Bereiche: 1.Beziehung Mensch&Tier 2.Businessstruktur 3.Mentale Muster 4.Wert&Geld 5.Positionierung). Warm, klar, respektvoll und ohne Floskeln. Deutsch, du-Ansprache. Verwende niemals automatisch Hundebeispiele. Richte Sprache, Kundensituationen und Beispiele konsequent am angegebenen Tierberuf und Schwerpunkt aus. Wenn keine Tierart genannt ist, bleibe tierartenneutral. Grundsatz: Posten allein ist noch kein Sichtbarkeitssystem. Prüfe zuerst Beruf, Angebot, Kundensituation, Sichtbarkeitswege, vorhandene Inhalte und Kaufweg, bevor du Content empfiehlst.";
var GUARDRAILS="VERBINDLICHE QUALITAETSREGELN: Nutze ausschließlich Angaben, die die Person tatsächlich gemacht hat. Erfinde keine Qualifikation, Zertifizierung, Spezialisierung, Kundenerfahrung, Erfolgsgeschichte, Preise, Gratisangebote, Vorträge, Rabatte, Verfügbarkeiten oder Fallbeispiele. Fehlende Angaben erscheinen als [Platzhalter] oder Rückfrage. Beachte Regional/Online strikt. Erstelle nur die verlangte Anzahl an Maßnahmen. Keine willkürlichen Postingzeiten oder Antwortfristen. Bei kleinen Datenmengen wie ein oder zwei Anfragen niemals von guter Quote oder zusammengebrochener Conversion sprechen; nur als vorläufigen Hinweis formulieren. Aus null Gesprächen nicht schließen, dass die Person nicht geantwortet hat. Keine Rückmeldung bedeutet nicht automatisch fehlendes Interesse. Keine garantierten Ergebnisse wie 'mindestens eine Person wird buchen'. Empfiehl nie, frühere Interessenten oder Gesprächspartner erneut anzuschreiben oder nachzufassen. Keine abwertenden Formulierungen. Keine unbelegten medizinischen, therapeutischen oder ernährungsbezogenen Diagnose-, Heilungs-, Wirkungs- oder Kostenversprechen. Bei Beschwerden tierärztliche Abklärung nennen und Fachgrenzen respektieren. Ernährungsberatung nie als Ersatz für tierärztliche Diagnostik darstellen. Nutze im Diagnoseziel vier Wochen, aber im konkreten Aktionsplan ausschließlich sieben Tage und vermische die Zeiträume nicht. Schreibe in verständlichem, natürlichem Alltagsdeutsch ohne unklare Redewendungen und ohne Fachwort Conversion; sage stattdessen Übergang von Anfrage zu Buchung. Bewerte das Angebot der Person niemals als klar, gut oder schlüssig strukturiert, solange Leistungsumfang, Ablauf, Zielgruppe und Vergütungsmodell nicht aus den Angaben hervorgehen; fehlende Punkte gehören in die Unsicherheiten. Bei kleinen Datenmengen (insgesamt wenige Reaktionen, Anfragen oder Gespräche) ist die Sicherheit der Einschätzung niedrig und die Diagnose eine vorläufige Einschätzung. Behaupte dann nicht, dass ein Kanal funktioniert, dass das Problem sicher beim Übergang von Anfrage zu Buchung liegt, dass die Verbindung abbricht oder dass es kein Reichweitenproblem ist. Sage stattdessen, dass die Datenmenge noch nicht ausreicht, um Kanal-, Angebots- und Übergangsproblem sicher zu unterscheiden. Zähle Personen nicht doppelt: Ist unklar, ob die Person aus einem Gespräch zu den genannten Anfragen gehört, behandle die Zahlen nicht als verschiedene Kontakte. Maßnahmen betreffen nur eigene Handlungen: eigene Zahlen festhalten, eigenen Antwortweg und das eigene Angebot aufschreiben, eigene Beiträge vorbereiten. Angaben, die fehlen oder 'weiß ich nicht' lauten, sind unbekannt und nicht 'nicht vorhanden': schreibe nie 'ohne Website', 'hat keine Website' oder 'gibt es nicht', sondern 'in deinen Angaben nicht genannt'. Erfinde kein Geschäftsmodell oder Angebotsdetail (zum Beispiel 'Online-Geschäftsmodell'), das nicht angegeben wurde. Sprich die Nutzerin durchgehend direkt mit du an und bezeichne sie nie als 'die Person' oder 'sie'; über Interessenten sagst du 'Interessent' oder 'anfragende Person'. Behaupte nie, eine Community allein sei nicht tragfähig; sage stattdessen, dass die Sichtbarkeit von einem Kanal abhängt und Menschen außerhalb dieses Kanals dich vielleicht nicht finden. Schreibe nur vollständige Sätze mit Großschreibung am Anfang, ohne Rohlabels wie 'nur ein kanal:', und prüfe Rechtschreibung und zusammengeschriebene Wörter. Setze Reaktionen, Anfragen und Verkäufe nie als Quote oder Verhältnis zueinander (zum Beispiel '1 Verkauf aus 4 Reaktionen') und sprich bei wenigen Verkäufen nicht von 'ersten Erfolgen'; nenne die Zahlen einzeln. Behaupte nicht, dass Kanäle (nicht) miteinander verbunden sind, wenn dazu nichts angegeben ist; sage 'in deinen Angaben nicht genannt'. Erfinde keine Beobachtungen über das Verhalten von Kunden (zum Beispiel 'der Kontakt endet mit der Telefonnummer'). Kurzfassung, Priorität und Plan nennen dieselbe nächste Aufgabe. Beschreibe nie selbst, was die Leistung inhaltlich bewirkt oder wie sie wirkt; stelle nur Fragen, was die Person über ihr Angebot aufschreiben soll, und nutze keine Beispielformulierungen, die Wirkung behaupten. Beachte die FACHGRENZEN-REGELN FÜR DIESEN BERUF in den Angaben ausnahmslos. Beschreibe bei Ernährung und Gesundheit nie, woran man eine Allergie, Unverträglichkeit oder Krankheit erkennt; nenne stattdessen, welche Angaben die Beratung benötigt und wann Beschwerden zuerst tierärztlich abgeklärt werden sollten. Erfolgskriterien beschreiben nur eigene Handlungen und Dokumentation (zum Beispiel Nachrichten versendet, nächster Schritt klar erklärt, Antworten festgehalten), niemals Reaktionen oder Gespräche anderer Menschen. Empfiehl einen neuen Kanal nur, wenn die Person laut Angabe dafür offen ist, und nur aus den von ihr gewählten Kanälen. Empfiehl niemals, überall gleichzeitig aktiv zu sein. Ziel sind nicht möglichst viele Kanäle, sondern mehrere sinnvoll verbundene Wege, über die Menschen dich finden, verstehen, kennenlernen und buchen können. Nenne niemals ein Angebot, eine Qualifikation, einen Preis, ein Gratisangebot (zum Beispiel einen kostenlosen Check oder ein Erstgespräch) oder eine Zahl, die die Person nicht selbst angegeben hat; nutze dafür [Platzhalter]. Behaupte nichts Spekulatives über die Sichtbarkeit (zum Beispiel dass dich Menschen wahrscheinlich nicht finden); sage höchstens, was in deinen Angaben nicht genannt ist. Für Beiträge gilt eine einzige Anredeform für die Zielgruppe: Privatpersonen werden geduzt, Einrichtungen, Praxen und Firmen werden gesiezt; wechsle sie nie innerhalb eines Textes. Themenideen und Beitragsideen sind fertige Beitragstitel aus Kundensicht, die direkt als Überschrift taugen, keine Anweisungen an die Nutzerin (also nicht Erkläre, wie…, sondern zum Beispiel Was bei der ersten Stunde passiert). Sie beschreiben nie, woran man Symptome, Bedürfnisse oder Beschwerden beim Tier erkennt, und versprechen keine Wirkung; Ausnahme: Erlaubt es die Regel des Berufs ausdrücklich, gilt diese. Schritt-Titel haben keine eigene Nummerierung und kein Wort Schritt davor. Nutze einfache Wörter statt Kennzahlen-Deutsch: nicht Quote, Rate oder Conversion, sondern zum Beispiel wie viele Anfragen zu einer Buchung führen. Für Leistungen im Heilkunde-Umfeld nie Formulierungen wie was wirkt, wirksam oder hilft; sprich von Begleitung und Beobachtung. Vermeide in allen Texten Wirk- und Ergebnisformulierungen wie unterstützt die Genesung, schafft Klarheit, verschafft Sicherheit, hilft dir zu verstehen, Du weißt danach, Keine versteckten Kosten; beschreibe stattdessen, was ihr gemeinsam tut. Nenne auch als Möglichkeit keinen kostenlosen Einstieg (Checkliste, Gratisgespräch), wenn die Person ihn nicht genannt hat. Schreibe nie, was Tierhalter allgemein denken, fühlen oder wissen (nicht Viele Katzenhalter sind unsicher), und nie, dass ein Tier von einer Leistung profitiert. Ideentexte beginnen nie mit In diesem Beitrag stellst, teilst oder zeigst du; sie sprechen die Leserin an (In diesem Beitrag erfährst du). Behaupte nie, dass eine Tierart eine andere Unterstützung braucht als andere Tiere, und vergleiche die Arbeit der Nutzerin nie mit anderen Ansätzen. Schreibe nie Quote, Sichtbarkeitssystem oder Redewendungen wie Schuss ins Dunkle, und behaupte nie, wie schnell die Nutzerin antwortet. Ein Beitrag im 7-Tage-Plan ist kurz (höchstens 150 Wörter). Schreibe Beitragsideen und Beitragstexte immer aus der Sicht der Nutzerin als Absenderin (ich, mit mir) für ihre Kundschaft; sie beschreiben nie, was die Nutzerin tun soll (nicht welche Fragen du stellst). Beweis-Ideen und Fallbeispiele nur dann inhaltlich ausformulieren, wenn die Nutzerin einen echten Fall genannt hat; sonst schreibe nur [Platzhalter: echtes Fallbeispiel einfügen] und beschreibe nie ein Ergebnis oder eine Veränderung bei Tier oder Halter. Schreibe nie, was Kundinnen und Kunden nach dem Termin oder Beitrag fühlen, wissen, merken oder haben (also nicht Du merkst schnell, Du hast Klarheit, Keine Überraschungen). Behaupte nichts über Gewohnheiten anderer Reiter oder Halter (nicht Darum beginnen viele Wiedereinsteiger mit…). Nenne nur Schritte und Wege (zum Beispiel Buchungsseite), die laut Angaben existieren; Einheiten, Dauer und Preise nur als [Platzhalter]. Bezeichne die Ausbildung nie als Person (nicht wer die Ausbildung ist). Erfinde keine persönlichen Aussagen der Nutzerin (nicht Genau das frage ich mich selbst), keine Aussagen darüber, was viele Kundinnen und Kunden dich fragen, und keine Methodendetails oder Ablaufschritte (zum Beispiel Rampe, Sattel, Körperspannung), die sie nicht genannt hat; beschreibe ihren Ablauf nur allgemein oder mit [Platzhalter]. Nenne kein Ziel oder Ergebnis wie dass Hund, Pferd oder Mensch sicherer werden oder Vertrauen bekommen. Werte keine anderen Wege wie Selbstlernen oder kurze Kurse ab. Titel beginnen nie mit Woran merkst du oder Woran erkennst du. Ideentitel sprechen die Leserin oder den Leser an, nicht die Nutzerin (nicht So arbeitest du bei…, sondern So arbeite ich bei…). Behaupte nie, welche Fragen dir Tierhalter am häufigsten stellen oder was du am meisten hörst; schreibe stattdessen, welche Fragen hilfreich sein können. Gib Klartext ohne Markdownzeichen aus. Gliedere mit kurzen Überschriften und Leerzeilen. Beende jeden Text vollständig. Prüfe intern: Fakten erfunden? Reichweite passend? Stichprobe überinterpretiert? Fachgrenzen gewahrt? Zeitraum korrekt? Ton respektvoll? Text vollständig? Gib nur die korrigierte Endfassung aus.";
var KANALTXT="KANALROLLEN (Susannes Konzept, verbindlich bei Kanalempfehlung, Beitragsideen und Beiträgen): Jeder Kanal erfüllt eine andere Aufgabe; ein Beitrag wird nicht identisch auf allen Kanälen verteilt. Frage zuerst: Was soll der Beitrag erreichen und welcher Kanal passt dafür? Instagram = zeigen und neugierig machen (visuell, schneller Einstieg, Reels, Karussells, kurze Impulse, Alltagseinblicke; nicht für komplizierte Fachthemen). Facebook = erzählen und ins Gespräch kommen (Geschichten, längere Beiträge, Fragen an die Gruppe, Veranstaltungen, regionale Angebote; nicht nur Verkaufsbeiträge). LinkedIn = positionieren, wofür du fachlich und unternehmerisch stehst (Fachkompetenz, Haltung, Erfahrung, Preisgestaltung; besonders für Tierberufler, die mit Unternehmen arbeiten, Seminare, Vorträge oder Fortbildungen anbieten oder andere Tierberufler erreichen). TikTok = schnell Aufmerksamkeit erzeugen (kurze Videos, Aha-Momente, Humor; nur wenn Video liegt und die Zielgruppe dort ist). YouTube = erklären und Vertrauen aufbauen (Tutorials, Fachvideos, Interviews, Fallbesprechungen; wird über Monate und Jahre gefunden). Pinterest = langfristig gefunden werden (Checklisten, Ratgeber, Infografiken, Blogartikel; suchorientiert, nicht für Diskussion). Skool Community = miteinander sprechen (Fragen, Austausch, Feedback, Umfragen; Mitglieder sollen miteinander sprechen, nicht nur Beiträge der Leitung lesen). Skool Classroom = strukturiert lernen (Kurse, Anleitungen, Videos, Checklisten, Vorlagen; Wissen gehört dauerhaft hierher statt als Fachpost in die Community). Niemand muss auf allen Plattformen sein: höchstens ein Hauptkanal für Sichtbarkeit, ein Kanal für Vertiefung oder Expertise und eventuell ein eigener Raum für Kunden oder Community. Entscheide Kanalempfehlungen anhand von vier Fragen: Wo ist die Zielgruppe? Welche Inhalte liegen der Person? Was ist das Ziel? Kann sie den Kanal langfristig bedienen? Die Fachgrenzen-Regeln dieses Berufs gelten auf jedem Kanal; Kanalbeispiele wie Vorher-Nachher-Beiträge, Anzeichen- oder Fehlerlisten und Erkennungsbeiträge zu Verhalten oder Gesundheit sind nur erlaubt, wenn die Fachgrenzen es zulassen.";

      if(!r.ok){
        var e=new Error("Fehler "+r.status);

      }

    })
    .then(function(d){
      if(d.error){var e2=new Error(d.error.message||"Fehler");e2.retryModel=true;throw e2;}
      var txt=(d.content||[]).map(function(b){return b&&typeof b.text==="string"?b.text:"";}).join("\n");

      if(e.waitMs&&attempt<3){setTimeout(function(){callAI(sys,user,history,cb,errcb,model,jsonMode,attempt+1);},e.waitMs);return;}
      if(e.retryModel&&model!==FALLBACK_MODEL){callAI(sys,user,history,cb,errcb,FALLBACK_MODEL,jsonMode,attempt);return;}

}

function repairJSON(s){
  var out="",inStr=false,esc=false,stack=[];
  for(var i=0;i<s.length;i++){
    var c=s.charAt(i);
    if(inStr){
      if(esc){out+=c;esc=false;continue;}
      if(c==="\\"){out+=c;esc=true;continue;}
      if(c==='"'){inStr=false;out+=c;continue;}
      if(c==="\n"||c==="\r"||c==="\t"){out+=" ";continue;}
      out+=c;continue;
    }
    if(c==='"'){inStr=true;out+=c;continue;}
    if(c==="{"||c==="[")stack.push(c);
    if(c==="}"||c==="]"){out=out.replace(/,\s*$/,"");stack.pop();}
    out+=c;
  }
  if(inStr)out+='"';
  out=out.replace(/,\s*$/,"");
  while(stack.length){out+=(stack.pop()==="{"?"}":"]");}
  return out;
}

function parseJSONResponse(text){
  var s=String(text||"").replace(/```json|```/gi,"").trim(),start=s.indexOf("{"),end=s.lastIndexOf("}");
  if(start<0||end<start)throw new Error("Die Antwort hatte nicht das erwartete Format.");
  var body=s.slice(start,end+1);
  try{return JSON.parse(body);}catch(e1){
    try{return JSON.parse(repairJSON(body));}catch(e2){throw new Error("Die Antwort konnte nicht gelesen werden.");}
  }
}

  if(q.type==="content"){a=a||{};return choiceList("content",CONTENT_TYPES,a.items,true,"two");}
  if(q.type==="results"){
    a=a||{};
    return '<div class="mini-grid"><div><span class="lbl" style="margin-top:0">Reaktionen (Likes, Kommentare)</span><input id="res-reactions" value="'+esc(a.reactions)+'" placeholder="z. B. 20"></div><div><span class="lbl" style="margin-top:0">Anfragen</span><input id="res-inquiries" value="'+esc(a.inquiries)+'" placeholder="z. B. 3"></div><div><span class="lbl">Gespräche</span><input id="res-talks" value="'+esc(a.talks)+'" placeholder="z. B. 1"></div><div><span class="lbl">Buchungen oder Verkäufe</span><input id="res-sales" value="'+esc(a.sales)+'" placeholder="z. B. 0"></div></div>'+
      '<div id="res-extra" class="'+((num(a.inquiries)>0||num(a.talks)>0)?'':'hidden')+'">'+
        '<span class="lbl">Wer hat angefragt?</span>'+sel("res-who",["Tierhalter / Kunden","Fachleute oder Kollegen","Beides","Weiß ich nicht"],a.who)+
        '<span class="lbl">Waren die Gespräche dieselben Personen wie die Anfragen?</span>'+sel("res-overlap",["Ja","Nein","Weiß ich nicht"],a.overlap)+
      '</div>'+
      '<span class="lbl">Warum wurde bisher nicht gebucht? (optional, falls bekannt)</span><input id="res-why" value="'+esc(a.why)+'" placeholder="z. B. Preis, noch unentschlossen – oder: weiß ich nicht">'+
      '<label class="choice" style="margin-top:10px"><input id="res-unknown" type="checkbox"'+(a.unknown?' checked':'')+'><span>Ich habe das bisher nicht gemessen.</span></label>';
  }
  if(q.type==="path"){a=a||{};return choiceList("path",PATHS,a.choices,true,"two")+'<span class="lbl">Falls etwas anderes (optional)</span><input id="path-other" value="'+esc(a.other)+'" placeholder="z. B. Sie rufen in meiner Praxis an">';}
  if(q.type==="openness"){a=a||{};return choiceList("open",OPEN_OPTS,a.choice,false)+'<div id="open-wrap" class="'+(a.choice===OPEN_OPTS[1]?'':'hidden')+'"><span class="lbl">Für welche Kanäle?</span>'+choiceList("openchannels",OPEN_CHANNELS,a.channels,true)+'</div>';}
  if(q.type==="capacity"){
    a=a||{};
    return '<div class="mini-grid"><div><span class="lbl" style="margin-top:0">Zeit pro Woche</span>'+sel("cap-time",["Unter 1 Stunde","1–2 Stunden","3–5 Stunden","Mehr als 5 Stunden","Weiß ich noch nicht"],a.time)+'</div><div><span class="lbl" style="margin-top:0">Budget pro Monat für Marketing</span>'+sel("cap-budget",["0 Euro","Bis 50 Euro","51–150 Euro","Mehr als 150 Euro","Noch nicht festgelegt"],a.budget)+'</div></div>'+
      '<span class="lbl">Was kannst und möchtest du umsetzen? (optional)</span>'+choiceList("formats",["Texte","Fotos","Kurze Videos","Persönliche Gespräche","Veranstaltungen oder lokale Aktionen"],a.formats,true);
  }
  return '';
}

function selectedValues(name){return Array.prototype.slice.call(document.querySelectorAll('input[name="'+name+'"]:checked')).map(function(x){return x.value;});}
function selectedValue(name){var x=document.querySelector('input[name="'+name+'"]:checked');return x?x.value:"";}

function saveQuestion(i){
  var type=QUESTIONS[i].type,a;
  function v(id){var e=$(id);return e?e.value.trim():"";}
  if(type==="goal")a={choice:selectedValue("goal"),detail:v("goal-detail")};
  else if(type==="offer")a={offer:v("offer-name"),price:v("offer-price"),action:v("offer-action")};
  else if(type==="text")a=v("qa");
  else if(type==="channels"){a=selectedValues("channels");if(a.length>1)a=a.filter(function(x){return x!=="Bisher gar nicht";});}
  else if(type==="situation")a={items:selectedValues("situation")};
  else if(type==="content"){var ci=selectedValues("content");if(ci.length>1)ci=ci.filter(function(x){return x!=="Kaum Content";});a={items:ci};}
  else if(type==="results")a={reactions:v("res-reactions"),inquiries:v("res-inquiries"),talks:v("res-talks"),sales:v("res-sales"),who:v("res-who"),why:v("res-why"),unknown:!!($("res-unknown")&&$("res-unknown").checked),overlap:v("res-overlap")};
  else if(type==="path"){var pc=selectedValues("path"),NP=["Es gibt noch keinen klaren nächsten Schritt","Ich weiß es nicht"],real=pc.filter(function(x){return NP.indexOf(x)<0;});a={choices:real.length?real:pc,other:v("path-other")};}
  else if(type==="openness"){var oc=selectedValue("open");a={choice:oc,channels:oc===OPEN_OPTS[1]?selectedValues("openchannels"):[]};}
  else if(type==="capacity")a={time:v("cap-time"),budget:v("cap-budget"),formats:selectedValues("formats")};
  dAnswers[i]=a;return validateAnswer(type,a);
}
function saveCurrentAnswer(){var err="";PAGES[dCurQ].forEach(function(i){var e=saveQuestion(i);if(e&&!err)err=e;});return err;}

function validateAnswer(type,a){
  if(type==="goal"&&!a.choice)return "Bitte wähle, was am besten passt.";
  if(type==="offer"&&!a.offer)return "Bitte beschreibe kurz dein Angebot – „noch nicht klar“ ist auch eine gültige Antwort.";
  if(type==="text"&&!a)return "Bitte schreib ein paar Worte – „Ich weiß es nicht“ ist erlaubt.";
  if(type==="channels"&&!a.length)return "Bitte wähle mindestens eine Möglichkeit – „Bisher gar nicht“ ist auch möglich.";
  if(type==="content"&&!a.items.length)return "Bitte wähle mindestens eine Möglichkeit – „Kaum Content“ ist auch möglich.";
  if(type==="results"&&!a.unknown&&!a.reactions&&!a.inquiries&&!a.talks&&!a.sales)return "Bitte trage mindestens eine Zahl ein oder setze den Haken bei „noch nicht gemessen“.";
  if(type==="path"&&!a.choices.length)return "Bitte wähle mindestens eine Antwort – „Ich weiß es nicht“ ist möglich.";
  if(type==="openness"&&!a.choice)return "Bitte wähle eine Antwort – „Ich weiß es noch nicht“ ist möglich.";
  if(type==="capacity"&&(!a.time||!a.budget))return "Bitte wähle Zeit und Budget – „Weiß ich noch nicht“ ist möglich.";
  return "";
}

function saveAndGo(dir){
  var err=saveCurrentAnswer();if(dir>0&&err){$("qerror").textContent=err;return;}
  dCurQ+=dir;renderMain();window.scrollTo(0,0);
}

function answersSummary(){
  var summary="";
  for(var i=0;i<QUESTIONS.length;i++)summary+=QUESTIONS[i].title+"\nAntwort: "+answerText(i,dAnswers[i])+"\n\n";
  return summary;
}

function answerText(i,a){
  var t=QUESTIONS[i].type;
  if(!a)return "keine Angabe";
  if(Array.isArray(a))return a.join(", ")||"keine Angabe";
  if(typeof a==="string")return a||"keine Angabe";
  if(t==="goal")return a.choice+(a.detail?" – "+a.detail:"");
  if(t==="offer")return "Angebot: "+(a.offer||"nicht angegeben")+"; Preis: "+(a.price||"nicht angegeben")+"; nächster Schritt für Interessenten: "+(a.action||"nicht angegeben");
  if(t==="situation"||t==="content")return (a.items&&a.items.length)?a.items.join("; "):"keine Angabe";
  if(t==="results"){
    if(a.unknown)return "bisher nicht gemessen";
    function n(x){return x||"nicht angegeben";}
    return "Reaktionen: "+n(a.reactions)+"; Anfragen: "+n(a.inquiries)+"; Gespräche: "+n(a.talks)+"; Verkäufe: "+n(a.sales)+"; Art der Anfragenden: "+n(a.who)+"; Gespräche waren dieselben Personen wie die Anfragen: "+n(a.overlap)+"; bekanntes Kaufhindernis: "+n(a.why);
  }
  if(t==="path")return a.choices.join("; ")+(a.other?" – "+a.other:"");
  if(t==="openness")return a.choice+(a.channels&&a.channels.length?" ("+a.channels.join(", ")+")":"");
  if(t==="capacity")return "Zeit: "+(a.time||"nicht angegeben")+"; Budget: "+(a.budget||"nicht angegeben")+"; mögliche Formate: "+((a.formats&&a.formats.length)?a.formats.join(", "):"nicht angegeben");
  return JSON.stringify(a);
}

function buildClarifications(){
  var items=[],offer=dAnswers[qIdx("offer")]||{},res=dAnswers[qIdx("results")]||{};
  if(!offer.action||offer.action==="Weiß ich noch nicht")items.push({q:qIdx("offer"),message:"Es ist noch nicht festgelegt, was ein interessierter Mensch als Nächstes tun soll."});
  if(num(res.inquiries)>0&&(!res.who||res.who==="Weiß ich nicht"))items.push({q:qIdx("results"),message:"Unklar, ob die Anfragen von potenziellen Kunden oder von Fachleuten kamen."});
  if(num(res.inquiries)>0&&num(res.talks)>0&&res.overlap!=="Ja"&&res.overlap!=="Nein")items.push({q:qIdx("results"),message:"Unklar, ob die Gespräche aus den genannten Anfragen entstanden sind oder zusätzliche Personen waren."});
  return items;
}

function saveAndStartDiag(){
  var err=saveCurrentAnswer();if(err){$("qerror").textContent=err;return;}
  formGaps=buildClarifications().map(function(x){return x.message;});
  clarifyMode=false;aiClarificationText="";clarificationRounds=0;runStructuredDiagnosis();
}

function runStructuredDiagnosis(retry){
  dStep=1;dDiag="";dTask="";diagData=null;planData=null;renderMain();
  var force=clarificationRounds>=1||!!retry;
  var facts=profileContext()+"\n\nANTWORTEN:\n"+answersSummary()+"\n\nSICHTBARKEITSSYSTEM (nur aus den Angaben abgeleitet):\n"+visibilityFacts()+(aiClarificationText?"\n\nZUSAETZLICHE KLAERUNGEN:\n"+aiClarificationText:"")+(formGaps.length?"\n\nBEKANNTE LUECKEN:\n- "+formGaps.join("\n- "):"");
  var prompt="Analysiere, ob alle entscheidenden Informationen für eine belastbare Marketingdiagnose vorliegen. Fehlen Angaben, setze im Zweifel trotzdem status auf ready und benenne die Lücken in missing_info. Nur wenn ohne eine Antwort überhaupt keine sinnvolle vorläufige Diagnose möglich wäre, setze status auf needs_clarification und stelle höchstens 3 kurze Fragen. In diesem Status dürfen diagnosis und priority leer bleiben. Wenn genug Informationen vorliegen, setze status auf ready. Unterscheide Marketingkanal, Übergang von Anfrage zu Buchung und Bindung. Keine Kaltakquise an Fremde. Alle Textwerte sind direkt an die Nutzerin gerichtet (du-Form; die Nutzerin heißt nie 'die Person'). REGELN FÜR DIE DIAGNOSE: (1) Bei insgesamt weniger als 10 Reaktionen, Anfragen und Gesprächen oder höchstens 2 Gesprächen ist confidence zwingend niedrig. Dann ist central_problem eine vorläufige Einschätzung und sagt, dass die Datenmenge noch nicht ausreicht, um Kanal-, Angebots- und Übergangsproblem sicher zu unterscheiden; priority_type ist dann klaerung, außer das SICHTBARKEITSSYSTEM zeigt eine klar belegte strukturelle Lücke (zum Beispiel nur ein Kanal, kein Handlungsweg, kein sichtbares Angebot); dann darf die Priorität diese Lücke sein, ohne Ergebnisversprechen. (2) Zähle Personen nicht doppelt: Ist nicht bekannt oder fehlt die Angabe, ob die Gespräche aus den Anfragen entstanden sind, nenne das unter uncertainties und addiere die Zahlen nicht zu verschiedenen Kontakten. (3) evidence enthält höchstens 6 kurze Punkte mit nachprüfbaren Tatsachen und Zahlen aus den Angaben, keine Bewertungen und nichts Hinzugedichtetes. (4) Bewerte das Angebot nicht. Fehlende Angebotsdetails wie Leistungsumfang, Ablauf nach dem Erstkontakt, Vergütungsmodell, Zielgruppe gehören in uncertainties. (5) Berücksichtige die Antwort zur Offenheit für andere Kanäle. (6) Empfiehl keine Wiederansprache und keine Nachfass-Nachricht an frühere Interessenten. (7) summary ist eine Kurzfassung in genau drei kurzen Sätzen, direkt an die Nutzerin in du-Form: was gerade am meisten bremst oder noch unklar ist, was schon vorhanden ist, was als Nächstes dran ist. topic_ideas sind immer genau 3 konkrete Themenideen für Beiträge aus Sicht der Kunden (title) mit passender Säule (pillar: erkennen, verstehen, vertrauen, beweis oder angebot), auch bei niedriger Sicherheit, passend zu Beruf und Zielgruppe, nur für Kanäle, die die Person nutzt oder für die sie offen ist (sonst allgemein), ohne erfundene Fakten, Diagnosen oder Heilversprechen. Prüfe außerdem als Möglichkeit, nicht als Tatsache, ob der erste Schritt für Interessenten zu groß sein könnte (zum Beispiel direktes Abonnement oder individuelles Angebot ohne genannten Preis oder kleinen Einstieg wie Erstgespräch oder Checkliste), und nenne einen nicht genannten kleinen Einstieg unter uncertainties. (8) business_type: Leite aus Beruf, Angebot und Kundensituation ab, ob das Geschäft überwiegend ein Suchgeschäft (Kunden suchen aktiv, meist bei akutem Problem), Vertrauensgeschäft (längerer Vertrauensaufbau, zum Beispiel Ausbildung oder Coaching), Wunschgeschäft (Emotion und Vorstellungskraft, zum Beispiel Fotografie) oder Vorsorgegeschäft (Vorbeugung, zum Beispiel Welpenberatung) ist; bei unklarer Lage mischform. business_type_reason ist ein Satz. (9) blind_spot: ein konkreter Satz in du-Form, der nur aus den Angaben und dem SICHTBARKEITSSYSTEM belegbar ist; was nicht genannt wurde, heißt 'in deinen Angaben nicht genannt', nie 'fehlt' oder 'gibt es nicht'; zum Beispiel nur ein einziger Kanal, kein klarer Handlungsweg, viel Fachwissen aber kein sichtbares Angebot oder Inhalte, die bei der Lösung beginnen, bevor der Kunde sein Problem erkannt hat. Steht laut Angaben nur ein Kanal zur Verfügung, sage sinngemäß, dass die Sichtbarkeit auf nur einem Bein steht und von diesem einen Kanal abhängt. Ist Flyer der einzige Weg, erkläre, dass Flyer lokal sinnvoll sein können, aber meist nur ein kurzer Kontakt sind und ohne digitale Vertiefung wie Website, Google oder Angebotsseite kaum weitere Begegnungen ermöglichen. (10) bottleneck: type ist genau einer aus: fehlende Klarheit, zu wenig Reichweite, falscher Kanal, nur ein Kanal, fehlende Auffindbarkeit, zu wenig Vertrauen, zu wenig Angebot, kein klarer Kaufweg, zu viel Fachsprache, zu wenig Kundenperspektive, unregelmäßige Sichtbarkeit, zu wenige Kontaktpunkte, zu wenig Beweis, noch nicht sicher bestimmbar. explanation sind ein bis zwei Sätze aus den Angaben. Bei unsicherer Datenlage wähle noch nicht sicher bestimmbar oder formuliere vorsichtig. (11) content_mix: Prozentwerte für erkennen, verstehen, vertrauen, beweis, angebot mit Summe 100, abhängig von Beruf, Geschäftsart und bisherigem Content. content_mix_note ist ein Satz mit der Begründung. Gibt es laut Angaben keine Fallbeispiele oder Kundenstimmen, setze beweis niedrig und erfinde keine Beweise. (12) profession_note: zwei Sätze, die konkret zum angegebenen Beruf sagen, was Kunden erkennen oder verstehen müssen, ohne Diagnosen, Heilversprechen oder Ursachenbehauptungen. (13) Empfiehl nie, überall gleichzeitig aktiv zu sein. (14) Behandle Angaben wie ich weiß es nicht, nicht ausgewertet, keine Angabe oder nicht beantwortet als fehlende Information, niemals als null oder als Beleg für etwas. missing_info listet die wichtigen fehlenden Angaben. completeness_note erklärt in ein bis zwei Sätzen, warum Diagnose, Content-Plan und Maßnahme dadurch nicht ganz vollständig sein können; sind alle wichtigen Angaben vorhanden, bleibt beides leer. JSON-Schema exakt: {\"status\":\"ready|needs_clarification\",\"questions\":[\"...\"],\"diagnosis\":{\"central_problem\":\"...\",\"confidence\":\"hoch|mittel|niedrig\",\"evidence\":[\"...\"],\"uncertainties\":[\"...\"],\"priority_type\":\"marketingkanal|uebergang|bindung|angebotsklaerung|klaerung\",\"priority\":\"...\",\"rationale\":\"...\",\"summary\":\"...\",\"topic_ideas\":[{\"title\":\"...\",\"pillar\":\"...\"}],\"business_type\":\"suchgeschaeft|vertrauensgeschaeft|wunschgeschaeft|vorsorgegeschaeft|mischform\",\"business_type_reason\":\"...\",\"blind_spot\":\"...\",\"bottleneck\":{\"type\":\"...\",\"explanation\":\"...\"},\"content_mix\":{\"erkennen\":30,\"verstehen\":20,\"vertrauen\":20,\"beweis\":15,\"angebot\":15},\"content_mix_note\":\"...\",\"profession_note\":\"...\",\"missing_info\":[\"...\"],\"completeness_note\":\"...\"}}. Kleine Stichproben vorsichtig bewerten.\n\n"+facts+(force?" WICHTIG: Es wurde bereits nachgefragt oder weitere Antworten sind nicht möglich. Setze status ZWINGEND auf ready und stelle keine Fragen."+(retry?" ZWEITER VERSUCH: Gib ausschließlich status ready mit vollständiger diagnosis zurück.":""):"");
  callJSONChecked(SYS,prompt,function(data){
    if(data.status==="needs_clarification"){
      if(force){if(!retry){runStructuredDiagnosis(true);return;}dDiag="Fehler: Die Diagnose konnte nicht erstellt werden. Bitte erneut versuchen.";renderMain();return;}
      var qs=Array.isArray(data.questions)?data.questions.filter(Boolean).slice(0,4):[];
      if(!qs.length){dDiag="Fehler: Die Klärungsfragen konnten nicht erstellt werden.";renderMain();return;}
      clarifyItems=qs;clarifySource="ai";clarifyMode=true;dStep=0;renderMain();return;
    }
    if(data.status!=="ready"||!data.diagnosis||!data.diagnosis.central_problem){dDiag="Fehler: Die Diagnose war unvollständig. Bitte erneut versuchen.";renderMain();return;}
    diagData=data.diagnosis;if(smallSample())diagData.confidence="niedrig";dDiag=diagnosisText(diagData);renderMain();generateStructuredPlan(facts);
  },function(e){dDiag="Fehler: "+e;renderMain();});
}

var BN_LABELS={"fehlende klarheit":"Fehlende Klarheit","zu wenig reichweite":"Zu wenig Reichweite","falscher kanal":"Falscher Kanal","nur ein kanal":"Nur ein Kanal","fehlende auffindbarkeit":"Fehlende Auffindbarkeit","zu wenig vertrauen":"Zu wenig Vertrauen","zu wenig angebot":"Zu wenig Angebot","kein klarer kaufweg":"Kein klarer Kaufweg","zu viel fachsprache":"Zu viel Fachsprache","zu wenig kundenperspektive":"Zu wenig Kundenperspektive","unregelmäßige sichtbarkeit":"Unregelmäßige Sichtbarkeit","zu wenige kontaktpunkte":"Zu wenige Kontaktpunkte","zu wenig beweis":"Zu wenig Beweis","noch nicht sicher bestimmbar":"Noch nicht sicher bestimmbar"};
function fixText(t){return String(t||"").replace(/(^|\n)(- |\d+\. )?([a-zäöü])/g,function(m,a,b,c){return a+(b||"")+c.toUpperCase();}).replace(/Conversion/g,"Übergang von Anfrage zu Buchung").replace(/[ \t]+,/g,",");}
function diagnosisText(d){return fixText(diagnosisRaw(d));}
function diagnosisRaw(d){
  var out=(d.confidence==="niedrig"?"Deine vorläufige Einschätzung":"Deine Diagnose")+"\n"+d.central_problem+"\n\nSicherheit der Einschätzung: "+(d.confidence||"nicht angegeben");
  if(d.completeness_note||(d.missing_info&&d.missing_info.length)){out+="\n\nWarum diese Auswertung nicht ganz vollständig ist";if(d.completeness_note)out+="\n"+d.completeness_note;if(d.missing_info&&d.missing_info.length)out+="\nWichtige fehlende Angaben:\n- "+d.missing_info.join("\n- ");}
  if(d.business_type&&BTYPES[d.business_type])out+="\n\nGeschäftsart (Einschätzung)\n"+BTYPES[d.business_type]+(d.business_type_reason?"\n"+d.business_type_reason:"");
  if(d.blind_spot)out+="\n\nDein blinder Fleck\n"+d.blind_spot;
  if(d.bottleneck&&d.bottleneck.type)out+="\n\nDein größter Engpass\n"+(BN_LABELS[String(d.bottleneck.type).toLowerCase()]||d.bottleneck.type)+(d.bottleneck.explanation?": "+d.bottleneck.explanation:"");
  if(d.profession_note)out+="\n\nFür deinen Beruf\n"+d.profession_note;
  if(d.evidence&&d.evidence.length)out+="\n\nWoran die Einschätzung erkennbar ist\n- "+d.evidence.join("\n- ");
  if(d.uncertainties&&d.uncertainties.length)out+="\n\nWas noch unsicher ist\n- "+d.uncertainties.join("\n- ");
  out+="\n\nWas jetzt Vorrang hat\n"+typeLabel(d.priority_type)+": "+(d.priority||"")+"\n"+(d.rationale||"");
  if(d.topic_ideas&&d.topic_ideas.length)out+="\n\nDrei Themenideen für deinen nächsten Beitrag\n- "+d.topic_ideas.map(function(x){return (x&&x.title?x.title:"")+(x&&x.pillar?" (Säule: "+x.pillar+")":"");}).join("\n- ");
  return out;
}

function generateStructuredPlan(facts){
  var prompt="Erstelle auf Basis der fertigen Diagnose einen 7-Tage-Plan. Genau 3 Schritte, nur die festgelegte Priorität, insgesamt innerhalb der angegebenen Wochenzeit und des Budgets. Keine neue Strategie, keine Kaltakquise, keine garantierten Antworten oder Verkäufe. Ist die Priorität klaerung, sind die drei Schritte klar getrennt: Schritt 1 die eigenen Zahlen und Gesprächsverläufe festhalten, Schritt 2 das Angebot in wenigen Sätzen verständlich aufschreiben (Leistungsumfang, Ablauf, Preismodell und ein kleiner erster Schritt für Interessenten), Schritt 3 einen Beitrag zu einer der Themenideen aus der Diagnose vorbereiten. Auch bei anderen Prioritäten überschneiden sich die drei Schritte inhaltlich nicht. Keine erneute Kontaktaufnahme und keine Nachfass-Nachricht an frühere Interessenten. Sprich direkt mit du. Erfolgskriterien beschreiben ausschließlich eigene Handlungen und Dokumentation (zum Beispiel: Nachrichten versendet, nächster Schritt klar erklärt, Antworten und Reaktionen festgehalten) und niemals, dass jemand antwortet, bucht oder ein Gespräch führt. Nenne keinen neuen Kanal, wenn die Person dafür nicht offen ist. Die Schritte gehen den größten Engpass und den blinden Fleck aus der Diagnose an, soweit die Priorität das zulässt. Nenne den Zeitraum nur als sieben Tage. Die Summe der Minuten bleibt unter der angegebenen Wochenzeit; lautet sie Weiß ich noch nicht, insgesamt höchstens 120 Minuten. Beachte die FACHGRENZEN-REGELN. JSON-Schema exakt: {\"weekly_time\":\"...\",\"priority_type\":\"...\",\"steps\":[{\"title\":\"...\",\"action\":\"...\",\"minutes\":30,\"goal\":\"...\"}],\"success_metrics\":[\"...\"]}.\n\nFAKTEN:\n"+facts+"\n\nDIAGNOSE:\n"+JSON.stringify(diagData);
  callJSONChecked(SYS,prompt,function(data){
    if(!Array.isArray(data.steps)||data.steps.length!==3){dTask="Fehler: Der Wochenplan war unvollständig. Bitte erneut versuchen.";renderMain();return;}
    var cap=dAnswers[qIdx("capacity")]||{};data.weekly_time=(cap.time&&cap.time!=="Weiß ich noch nicht")?cap.time+" pro Woche":"nicht angegeben (der Plan bleibt bewusst klein)";
    planData=data;dTask=planText(data);renderMain();
  },function(e){dTask="Fehler: "+e;renderMain();});
}

function planText(p){return fixText(planRaw(p));}
function planRaw(p){
  var out="Dein Plan für die nächsten 7 Tage\nVerfügbare Zeit: "+(p.weekly_time||"laut deiner Angabe")+"\nArt: "+typeLabel(p.priority_type||diagData.priority_type);
  p.steps.forEach(function(s,i){out+="\n\n"+(i+1)+". "+String(s.title||"").replace(/^\s*(?:Schritt\s*)?\d+\s*[:.\-–]\s*/i,"")+"\n"+s.action+"\nZeit: "+s.minutes+" Minuten\nZiel: "+s.goal;});
  if(p.success_metrics&&p.success_metrics.length)out+="\n\nErfolg nach 7 Tagen prüfen\n- "+p.success_metrics.join("\n- ");
  return out;
}

function normalizedMix(m){
  var keys=["erkennen","verstehen","vertrauen","beweis","angebot"],labels=["Erkennen","Verstehen","Vertrauen","Beweis","Angebot"];
  var vals=keys.map(function(k){return m?num(m[k]):0;}),sum=vals.reduce(function(a,b){return a+b;},0);
  if(!sum)return null;
  var out=vals.map(function(v){return Math.round(v*100/sum);}),diff=100-out.reduce(function(a,b){return a+b;},0);
  out[out.indexOf(Math.max.apply(null,out))]+=diff;
  return keys.map(function(k,i){return {label:labels[i],v:out[i]};});
}

function genContent(){
  if(!cTopic.trim()){alert("Bitte trage zuerst dein konkretes Angebot oder Thema ein.");return;}
  var btn=$("cgenbtn");if(btn)btn.disabled=true;
  cResult="";renderMain();
  var facts=profileContext()+"\nKanal/Maßnahme: "+cCat+"\nInhaltssäule: "+cPillar+"\nAngebot/Thema: "+cTopic;
  if(diagData)facts+="\n\nANGABEN AUS DEM KOMPASS:\n"+answersSummary()+"\nKOMPASS-DIAGNOSE:\n"+JSON.stringify(diagData);
  var prompt="Erstelle genau 3 konkrete Beitragsideen für genau diesen Beruf innerhalb genau eines passenden Kanals. Jede Idee gehört zu einer Inhaltssäule (erkennen, verstehen, vertrauen, beweis, angebot oder entscheiden). Ist die Säule automatisch gewählt und liegt ein content_mix vor, nimm die Säulen mit dem höchsten Anteil. KEINE ERFUNDENEN ERFAHRUNGEN: Schreibe nie, was die Anbieterin angeblich erlebt, hört, sieht oder gelernt hat, und erfinde keine persönlichen Geschichten, Gespräche oder Zitate von Kundinnen und Kunden. Formuliere stattdessen aus Sicht der Zielgruppe (Du-Ansprache) und setze für echte Erlebnisse einen Platzhalter. Verweise im Einstieg und in den Texten nie auf einen bestimmten vergangenen Termin, ein bestimmtes Tier, bestimmte Kundinnen oder Kunden oder deren Rückmeldungen ('dieser Termin', 'meine Kunden', 'was Kunden mir gesagt haben'); echte Beispiele stehen nur als Platzhalter im Feld beweis. Achte auf korrekte Grammatik und Rechtschreibung. Auch bei Ideen zu Angebot oder Ablauf ist der Einstieg eine Sorge oder Frage der Zielgruppe ('Du hast einen Termin vereinbart und fragst dich, was auf euch zukommt'), nie nur 'Das erste Gespräch mit mir'. Sprich die Zielgruppe und die Anbieterin durchgehend mit du an, nie mit Sie oder Ihre, auch nicht im Feld measurement. Beschreibt das Problem körperliche Veränderungen, Bewegung, Schmerz, Fressen oder eine plötzliche Verhaltensänderung des Tieres, steht im Problem oder in der Brücke ausdrücklich, dass zuerst eine tierärztliche Abklärung sinnvoll ist. Der Einstieg (title) ist ein konkreter Moment oder eine Frage aus dem Alltag der Zielgruppe, kein Themenname und keine Überschrift wie 'So funktioniert …' oder 'Was beim Erstgespräch passiert'. AUFBAU JEDER IDEE in sechs Bausteinen. (1) title ist der Einstieg (Musterunterbrechung): eine überraschende, emotional aufgeladene oder zielgruppenrelevante Überschrift, die das gewohnte Weiterscrollen unterbricht, zum Beispiel eine klare Frage oder ein mutiges Statement; nie reißerisch, ohne erfundene Zahlen oder Statistiken, ohne Wirkversprechen und ohne Abwertung anderer. hook_alternatives enthält zwei weitere Einstiegsvarianten, denn der Einstieg entscheidet, ob weitergelesen wird. (2) problem: das Problem der Zielgruppe konkret, alltagsnah und bildhaft in der Sprache der Zielgruppe, ein bis zwei Sätze; es folgt aus der Zielgruppen-Angabe der Nutzerin und behauptet nicht, was Kundschaft allgemein denkt, fühlt oder erlebt hat; nicht zu dramatisch. (3) wunsch: der Wunschzustand der Zielgruppe in Bildern und Gefühlen, als Wunsch formuliert (zum Beispiel Vielleicht wünschst du dir …) und nicht als Versprechen. (4) angebot: die Brücke vom Problem zum Wunsch: wofür das Angebot der Nutzerin gedacht ist und woran ihr gemeinsam arbeitet, nutzennah und ohne Fachsprache, ohne zu versprechen, was dabei herauskommt, und ohne Angebotsdetails zu erfinden. (5) beweis: nur ein echter Beweis aus den Angaben der Nutzerin; gibt es keinen, schreibe genau [Platzhalter: echte Kundenstimme oder echtes Beispiel einfügen]; erfinde nie Zahlen, Studien, Kundenstimmen oder Referenzen. (6) cta: genau eine einzige klare Handlung (nicht mehrere Möglichkeiten wie melde dich oder schreib mir), konkret und möglichst warm formuliert. Der cta passt zur Geschäftsart und nennt nur Wege, die laut Angaben existieren, zum Beispiel Termin ansehen, Erstgespräch vereinbaren, mehr über die Behandlung erfahren, Kurs ansehen, Platz reservieren, Angebot kennenlernen, Community beitreten, Nachricht senden oder Buchungsseite öffnen; nicht pauschal Jetzt kaufen. Bei automatischer Kanalwahl nimm nur einen Kanal, den die Person bereits nutzt oder für den sie offen ist. Keine Kaltakquise. Keine erfundenen Fakten, Fallbeispiele oder Ergebnisgarantien. Bei Gesundheitsthemen keine Diagnosen oder Heilversprechen, sondern Beobachtungen und den Hinweis auf tierärztliche Abklärung. Alle sechs Felder sprechen die Leserin oder den Leser des Beitrags an, nie die Nutzerin der App (also nicht In diesem Beitrag erklärst du, sondern direkt: Du kennst das …). Setze nicht voraus, in welcher Lage die Leserin oder der Leser gerade ist (nicht Dein Hund ist gerade operiert worden). Keine Formulierungen wie unterstützt die Genesung, hilft, schafft Klarheit, verschafft Sicherheit, Keine versteckten Kosten oder Du weißt danach. Das Feld measurement nennt in einfachen Worten, was die Nutzerin selbst zählt (zum Beispiel wie viele Nachrichten nach dem Beitrag eingehen), ohne englische Fachbegriffe wie Saves, Shares oder Direct Messages. Wenn ein erforderlicher Link oder Preis fehlt, nutze [Platzhalter]. JSON-Schema exakt: {\"channel\":\"...\",\"ideas\":[{\"pillar\":\"...\",\"title\":\"...\",\"hook_alternatives\":[\"...\",\"...\"],\"problem\":\"...\",\"wunsch\":\"...\",\"angebot\":\"...\",\"beweis\":\"...\",\"cta\":\"...\",\"measurement\":\"...\"}]}.\n\n"+facts;
  callJSONChecked(SYS,prompt,function(r){
    if(!r||!Array.isArray(r.ideas)||r.ideas.length!==3){cResult="Fehler: Die Ideen waren unvollständig. Bitte erneut versuchen.";renderMain();return;}
    cResult="Gewählter Kanal: "+r.channel+r.ideas.map(function(x,i){var alt=Array.isArray(x.hook_alternatives)?x.hook_alternatives.filter(Boolean):[];return "\n\nIdee "+(i+1)+": "+x.title+(x.pillar?"\nSäule: "+x.pillar:"")+(alt.length?"\nWeitere Einstiege: "+alt.join(" | "):"")+(x.problem?"\nProblem: "+x.problem:"")+(x.wunsch?"\nWunschzustand: "+x.wunsch:"")+(x.angebot?"\nBrücke zu deinem Angebot: "+x.angebot:"")+(x.beweis?"\nBeweis: "+x.beweis:"")+(x.content?"\n"+x.content:"")+"\nNächster Schritt: "+x.cta+"\nMessung: "+x.measurement;}).join("");renderMain();
  },
    function(e){cResult="Fehler: "+e;renderMain();});
}

  professions=[c[0]];professionOther="";qualification="";animalFocus=window.testAnimal||c[3];animalPick=window.testAnimal?[window.testAnimal]:[c[3]];businessReach="Regional und online";
  dAnswers=[];

function pollUntil(fn,ms,done){var t0=Date.now();(function tick(){var r=fn();if(r||Date.now()-t0>ms){done(!!r);return;}setTimeout(tick,500);})();}
function caseResult(c,err){
  var text=[dDiag,dTask,dCont,measureData&&measureData.content?measureData.content:"",cResult].join("\n");
  var hits=violations(text);
  if(err)hits.unshift(err);
  [["Diagnose",dDiag],["Plan",dTask],["Maßnahme",dCont],["Ideen",cResult]].forEach(function(x){if(String(x[1]).indexOf("Fehler:")===0)hits.push(x[0]+" nicht erstellt: "+x[1]);});
  return {name:c[0],groups:activeGroups().map(function(k){return GROUP_NAMES[k];}).join(", "),hits:hits,text:text};
}
function runCase(c,cb){
  applyCase(c);runStructuredDiagnosis();
  pollUntil(function(){
    if(clarifyMode){aiClarificationText="Keine weiteren Angaben möglich (Ich weiß es nicht).";clarifyMode=false;clarificationRounds=1;runStructuredDiagnosis();return false;}
    return dDiag&&(dDiag.indexOf("Fehler:")===0||dTask);
  },300000,function(){
    if(!dTask||dDiag.indexOf("Fehler:")===0){cb(caseResult(c,"Diagnose oder Plan nicht erstellt"));return;}
    genCont();
    pollUntil(function(){return dCont;},300000,function(){
      genContent();
      pollUntil(function(){return cResult;},300000,function(){cb(caseResult(c));});
    });
  });
}
function renderTestlauf(){
  var opts='<option value="">Alle 19 Berufe (dauert lange)</option>'+Object.keys(GROUP_NAMES).map(function(k){return '<option value="'+k+'">Nur Gruppe: '+GROUP_NAMES[k]+'</option>';}).join('')+'<option value="__multi">Kanal-Übertragung (Hundetraining, Instagram + Facebook)</option>';
  $("card").innerHTML='<div class="card-hdr"><div class="e">Nur für dich</div><h2>Testlauf</h2><p>Prüft Berufe mit Musterangaben gegen die Fachgrenzen-Regeln.</p></div><div class="body"><select id="tgroup">'+opts+'</select><select id="tanimal" style="margin-top:10px">'+'<option value="">Tierart: Hunde</option>'+ANIMALS.slice(1).map(function(a){return '<option>'+a+'</option>';}).join('')+'</select><button class="btn-p" onclick="startTest()" style="margin-top:12px">Testlauf starten</button><p class="field-help">Tipp: erst nur eine Gruppe testen. Mit einer anderen Tierart laufen alle Berufe, die zu dieser Tierart passen, mit allgemeinen Musterangaben. Die App wartet zwischen den Anfragen, damit dein KI-Zugang nicht überlastet wird.</p><div id="tprog" class="status"></div><div id="tout"></div></div>';
}
function startTest(){
  if(window.testRun)return;
  var g=$("tgroup").value;
  if(g==="__multi"){window.testAnimal="";var mc=TESTCASES.filter(function(c){return /Hundetraining/.test(c[0]);})[0];window.testRun=true;$("tout").innerHTML="";$("tprog").textContent="Kanal-Übertragung läuft …";testResults=[];
    applyCase(mc);dAnswers[qIdx("channels")]=["Instagram","Facebook"];cTopic="Welpen und Leinenführigkeit: Was in der ersten Trainingsstunde passiert";cMulti="";genMulti();
    pollUntil(function(){return cMulti;},300000,function(){window.testRun=false;testResults.push({name:"Kanal-Übertragung (Hundetraining)",groups:"Instagram + Facebook",hits:cMulti.indexOf("Fehler:")===0?["Fehler bei der Übertragung"]:violations(cMulti),text:cMulti});showTestReport(true);});
    return;}
  window.testAnimal=$("tanimal")?$("tanimal").value:"";var cs=TESTCASES.filter(function(c){return (!g||GROUP_OF[c[0]]===g)&&(!window.testAnimal||!(/hund/i.test(c[0])||(window.testAnimal.indexOf("Pferde")!==0&&/pferd|reit/i.test(c[0]))));}),i=0;testResults=[];window.testRun=true;
  $("tout").innerHTML="";
  (function next(){
    if(i>=cs.length){window.testRun=false;showTestReport(true);return;}
    $("tprog").textContent="Fall "+(i+1)+" von "+cs.length+": "+cs[i][0];
    try{
      runCase(cs[i],function(r){testResults.push(r);i++;showTestReport(false);setTimeout(next,4000);});
    }catch(e){testResults.push({name:cs[i][0],groups:"",hits:["Testfehler: "+e.message],text:""});i++;showTestReport(false);setTimeout(next,4000);}
  })();
}
function showTestReport(final){
  var bad=testResults.filter(function(r){return r.hits.length;}).length,rep="Testlauf: "+(testResults.length-bad)+" von "+testResults.length+" ohne Befund\n";
  testResults.forEach(function(r){rep+="\n"+(r.hits.length?"✗ ":"✓ ")+r.name+" ("+r.groups+")"+r.hits.map(function(h){return "\n   - "+h;}).join("");});
  $("tprog").textContent=(final?"Fertig: ":"Zwischenstand: ")+(testResults.length-bad)+" von "+testResults.length+" ohne Befund";
  $("tout").innerHTML='<p class="copy-hint">Ergebnis kopieren und an Claude schicken:</p><textarea class="copy-field" readonly rows="14" onclick="this.select()">'+esc(rep)+'</textarea>'+testResults.map(function(r){return '<details class="full"><summary>'+(r.hits.length?'✗ ':'✓ ')+esc(r.name)+'</summary><div class="rbox"><p>'+formatAI(r.text)+'</p></div></details>';}).join('');
}
