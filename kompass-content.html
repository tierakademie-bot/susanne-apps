<head>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Georgia, serif; background: linear-gradient(160deg, #2D4A3E 0%, #1a3329 40%, #0f1e18 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 28px 16px 48px; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bounce { 0%,80%,100%{transform:translateY(0);opacity:.4} 40%{transform:translateY(-4px);opacity:1} }
::-webkit-scrollbar{width:5px} ::-webkit-scrollbar-thumb{background:#8FAF9F;border-radius:3px}
.hdr{text-align:center;margin-bottom:26px}
.ey{font-size:11px;color:#D4A853;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;font-family:system-ui}
.hdr h1{font-size:24px;font-weight:700;color:white;margin-bottom:4px}
.hdr .sub{font-size:13px;color:#8FAF9F;font-family:system-ui}
.card{width:100%;max-width:580px;background:white;border-radius:20px;overflow:hidden;box-shadow:0 20px 70px rgba(0,0,0,.3)}
.card-hdr{background:linear-gradient(135deg,#2D4A3E,#4A7C6F);padding:22px 24px 18px;color:white}
.card-hdr .e{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#D4A853;margin-bottom:6px;font-family:system-ui}
.card-hdr h2{font-size:19px;font-weight:700;margin-bottom:8px;line-height:1.3}
.card-hdr p{font-size:13px;color:rgba(255,255,255,.8);line-height:1.7;font-family:system-ui}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#E8DCC8;border-bottom:1px solid rgba(143,175,159,.3)}
.tab{background:transparent;border:none;padding:14px 8px;font-size:14px;font-weight:400;color:#6B8A7E;cursor:pointer;font-family:Georgia,serif;border-bottom:3px solid transparent}
.tab.on{background:white;color:#2D4A3E;font-weight:700;border-bottom-color:#C4923A}
.body{padding:20px 24px 26px}
textarea,input,select{width:100%;font-family:Georgia,serif;font-size:14px;color:#1E2E28;background:#F5F0E8;border:1.5px solid #8FAF9F;border-radius:10px;padding:11px 13px;outline:none;transition:border-color .15s;box-sizing:border-box}
textarea{resize:vertical;line-height:1.65}
textarea:focus,input:focus,select:focus{border-color:#C4923A}
.lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#2D4A3E;margin-bottom:6px;display:block;margin-top:12px}
.btn-p{background:linear-gradient(135deg,#2D4A3E,#4A7C6F);color:white;border:none;border-radius:10px;padding:12px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;width:100%;margin-top:12px}
.btn-p:disabled{background:#8FAF9F;cursor:not-allowed}
.btn-g{background:linear-gradient(135deg,#C4923A,#D4A853);color:white;border:none;border-radius:10px;padding:12px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-o{background:transparent;border:1.5px solid #2D4A3E;color:#2D4A3E;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-row{display:flex;gap:8px;margin-top:12px}
.btn-row .btn-p,.btn-row .btn-g{flex:1}
.rbox{background:linear-gradient(135deg,#F5F0E8,#E8DCC8);border:1px solid #8FAF9F;border-left:4px solid #C4923A;border-radius:12px;padding:14px 16px;font-size:14px;color:#1E2E28;line-height:1.75;margin-top:12px}
.rbox.d{border-left-color:#2D4A3E}
.rl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.spin-w{display:flex;justify-content:center;padding:18px}
.spin{width:26px;height:26px;border:2.5px solid #E8DCC8;border-top-color:#C4923A;border-radius:50%;animation:spin .8s linear infinite}
.sbar{display:flex;align-items:center;margin-bottom:14px}
.sc{width:25px;height:25px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;border:2px solid transparent;flex-shrink:0}
.sc.done{background:#4A7C6F;color:white}
.sc.act{background:#2D4A3E;color:white;border-color:#C4923A}
.sc.idle{background:#E8DCC8;color:#6B8A7E}
.sl{font-size:10px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.sln{flex:1;height:2px;margin:0 3px 14px}
.chat-w{background:#F5F0E8;border:1px solid #E8DCC8;border-radius:12px;padding:12px;max-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-top:10px}
.bm{max-width:82%;padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.65}
.bm.u{background:#2D4A3E;color:white;border-bottom-right-radius:3px;margin-left:auto}
.bm.a{background:white;border:1px solid #E8DCC8;color:#1E2E28;border-bottom-left-radius:3px}
.ci-row{display:flex;gap:8px;margin-top:8px}
.ci-row input{flex:1}
.ci-row button{background:#2D4A3E;color:white;border:none;border-radius:10px;padding:11px 15px;font-size:14px;cursor:pointer}
.ci-row button:disabled{opacity:.4;cursor:not-allowed}
.rstl{background:none;border:none;color:#6B8A7E;font-size:12px;cursor:pointer;text-decoration:underline;font-family:inherit;padding:4px 0 0;display:block}
.status{font-size:12px;color:#6B8A7E;font-style:italic;text-align:center;padding:4px 0}
.copy-hint{font-size:11px;color:#6B8A7E;font-family:system-ui;margin:10px 0 4px}
.copy-field{width:100%;background:white;border:1.5px solid #C4923A;border-radius:8px;padding:9px 11px;font-size:13px;color:#1E2E28;font-family:inherit;line-height:1.7;resize:none;outline:none;cursor:text;display:block}
.tc{background:#F5F0E8;border-radius:12px;border:1px solid #E8DCC8;padding:13px 15px;margin-bottom:12px}
.tc-h{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.tip{background:linear-gradient(135deg,#FFF8EC,#FFF0D4);border-left:4px solid #C4923A;border-radius:12px;padding:13px 15px;font-size:13px;color:#1E2E28;line-height:1.65;font-family:system-ui;margin:12px 0}
.back{text-align:center;padding:0 24px 16px}
.back button{background:none;border:none;color:#6B8A7E;font-size:12px;cursor:pointer;font-family:inherit;text-decoration:underline}
.footer{margin-top:18px;font-size:11px;color:rgba(143,175,159,.5);font-family:system-ui}
.qprog{font-size:11px;color:#C4923A;font-family:system-ui;font-weight:700;margin-bottom:6px}
.qbar{height:4px;background:#E8DCC8;border-radius:4px;margin-bottom:16px}
.qbar-fill{height:4px;background:linear-gradient(90deg,#2D4A3E,#C4923A);border-radius:4px;transition:width .3s}
.profile-note{background:#FFF8EC;border:1px solid #E9D2A6;border-radius:10px;padding:10px 12px;margin-bottom:14px;font:12px/1.55 system-ui;color:#5E513A}
.profile-note button{float:right;background:none;border:0;color:#2D4A3E;text-decoration:underline;cursor:pointer;font:inherit}
.field-help{font:12px/1.5 system-ui;color:#6B8A7E;margin-top:5px}
.hidden{display:none}
.choices{display:grid;gap:8px;margin:8px 0 12px}
.choice{display:flex;align-items:flex-start;gap:9px;background:#F5F0E8;border:1.5px solid #D8CDBB;border-radius:9px;padding:10px 12px;font:13px/1.45 system-ui;color:#1E2E28;cursor:pointer}
.choice:has(input:checked){border-color:#C4923A;background:#FFF8EC}
.choice input{width:auto;margin-top:2px;accent-color:#2D4A3E}
.example{font:12px/1.5 system-ui;color:#6B8A7E;background:#F5F0E8;border-radius:8px;padding:8px 10px;margin:0 0 10px}
.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.validation{font:12px/1.5 system-ui;color:#A23A2A;margin:7px 0}
@media(max-width:520px){.mini-grid{grid-template-columns:1fr}.body{padding:18px 16px 24px}}
</style>
</head>
<body>
<div class="hdr">
  <div class="ey">Tierbusiness Community</div>
  <h1>Marketing-Kompass</h1>
  <div class="sub">Diagnose · Kanalwahl · Wochenplan · Umsetzung</div>
</div>
<div class="card" id="card"></div>
<div class="footer">🐾 Susanne Zischgl · Tierberufler-Kompass-System</div>

<script>
var CATS=["Automatisch passenden Kanal wählen","Instagram","Facebook","Google-Unternehmensprofil","Flyer / Plakat","Kooperationen","E-Mail / Newsletter","Skool / Fachcommunity"];
var PROFESSIONS=["Hundetraining","Katzenberatung","Tierphysiotherapie","Tierheilpraxis","Tierernährungsberatung","Tierpflege / Grooming","Tierbetreuung / Tiersitting","Tierkommunikation","Tierfotografie","Tiergestützte Arbeit","Tierarztpraxis","Anderer Tierberuf"];
var SYS="Du bist Susanne, erfahrene Business-Coachin fuer Menschen in Tierberufen mit ueber 30 Jahren Erfahrung. Du arbeitest mit dem Tierberufler-Kompass (5 Bereiche: 1.Beziehung Mensch&Tier 2.Businessstruktur 3.Mentale Muster 4.Wert&Geld 5.Positionierung). Warm, klar, respektvoll und ohne Floskeln. Deutsch, du-Ansprache. Verwende niemals automatisch Hundebeispiele. Richte Sprache, Kundensituationen und Beispiele konsequent am angegebenen Tierberuf und Schwerpunkt aus. Wenn keine Tierart genannt ist, bleibe tierartenneutral.";
var GUARDRAILS="VERBINDLICHE QUALITAETSREGELN: Nutze ausschließlich Angaben, die die Person tatsächlich gemacht hat. Erfinde keine Qualifikation, Zertifizierung, Spezialisierung, Kundenerfahrung, Erfolgsgeschichte, Preise, Gratisangebote, Vorträge, Rabatte oder Fallbeispiele. Fehlende Angaben erscheinen klar als [Platzhalter] oder werden als Rückfrage benannt. Beachte Regional/Online strikt: Bei 'Online' keine lokalen Suchanfragen, Aushänge, Umkreis-Empfehlungen oder Vor-Ort-Termine; bei 'Regional' keine rein digitalen Annahmen. Erstelle nur die verlangte Anzahl an Maßnahmen. Keine willkürlichen Postingzeiten; empfehle nur, nach eigenen Nutzungsdaten zu planen oder dann zu veröffentlichen, wenn Rückfragen beantwortet werden können. Keine abwertenden Sätze wie 'du ignorierst', 'leerer Raum' oder 'Likes zahlen keine Rechnungen'. Keine unbelegten medizinischen, therapeutischen oder ernährungsbezogenen Ursachen-, Diagnose-, Heilungs-, Wirkungs- oder Kostenversprechen. Symptome haben verschiedene mögliche Ursachen; bei Beschwerden tierärztliche Abklärung nennen und das jeweilige Berufsrecht beziehungsweise die Fachgrenzen respektieren. Ernährungsberatung nie als Ersatz für tierärztliche Diagnostik darstellen. Bei Kontakt zu Tierarztpraxen niemals 'Kollegin/Kollege' schreiben, wenn die Person nicht ausdrücklich Tierärztin/Tierarzt ist; nutze 'Guten Tag liebes Praxisteam' und beschreibe die Tätigkeit als ergänzend. Keine erfundenen Vorher-Nachher-Fotos oder Testimonials. Gib ausschließlich Klartext ohne Markdownzeichen wie **, # oder Tabellen aus. Gliedere mit kurzen Klartext-Ueberschriften und Leerzeilen. Beende jeden Text vollständig, nie mitten im Satz. Prüfe vor der Ausgabe intern: Fakten erfunden? Reichweite passend? Fachgrenzen gewahrt? Anzahl eingehalten? Ton respektvoll? Text vollständig? Gib nur die korrigierte Endfassung aus, nicht die Prüfung.";
var QUESTIONS=[
  {title:"Was möchtest du in den nächsten vier Wochen konkret erreichen?",type:"goal",example:"Beispiel: Ich möchte fünf passende Anfragen für meine Online-Beratung erhalten."},
  {title:"Welches konkrete Angebot sollen Kunden kaufen oder buchen?",type:"offer",example:"Beispiel: 60-minütige Online-Ernährungsberatung für 89 Euro. Interessenten sollen einen Termin buchen."},
  {title:"Für wen ist dieses Angebot gedacht – und welches konkrete Problem oder Bedürfnis hat diese Person?",type:"text",example:"Beispiel: Halter älterer Katzen, die bei der Futterauswahl Orientierung suchen."},
  {title:"Wie werden potenzielle Kunden momentan auf dich aufmerksam?",type:"channels",example:"Wähle alles aus, was du derzeit wirklich nutzt."},
  {title:"Wie setzt du diese Marketingwege konkret ein?",type:"channelDetails",example:"Die passende Folgefrage richtet sich nach deiner Auswahl."},
  {title:"Was ist in den vergangenen vier Wochen daraus entstanden?",type:"results",example:"Schätzungen sind in Ordnung. Wichtig ist die Trennung zwischen Reaktionen, Anfragen und Verkäufen."},
  {title:"Was passiert, wenn sich jemand für dein Angebot interessiert?",type:"path",example:"Wähle den tatsächlichen nächsten Schritt – nicht den gewünschten."},
  {title:"Was kannst du pro Woche realistisch für dein Marketing einsetzen?",type:"capacity",example:"So empfiehlt dir die App nur Maßnahmen, die du wirklich umsetzen kannst."}
];
var screen="welcome",tab=0,dStep=0,dAnswers=[],dCurQ=0,dDiag="",dTask="",dChat=[],dCont="",cCat=CATS[0],cTopic="",cResult="",profession="",professionOther="",animalFocus="",businessReach="",qualification="";

function $(id){return document.getElementById(id);}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function cleanAI(s){return String(s||"").replace(/\*\*/g,"").replace(/^#{1,6}\s*/gm,"").replace(/```[a-z]*|```/gi,"").replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim();}
function formatAI(s){return esc(cleanAI(s)).replace(/\n\n/g,"</p><p style=\"margin-top:10px\">").replace(/\n/g,"<br>");}

function callAI(sys,user,history,cb,errcb){
  var msgs=history?history.concat([{role:"user",content:user}]):[{role:"user",content:user}];
  fetch("https://tierakademie-proxy.tierakademie.workers.dev",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:1200,system:sys+"\n\n"+GUARDRAILS,messages:msgs})
  }).then(function(r){if(!r.ok)throw new Error("Fehler "+r.status);return r.json();})
  .then(function(d){if(d.error)throw new Error(d.error.message);var out=cleanAI(d.content&&d.content[0]?d.content[0].text:"");if(!out)throw new Error("Leere Antwort");cb(out);})
  .catch(function(e){errcb(e.message||"Verbindungsfehler");});
}

function render(){
  if(screen==="welcome")renderWelcome();
  else renderMain();
}

function renderWelcome(){
  var popts='<option value="">Bitte wählen...</option>'+PROFESSIONS.map(function(p){return '<option value="'+p+'"'+(profession===p?' selected':'')+'>'+p+'</option>';}).join('');
  $("card").innerHTML=
    '<div class="card-hdr"><div class="e">Willkommen</div><h2>Dein Marketing-Kompass für Tierberufe.</h2><p>Die App prüft Positionierung, Botschaft und Kundenerreichung – online wie offline.</p></div>'+ 
    '<div class="body">'+
    '<span class="lbl" style="margin-top:0">Was ist dein Tierberuf / deine Branche?</span><select id="profession" onchange="profession=this.value;toggleOther()">'+popts+'</select>'+ 
    '<div id="other-wrap" class="'+(profession==='Anderer Tierberuf'?'':'hidden')+'"><span class="lbl">Dein Tierberuf</span><input id="profession-other" type="text" value="'+professionOther+'" placeholder="z. B. Pferdeosteopathie" oninput="professionOther=this.value"></div>'+ 
    '<span class="lbl">Wie lautet deine genaue berufliche Bezeichnung?</span><input id="qualification" type="text" value="'+esc(qualification)+'" placeholder="z. B. Tierernährungsberaterin – oder: noch in Ausbildung" oninput="qualification=this.value">'+
    '<p class="field-help">Die App verwendet nur diese Angabe und erfindet keine Qualifikation.</p>'+ 
    '<span class="lbl">Mit welchen Tieren oder Kunden arbeitest du?</span><input id="animal-focus" type="text" value="'+animalFocus+'" placeholder="z. B. Pferde und ihre Halterinnen" oninput="animalFocus=this.value">'+
    '<p class="field-help">Optional, aber hilfreich fuer wirklich passende Beispiele.</p>'+ 
    '<span class="lbl">Wo können Kunden dein Angebot nutzen?</span><select id="business-reach" onchange="businessReach=this.value"><option value="">Bitte wählen...</option><option'+(businessReach==='Regional'?' selected':'')+'>Regional</option><option'+(businessReach==='Online'?' selected':'')+'>Online</option><option'+(businessReach==='Regional und online'?' selected':'')+'>Regional und online</option></select>'+
    '<div class="tip">&#128161; Deine Angaben gelten für Diagnose, Kanalwahl und Marketing-Ideen. Die App berücksichtigt auch Flyer, Empfehlungen, Kooperationen und lokale Maßnahmen.</div>'+ 
    '<button class="btn-p" onclick="startApp()">Weiter zum Kompass &#8594;</button>'+ 
    '</div>';
}

function toggleOther(){var w=$("other-wrap");if(w)w.className=profession==="Anderer Tierberuf"?"":"hidden";}
function getProfession(){return profession==="Anderer Tierberuf"?professionOther.trim():profession;}
function profileContext(){return "Tierberuf/Branche: "+getProfession()+"\nGenaue berufliche Bezeichnung/Qualifikation: "+qualification.trim()+"\nTier- oder Kundenschwerpunkt: "+(animalFocus.trim()||"nicht angegeben; bitte tierartenneutral formulieren")+"\nGeschäftsmodell/Reichweite: "+(businessReach||"nicht angegeben");}
function startApp(){
  var p=$("profession"),o=$("profession-other"),q=$("qualification"),a=$("animal-focus"),r=$("business-reach");
  profession=p?p.value:profession;professionOther=o?o.value:professionOther;qualification=q?q.value:qualification;animalFocus=a?a.value:animalFocus;businessReach=r?r.value:businessReach;
  if(!getProfession()){alert("Bitte waehle deinen Tierberuf oder trage ihn ein.");return;}
  if(!qualification.trim()){alert("Bitte trage deine genaue berufliche Bezeichnung ein – oder 'noch in Ausbildung'.");return;}
  if(!businessReach){alert("Bitte gib an, ob dein Angebot regional, online oder beides verfügbar ist.");return;}
  screen="main";tab=0;dCurQ=0;dAnswers=[];render();
}
function profileBanner(){return '<div class="profile-note"><button onclick="screen=\'welcome\';render()">Ändern</button><strong>Dein Bereich:</strong> '+esc(getProfession())+' · '+esc(qualification)+(animalFocus.trim()?' · '+esc(animalFocus.trim()):'')+' · '+esc(businessReach)+'</div>';}

function renderMain(){
  var hdr='<div class="tabs"><button class="tab'+(tab===0?" on":"")+'" onclick="tab=0;renderMain()">&#129517; Marketing-Kompass</button><button class="tab'+(tab===1?" on":"")+'" onclick="tab=1;renderMain()">&#9997;&#65039; Marketing-Ideen</button></div>';
  var body='';
  if(tab===0){
    if(dStep===0)body=renderQuestions();
    else body=renderDiagResult();
  } else {
    body=renderContent();
  }
  $("card").innerHTML=
    '<div class="card-hdr"><div class="e">Tierbusiness Community</div><h2>Marketing-Kompass</h2><p>Diagnose · Kanalwahl · Wochenplan · Umsetzung</p></div>'+ 
    hdr+'<div class="body">'+profileBanner()+body+'</div>'+ 
    '';
}

function renderQuestions(){
  var q=QUESTIONS[dCurQ];
  var pct=Math.round(((dCurQ+1)/QUESTIONS.length)*100);
  return '<div class="qprog">Frage '+(dCurQ+1)+' von '+QUESTIONS.length+'</div>'+ 
    '<div class="qbar"><div class="qbar-fill" style="width:'+pct+'%"></div></div>'+ 
    '<p style="font-size:15px;font-weight:700;color:#2D4A3E;line-height:1.5;margin-bottom:8px">'+q.title+'</p>'+ 
    '<div class="example">&#128161; '+q.example+'</div>'+renderQuestionInput(q)+
    '<div id="qerror" class="validation"></div>'+ 
    '<div class="btn-row">'+
    (dCurQ>0?'<button class="btn-o" onclick="saveAndGo(-1)">&#8592; Zurück</button>':'')+
    (dCurQ<QUESTIONS.length-1?
      '<button class="btn-p" onclick="saveAndGo(1)">Weiter &#8594;</button>':
      '<button class="btn-p" onclick="saveAndStartDiag()">&#129517; Diagnose starten</button>')+
    '</div>';
}

function choiceList(name,items,selected,multiple){
  selected=multiple?(selected||[]):selected||"";
  return '<div class="choices">'+items.map(function(x){var on=multiple?selected.indexOf(x)>=0:selected===x;return '<label class="choice"><input type="'+(multiple?'checkbox':'radio')+'" name="'+name+'" value="'+esc(x)+'"'+(on?' checked':'')+'><span>'+esc(x)+'</span></label>';}).join('')+'</div>';
}

function renderQuestionInput(q){
  var a=dAnswers[dCurQ];
  if(q.type==="goal"){
    a=a||{};
    return choiceList("goal",["Mehr passende Anfragen","Mehr Buchungen oder Verkäufe","Ein bestimmtes Angebot bekannter machen","Die richtige Zielgruppe erreichen","Den passenden Marketingkanal finden","Etwas anderes"],a.choice,false)+
      '<span class="lbl">Dein Ziel in einem Satz</span><input id="goal-detail" value="'+esc(a.detail)+'" placeholder="Was soll konkret anders sein?">';
  }
  if(q.type==="offer"){
    a=a||{};
    return '<span class="lbl" style="margin-top:0">Angebot</span><textarea id="offer-name" rows="3" placeholder="Was genau bietest du an?">'+esc(a.offer)+'</textarea>'+ 
      '<div class="mini-grid"><div><span class="lbl">Preis, falls festgelegt</span><input id="offer-price" value="'+esc(a.price)+'" placeholder="z. B. 89 Euro"></div><div><span class="lbl">Gewünschter nächster Schritt</span><input id="offer-action" value="'+esc(a.action)+'" placeholder="z. B. Termin buchen"></div></div>';
  }
  if(q.type==="text")return '<textarea id="qa" rows="5" placeholder="Beschreibe Wunschkunde und konkretes Problem...">'+esc(a||"")+'</textarea>';
  if(q.type==="channels")return choiceList("channels",["Instagram","Facebook","TikTok","Skool oder andere Community","Google oder Webseite","Flyer oder Plakate","Empfehlungen","Kooperationen","Veranstaltungen oder Märkte","Bezahlte Werbung","Bisher gar nicht","Etwas anderes"],a,true);
  if(q.type==="channelDetails"){
    var chans=dAnswers[3]||[],hints=[];
    if(chans.some(function(x){return /Instagram|Facebook|TikTok/.test(x);}))hints.push("Social Media: Was veröffentlichst du, wie oft und wohin führst du Interessenten?");
    if(chans.indexOf("Skool oder andere Community")>=0)hints.push("Community: Wen erreichst du dort – potenzielle Kunden oder vor allem Fachkollegen? Was veröffentlichst du und wohin führst du Interessenten?");
    if(chans.indexOf("Flyer oder Plakate")>=0)hints.push("Flyer: Wo verteilst du sie, was steht darauf, gibt es QR-Code/Kontaktziel und wie viele wurden verteilt?");
    if(chans.indexOf("Empfehlungen")>=0)hints.push("Empfehlungen: Wer empfiehlt dich und wie erleichterst du das Weiterempfehlen?");
    if(chans.indexOf("Kooperationen")>=0)hints.push("Kooperationen: Welche Partner hast du angesprochen und mit welchem Vorschlag?");
    if(chans.indexOf("Google oder Webseite")>=0)hints.push("Google/Webseite: Was finden Besucher dort und können sie direkt Kontakt aufnehmen oder buchen?");
    if(!hints.length)hints.push("Beschreibe konkret, was du bisher tust, wie häufig und wohin du Interessenten führst.");
    return '<div class="example">'+hints.map(esc).join('<br>')+'</div><textarea id="qa" rows="6" placeholder="Deine konkrete Beschreibung...">'+esc(a||"")+'</textarea>';
  }
  if(q.type==="results"){
    a=a||{};
    return '<div class="mini-grid"><div><span class="lbl" style="margin-top:0">Likes, Reaktionen, Kommentare</span><input id="res-reactions" value="'+esc(a.reactions)+'" placeholder="z. B. etwa 20"></div><div><span class="lbl" style="margin-top:0">Nachrichten oder Anfragen</span><input id="res-inquiries" value="'+esc(a.inquiries)+'" placeholder="z. B. 3"></div><div><span class="lbl">Gespräche</span><input id="res-talks" value="'+esc(a.talks)+'" placeholder="z. B. 1"></div><div><span class="lbl">Buchungen oder Verkäufe</span><input id="res-sales" value="'+esc(a.sales)+'" placeholder="z. B. 0"></div></div>'+ 
      '<label class="choice" style="margin-top:10px"><input id="res-unknown" type="checkbox"'+(a.unknown?' checked':'')+'><span>Ich habe das bisher nicht gemessen.</span></label>';
  }
  if(q.type==="path")return choiceList("path",["Die Person schreibt mir eine Nachricht","Sie gelangt zu einer Angebotsseite","Sie kann direkt einen Termin buchen","Sie kann direkt kaufen","Ich melde mich persönlich","Es gibt noch keinen klaren nächsten Schritt","Etwas anderes"],a,false);
  if(q.type==="capacity"){
    a=a||{};
    return '<span class="lbl" style="margin-top:0">Verfügbare Zeit pro Woche</span><select id="cap-time"><option value="">Bitte wählen...</option>'+["Unter 1 Stunde","1–2 Stunden","3–5 Stunden","Mehr als 5 Stunden"].map(function(x){return '<option'+(a.time===x?' selected':'')+'>'+x+'</option>';}).join('')+'</select>'+ 
      '<span class="lbl">Monatliches Budget (optional)</span><input id="cap-budget" value="'+esc(a.budget)+'" placeholder="z. B. 0 Euro oder 100 Euro">'+ 
      '<span class="lbl">Was kannst und möchtest du umsetzen?</span>'+choiceList("formats",["Texte","Fotos","Kurze Videos","Persönliche Gespräche","Veranstaltungen oder lokale Aktionen"],a.formats,true)+
      '<span class="lbl">Was möchtest du ausdrücklich nicht machen? (optional)</span><input id="cap-nogo" value="'+esc(a.noGo)+'" placeholder="z. B. keine Videos">';
  }
  return '';
}

function selectedValues(name){return Array.prototype.slice.call(document.querySelectorAll('input[name="'+name+'"]:checked')).map(function(x){return x.value;});}
function selectedValue(name){var x=document.querySelector('input[name="'+name+'"]:checked');return x?x.value:"";}

function saveCurrentAnswer(){
  var type=QUESTIONS[dCurQ].type,a;
  if(type==="goal")a={choice:selectedValue("goal"),detail:$("goal-detail").value.trim()};
  else if(type==="offer")a={offer:$("offer-name").value.trim(),price:$("offer-price").value.trim(),action:$("offer-action").value.trim()};
  else if(type==="text"||type==="channelDetails")a=$("qa").value.trim();
  else if(type==="channels")a=selectedValues("channels");
  else if(type==="results")a={reactions:$("res-reactions").value.trim(),inquiries:$("res-inquiries").value.trim(),talks:$("res-talks").value.trim(),sales:$("res-sales").value.trim(),unknown:$("res-unknown").checked};
  else if(type==="path")a=selectedValue("path");
  else if(type==="capacity")a={time:$("cap-time").value,budget:$("cap-budget").value.trim(),formats:selectedValues("formats"),noGo:$("cap-nogo").value.trim()};
  dAnswers[dCurQ]=a;return validateAnswer(type,a);
}

function validateAnswer(type,a){
  if(type==="goal"&&(!a.choice||!a.detail))return "Bitte wähle ein Ziel und beschreibe es kurz.";
  if(type==="offer"&&(!a.offer||!a.action))return "Bitte nenne dein Angebot und den gewünschten nächsten Schritt.";
  if((type==="text"||type==="channelDetails")&&!a)return "Bitte beantworte die Frage – 'Ich weiß es nicht' ist ebenfalls möglich.";
  if(type==="channels"&&!a.length)return "Bitte wähle mindestens eine Möglichkeit.";
  if(type==="channels"&&a.indexOf("Bisher gar nicht")>=0&&a.length>1)return "'Bisher gar nicht' kann nicht zusammen mit anderen Marketingwegen gewählt werden.";
  if(type==="results"&&!a.unknown&&!a.reactions&&!a.inquiries&&!a.talks&&!a.sales)return "Bitte trage mindestens ein Ergebnis ein oder wähle 'nicht gemessen'.";
  if(type==="path"&&!a)return "Bitte wähle den aktuellen nächsten Schritt.";
  if(type==="capacity"&&(!a.time||!a.formats.length))return "Bitte wähle deine verfügbare Zeit und mindestens ein umsetzbares Format.";
  return "";
}

function saveAndGo(dir){
  var err=saveCurrentAnswer();if(dir>0&&err){$("qerror").textContent=err;return;}
  dCurQ+=dir;renderMain();
}

function answersSummary(){
  var summary="";
  for(var i=0;i<QUESTIONS.length;i++)summary+=QUESTIONS[i].title+"\nAntwort: "+answerText(i,dAnswers[i])+"\n\n";
  return summary;
}

function answerText(i,a){
  if(!a)return "keine Angabe";
  if(Array.isArray(a))return a.join(", ");
  if(typeof a==="string")return a;
  if(i===0)return a.choice+" – "+a.detail;
  if(i===1)return "Angebot: "+a.offer+"; Preis: "+(a.price||"nicht angegeben")+"; nächster Schritt: "+a.action;
  if(i===5)return a.unknown?"bisher nicht gemessen":"Reaktionen: "+(a.reactions||"0")+"; Anfragen: "+(a.inquiries||"0")+"; Gespräche: "+(a.talks||"0")+"; Verkäufe: "+(a.sales||"0");
  if(i===7)return "Zeit: "+a.time+"; Budget: "+(a.budget||"nicht angegeben")+"; mögliche Formate: "+a.formats.join(", ")+"; ausgeschlossen: "+(a.noGo||"nichts angegeben");
  return JSON.stringify(a);
}

function saveAndStartDiag(){
  var err=saveCurrentAnswer();if(err){$("qerror").textContent=err;return;}
  dStep=1;dDiag="";dTask="";renderMain();
  var summary=answersSummary();
  callAI(SYS+"\n\nAnalysiere die Antworten als Marketing-Kompass. Bewerte getrennt: Positionierung und Botschaft; Erreichen echter Wunschkunden; Passung der Online- oder Offline-Kanäle. Die angegebene Reichweite Regional/Online ist eine harte Grenze. Skool ist nur dann ein Kundengewinnungskanal, wenn dort tatsächlich Wunschkunden sind. Flyer: Prüfe Zielgruppe, Verteilort, Botschaft, Handlungsaufforderung, Anschlussziel und Messbarkeit. Empfiehl nicht pauschal mehr Social Media. Nenne den wahrscheinlichsten Kompass-Bereich, das zentrale Marketingproblem und genau einen vorrangigen Hauptkanal; höchstens einen späteren Ergänzungskanal nur als Ausblick. Zeige ein schwaches und ein verbessertes, zum Hauptkanal passendes Beispiel. Keine neuen Angebote oder Gratisleistungen erfinden. Maximal 220 Wörter.",
    profileContext()+"\n\n"+summary,null,
    function(d){
      dDiag=d;
      callAI(SYS+"\n\nErstelle einen kurzen Marketing-Wochenplan mit genau 3 nummerierten Schritten für genau den einen vorrangigen Hauptkanal aus der Diagnose. Jeder Schritt nennt Handlung und Ziel. Die angegebene Reichweite Regional/Online ist zwingend. Wenn Flyer der Hauptkanal sind, behandle Verteilort, Botschaft, Call-to-Action, Anschlussziel und Messung. Bei Social Media nenne Plattform und Format. Skool nur bei echten Wunschkunden. Keine zusätzlichen Kanäle, keine erfundenen Gratisangebote, Vorträge oder Referenzen. Maximal 170 Wörter.",
        profileContext()+"\n\nAntworten:\n"+summary+"\nDiagnose: "+dDiag,null,
        function(t){dTask=t;renderMain();},
        function(e){dTask="Fehler: "+e;renderMain();});
    },
    function(e){dDiag="Fehler: "+e;renderMain();});
}

function renderDiagResult(){
  var html=renderStepBar();
  if(dStep===1&&!dDiag)return html+'<div class="spin-w"><div class="spin"></div></div><div class="status">Analysiere deine Antworten...</div>';
  if(dDiag)html+='<div class="rbox d"><div class="rl">&#129517; Kompass-Diagnose</div><p>'+formatAI(dDiag)+'</p></div>';
  if(dDiag.indexOf("Fehler:")!==0&&!dTask)html+='<div class="spin-w"><div class="spin"></div></div><div class="status">Erstelle Aufgabe...</div>';
  if(dTask)html+='<div class="rbox"><div class="rl">&#9989; Deine Aufgabe diese Woche</div><p>'+formatAI(dTask)+'</p></div>';
  if(dTask&&dStep===1)html+='<div class="btn-row"><button class="btn-g" onclick="genCont()">&#9997;&#65039; Passende Maßnahme erstellen</button></div>';
  if(dStep===2)html+=renderChat();
  if(dStep===3)html+=renderContArea();
    return html;
}

function renderStepBar(){
  var steps=["Diagnose","Plan","Gespräch","Umsetzung"],cur=Math.min(dStep,3);
  var html='<div class="sbar">';
  for(var i=0;i<steps.length;i++){
    var done=i<cur,active=i===cur;
    html+='<div style="display:flex;flex-direction:column;align-items:center;gap:3px"><div class="sc '+(done?"done":active?"act":"idle")+'">'+(done?"&#10003;":i+1)+'</div><div class="sl" style="color:'+(active?"#2D4A3E":"#6B8A7E")+';font-weight:'+(active?"700":"400")+'">'+steps[i]+'</div></div>';
    if(i<steps.length-1)html+='<div class="sln" style="background:'+(done?"#4A7C6F":"#E8DCC8")+'"></div>';
  }
  return html+'</div>';
}

function renderChat(){
  var msgs="";
  if(dChat.length===0)msgs='<div style="font-size:12px;color:#6B8A7E;font-style:italic;text-align:center;padding:10px 0">Schreib deine erste Frage oder Reaktion...</div>';
  for(var i=0;i<dChat.length;i++){
    msgs+='<div style="display:flex;justify-content:'+(dChat[i].r==="u"?"flex-end":"flex-start")+'"><div class="bm '+(dChat[i].r==="u"?"u":"a")+'">'+formatAI(dChat[i].c)+'</div></div>';
  }
  return '<div class="chat-w" id="cw">'+msgs+'</div>'+
    '<div class="ci-row"><input type="text" id="ci" placeholder="Deine Antwort..." onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();sendChat()}" oninput="var b=$(&apos;csend&apos;);if(b)b.disabled=!this.value.trim()"><button id="csend" onclick="sendChat()" disabled>&#8594;</button></div>'+
    '<button class="btn-g" onclick="genCont()" style="margin-top:8px;width:100%">&#9997;&#65039; Passende Maßnahme erstellen</button>';
}

function renderContArea(){
  var html='';
  if(!dCont)html+='<div class="spin-w"><div class="spin"></div></div>';
  else html+='<div class="rbox"><div class="rl">&#9997;&#65039; Deine fertige Marketing-Maßnahme</div><p>'+formatAI(dCont)+'</p>'+ 
    '<p class="copy-hint">&#128070; Klick ins Feld &#8594; alles markiert &#8594; Strg+C</p>'+
    '<textarea class="copy-field" readonly rows="'+(Math.max(3,dCont.split("\n").length+1))+'" onclick="this.select()">'+dCont+'</textarea></div>';
    return html;
}

function renderContent(){
  var opts=CATS.map(function(c){return '<option'+(c===cCat?" selected":"")+'>'+c+'</option>';}).join("");
  return '<p style="font-size:13px;color:#6B8A7E;line-height:1.65;margin-bottom:12px">Lass die App den passenden Kanal wählen oder fordere gezielt einen Inhalt für Social Media, Google, Flyer, Kooperationen oder Skool an.</p>'+ 
    '<span class="lbl" style="margin-top:0">Kanal oder Maßnahme</span><select id="ccat" onchange="cCat=this.value">'+opts+'</select>'+ 
    '<span class="lbl">Angebot oder Thema</span><input type="text" id="ctop" placeholder="z. B. Ernährungsberatung, Neukundenaktion..." value="'+cTopic+'" oninput="cTopic=this.value">'+
    '<button class="btn-p" id="cgenbtn" onclick="genContent()">&#9997;&#65039; Marketing-Ideen erstellen</button>'+ 
    (cResult?'<div class="rbox" style="margin-top:12px"><p>'+formatAI(cResult)+'</p></div>':"");
}

function sendChat(){
  var ci=$("ci");if(!ci||!ci.value.trim())return;
  var msg=ci.value.trim();dChat.push({r:"u",c:msg});ci.value="";
  var b=$("csend");if(b)b.disabled=true;
  var cw=$("cw");
  if(cw){cw.innerHTML+='<div style="display:flex"><div class="bm a"><div style="display:flex;gap:4px"><div style="width:6px;height:6px;border-radius:50%;background:#8FAF9F;animation:bounce 1s ease 0s infinite"></div><div style="width:6px;height:6px;border-radius:50%;background:#8FAF9F;animation:bounce 1s ease .2s infinite"></div><div style="width:6px;height:6px;border-radius:50%;background:#8FAF9F;animation:bounce 1s ease .4s infinite"></div></div></div></div>';cw.scrollTop=cw.scrollHeight;}
  var summary="";for(var i=0;i<QUESTIONS.length;i++){summary+=QUESTIONS[i]+"\nAntwort: "+(dAnswers[i]||"keine Angabe")+"\n\n";}
  var hist=[{role:"user",content:profileContext()+"\n\n"+summary},{role:"assistant",content:dDiag+"\n\n"+dTask}];
  for(var i=0;i<dChat.length-1;i++)hist.push({role:dChat[i].r==="u"?"user":"assistant",content:dChat[i].c});
  callAI(SYS+"\n\nCoaching-Gespräch. Antworte kurz, klar und respektvoll, mit Rückfrage oder einem konkreten Hinweis. Nutze keine Angaben, die nicht im Profil oder Gespräch stehen. Maximal 100 Wörter.",msg,hist,
    function(rep){dChat.push({r:"a",c:rep});renderMain();setTimeout(function(){var cw=$("cw");if(cw)cw.scrollTop=cw.scrollHeight;},50);},
    function(e){dChat.push({r:"a",c:"Fehler: "+e});renderMain();});
}

function genCont(){
  dStep=3;dCont="";renderMain();
  callAI(SYS+"\n\nErstelle genau eine vollständige Marketingmaßnahme für den einen vorrangigen Hauptkanal der Diagnose. Keine zweite Plattform, keine weitere Maßnahme. Möglich sind Instagram-/Facebook-Inhalt, Reel-Skript, Google-Beitrag, Flyertext, Kooperationsanschreiben, E-Mail oder Skool-Beitrag. Reichweite Regional/Online zwingend beachten. Nutze für Qualifikation, Angebot, Preis, Gratisleistung, Kontakt, Erfahrungen und Spezialisierung nur ausdrücklich vorhandene Angaben; sonst [Platzhalter] oder neutrale Rückfrage. Bei Beschwerden keine Diagnose oder Ursache behaupten, tierärztliche Abklärung nennen. Bei Tierarztpraxen 'Guten Tag liebes Praxisteam', Tätigkeit als ergänzend und Diagnostik in tierärztlicher Hand. Ausgabe: Hauptkanal / Warum / Fertiger Inhalt / Umsetzung / Erfolg messen. Keine Uhrzeit ohne Nutzungsdaten. Maximal 240 Wörter.",
    profileContext()+"\n\nAlle Antworten:\n"+answersSummary()+"\nDiagnose: "+dDiag+"\nWochenplan: "+dTask,null,
    function(c){dCont=c;renderMain();},
    function(e){dCont="Fehler: "+e;renderMain();});
}

function genContent(){
  var btn=$("cgenbtn");if(btn)btn.disabled=true;
  cResult="";renderMain();
  callAI(SYS+"\n\nErstelle genau 3 kurze Marketing-Ideen innerhalb des ausgewählten Kanals. Bei 'Automatisch' wähle genau einen zur Reichweite passenden Hauptkanal und bleibe für alle drei Ideen dort. Nutze nur vorhandene Fakten; sonst [Platzhalter]. Für Flyer: Text, CTA, Anschlussziel, passende Verteilung und Messung. Für Social Media: Plattform und Format. Google nur bei passender regionaler beziehungsweise persönlicher Kundenbedienung. Kooperation: neutrale, korrekte Ansprache ohne erfundene Gleichstellung oder Qualifikation. Skool: klarstellen, ob Kunden oder Fachkollegen angesprochen werden. Keine medizinischen Ursache-, Diagnose- oder Heilversprechen. Maximal 330 Wörter.",
    profileContext()+"\nKanal/Maßnahme: "+cCat+(cTopic?"\nAngebot/Thema: "+cTopic:""),null,
    function(r){cResult=r;renderMain();},
    function(e){cResult="Fehler: "+e;renderMain();});
}

function resetDiag(){dStep=0;dAnswers=[];dCurQ=0;dDiag="";dTask="";dChat=[];dCont="";renderMain();}

render();
</script>
