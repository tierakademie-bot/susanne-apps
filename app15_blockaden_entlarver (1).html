<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Der Blockaden-Entlarver</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Georgia, serif; background: linear-gradient(160deg, #2D4A3E 0%, #1a3329 40%, #0f1e18 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 28px 16px 48px; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.03)} }
::-webkit-scrollbar{width:5px} ::-webkit-scrollbar-thumb{background:#C4923A;border-radius:3px}
.hdr{text-align:center;margin-bottom:26px}
.ey{font-size:11px;color:#D4A853;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;font-family:system-ui}
.hdr h1{font-size:24px;font-weight:700;color:white;margin-bottom:4px;line-height:1.2}
.hdr .sub{font-size:13px;color:#8FAF9F;font-family:system-ui}
.card{width:100%;max-width:580px;background:white;border-radius:20px;overflow:hidden;box-shadow:0 20px 70px rgba(0,0,0,.4)}
.card-hdr{background:linear-gradient(135deg,#2D4A3E,#4A7C6F);padding:22px 24px 18px;color:white}
.card-hdr .e{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#D4A853;margin-bottom:6px;font-family:system-ui}
.card-hdr h2{font-size:19px;font-weight:700;margin-bottom:8px;line-height:1.3}
.card-hdr p{font-size:13px;color:rgba(255,255,255,.85);line-height:1.7;font-family:system-ui}
.body{padding:20px 24px 26px}
.feat{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.feat-icon{width:36px;height:36px;border-radius:10px;background:#F5F0E8;border:1px solid #E8DCC8;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;margin-top:1px}
.feat-text{font-size:13px;color:#1E2E28;font-family:system-ui;line-height:1.6}
.feat-text strong{color:#2D4A3E}
.tip{background:linear-gradient(135deg,#FFF8EC,#FFF0D4);border-left:4px solid #C4923A;border-radius:10px;padding:13px 15px;font-size:13px;color:#1E2E28;line-height:1.7;font-family:system-ui;margin:14px 0}
.warnung{background:linear-gradient(135deg,#2D4A3E,#4A7C6F);border-radius:12px;padding:16px 18px;color:white;margin:14px 0;font-size:14px;line-height:1.75;font-style:italic}
.warnung strong{color:#D4A853;font-style:normal}
.btn-p{background:linear-gradient(135deg,#2D4A3E,#4A7C6F);color:white;border:none;border-radius:10px;padding:13px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;width:100%}
.btn-p:disabled{background:#8FAF9F;cursor:not-allowed}
.btn-g{background:linear-gradient(135deg,#C4923A,#D4A853);color:white;border:none;border-radius:10px;padding:13px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;width:100%}
.btn-o{background:transparent;border:1.5px solid #2D4A3E;color:#2D4A3E;border-radius:10px;padding:12px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-lnk{background:none;border:none;color:#6B8A7E;font-size:12px;cursor:pointer;text-decoration:underline;font-family:inherit;padding:8px 0 0;display:block}
.btn-row{display:flex;gap:10px;margin-top:14px}
.btn-row .btn-p,.btn-row .btn-g{flex:1}
.prog-meta{display:flex;justify-content:space-between;font-size:11px;color:#6B8A7E;font-family:system-ui;margin-bottom:6px}
.prog-track{background:#E8DCC8;border-radius:999px;height:6px;overflow:hidden;margin-bottom:8px}
.prog-fill{height:100%;background:linear-gradient(90deg,#2D4A3E,#C4923A);border-radius:999px}
.dots{display:flex;gap:6px;margin-bottom:20px}
.dot{flex:1;height:4px;border-radius:999px}
.q-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#C4923A;font-family:system-ui;margin-bottom:4px}
.q-title{font-size:18px;font-weight:700;color:#2D4A3E;margin-bottom:8px;line-height:1.35}
.q-hint{font-size:13px;color:#6B8A7E;font-style:italic;font-family:system-ui;line-height:1.6}
.idk{font-size:12px;color:#6B8A7E;font-family:system-ui;line-height:1.6;margin:6px 0 12px;font-style:italic}
textarea{width:100%;font-family:Georgia,serif;font-size:14px;color:#1E2E28;background:#F5F0E8;border:1.5px solid #8FAF9F;border-radius:10px;padding:11px 13px;outline:none;resize:vertical;line-height:1.65;margin:12px 0 0;display:block}
textarea:focus{border-color:#C4923A}
.blockade-box{background:linear-gradient(135deg,#2D4A3E,#1a3329);border-radius:14px;padding:18px 20px;margin-bottom:14px;color:white}
.blockade-box .bt{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#D4A853;margin-bottom:8px;font-family:system-ui}
.blockade-box .btext{font-size:15px;line-height:1.8}
.rbox{background:linear-gradient(135deg,#F5F0E8,#E8DCC8);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.rs-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.rs-txt{font-size:14px;color:#1E2E28;line-height:1.8}
.copy-hint{font-size:11px;color:#6B8A7E;font-family:system-ui;margin:10px 0 4px}
.copy-field{width:100%;background:white;border:1.5px solid #C4923A;border-radius:8px;padding:9px 11px;font-size:13px;color:#1E2E28;font-family:inherit;line-height:1.7;resize:none;outline:none;cursor:text;display:block}
.satz-box{background:linear-gradient(135deg,#C4923A,#D4A853);border-radius:14px;padding:18px 20px;margin-bottom:14px;color:white;animation:pulse 3s ease infinite}
.satz-box .st{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:rgba(255,255,255,.8);margin-bottom:8px;font-family:system-ui}
.satz-box .stext{font-size:16px;font-weight:700;line-height:1.6}
.spin-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:40px 0}
.spin{width:36px;height:36px;border:3px solid #E8DCC8;border-top-color:#C4923A;border-radius:50%;animation:spin .8s linear infinite}
.err{background:#fff0f0;border-left:4px solid #cc4444;border-radius:10px;padding:14px 16px;font-size:13px;color:#7a2222;font-family:system-ui}
.badge{display:inline-block;background:#2D4A3E;color:#D4A853;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;font-family:system-ui;letter-spacing:1px;text-transform:uppercase;margin-bottom:12px}
.footer{margin-top:18px;font-size:11px;color:rgba(143,175,159,.5);font-family:system-ui}
</style>
</head>
<body>
<div class="hdr">
  <div class="ey">Tierbusiness Community</div>
  <h1>Der Blockaden-Entlarver</h1>
  <div class="sub">Was haelt dein Business wirklich zurueck?</div>
</div>
<div class="card" id="card"></div>
<div class="footer">&#128062; Susanne Zischgl &middot; Tierberufler-Kompass-System</div>

<script>
var API_KEY = "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";

var QS = [
  {
    lbl: "Das Business-Gefuehl",
    q: "Wenn du ganz ehrlich bist: Wie fuehlt sich dein Business gerade an?",
    hint: "Nicht die offizielle Antwort. Die ehrliche. Zermurbend? Okay aber nicht gut? Eigentlich gut aber irgendwas stimmt nicht?",
    ph: "z. B. Es laeuft irgendwie, aber ich habe das Gefuehl ich trete auf der Stelle. Kunden kommen, aber nicht genug..."
  },
  {
    lbl: "Was du immer wieder aufschiebt",
    q: "Welche eine Sache schiebst du in deinem Business immer wieder auf?",
    hint: "Es gibt fast immer EINE Sache. Die Website ueberarbeiten. Die Preise erhoehen. Sich zeigen. Was ist es bei dir?",
    ph: "z. B. Ich wollte schon lange meine Preise erhoehen, aber ich traue mich nicht..."
  },
  {
    lbl: "Der innere Einwand",
    q: "Welcher Gedanke kommt sofort wenn du daran denkst, diese Sache anzugehen?",
    hint: "Das ist der Kern. Der erste Gedanke bevor du rationalisierst. Er klingt oft wie: Ich kann nicht... Was werden andere denken...",
    ph: "z. B. Sofort denke ich: Wer will das schon bezahlen. Oder: Ich bin noch nicht gut genug..."
  },
  {
    lbl: "Sichtbarkeit und du",
    q: "Wie ist das bei dir mit Sichtbarkeit: Social Media, Website, dich zeigen?",
    hint: "Nicht was du tust. Wie es sich ANFUEHLT. Unangenehm? Aufgesetzt? Falsch? Oder okay aber du machst es trotzdem nicht?",
    ph: "z. B. Posten fuehlt sich wie Aufdraengen an. Ich weiss nie was ich sagen soll..."
  },
  {
    lbl: "Geld und Selbstwert",
    q: "Was passiert in dir, wenn du an deine Preise denkst oder wenn du sie jemandem nennst?",
    hint: "Ganz ehrlich. Schaemet du dich? Rechtfertigst du dich innerlich? Findest du sie zu hoch? Oder zu niedrig aber du traust dich nicht?",
    ph: "z. B. Ich nenne meinen Preis und warte schon auf die Reaktion. Ich rechtfertige mich immer sofort..."
  }
];

var ANS = ["","","","",""];
var STEP = 0;
var RES = "";

function getEl(id){ return document.getElementById(id); }

function showWelcome(){
  getEl("card").innerHTML =
    '<div class="card-hdr">' +
    '<div class="e">Tierbusiness &middot; Mentale Muster</div>' +
    '<h2>Das ist nicht die App<br>fuer schnelle Antworten.</h2>' +
    '<p>Das hier ist die App fuer die Wahrheit. Nicht ueber dein Marketing. Die Wahrheit darueber, was dein Business wirklich zurueckhaelt.</p>' +
    '</div>' +
    '<div class="body">' +
    '<div class="badge">Blockaden-Entlarver</div>' +
    '<div class="warnung">' +
    'Viele Tierberufler denken: Mein Business haengt wegen des Marketings.<br><br>' +
    'Selten stimmt das.<br><br>' +
    'Meistens liegt es an etwas ganz anderem:<br>' +
    '<strong>Angst vor Bewertung. Helfersyndrom. Sichtbarkeitsvermeidung.</strong><br><br>' +
    'Diese App findet heraus, welche Blockade dich wirklich haelt.' +
    '</div>' +
    '<div class="feat"><div class="feat-icon">&#128270;</div><div class="feat-text"><strong>Der wahre Grund</strong> &ndash; warum dein Business gerade haengt.</div></div>' +
    '<div class="feat"><div class="feat-icon">&#128161;</div><div class="feat-text"><strong>Deine Hauptblockade</strong> &ndash; klar benannt, ohne Beschoenigung.</div></div>' +
    '<div class="feat"><div class="feat-icon">&#129309;</div><div class="feat-text"><strong>Dein innerer Satz</strong> &ndash; der Gedanke der alles stoppt.</div></div>' +
    '<div class="feat"><div class="feat-icon">&#128336;</div><div class="feat-text"><strong>Dein erster Schritt raus</strong> &ndash; konkret, machbar, heute.</div></div>' +
    '<div class="tip"><strong style="color:#C4923A">Ehrlichkeit ist hier Pflicht.</strong> Je ehrlicher deine Antworten, desto praeziser das Ergebnis. Und schreib <strong>Ich weiss es nicht</strong> wenn du wirklich nicht weisst.</div>' +
    '<button class="btn-p" onclick="showQ(1)">&#128270; Meine Blockade finden</button>' +
    '</div>';
}

function showQ(n){
  STEP = n;
  var q = QS[n-1];
  var pct = Math.round((n/5)*100);
  var dots = "";
  for(var i=0;i<5;i++){
    var c = i<n-1?"#4A7C6F":i===n-1?"#C4923A":"#E8DCC8";
    dots += '<div class="dot" style="background:'+c+'"></div>';
  }
  var back = n>1?'<button class="btn-o" onclick="goBack()">&#8592; Zurueck</button>':'';
  var nextCls = n===5?"btn-g":"btn-p";
  var nextLbl = n===5?"&#128270; Meine Blockade entlarven":"Weiter &#8594;";
  getEl("card").innerHTML =
    '<div class="body">' +
    '<div class="prog-meta"><span>Frage '+n+' von 5</span><span>'+pct+'%</span></div>' +
    '<div class="prog-track"><div class="prog-fill" style="width:'+pct+'%"></div></div>' +
    '<div class="dots">'+dots+'</div>' +
    '<div class="q-label">'+q.lbl+'</div>' +
    '<div class="q-title">'+q.q+'</div>' +
    '<div class="q-hint">'+q.hint+'</div>' +
    '<textarea id="ta" rows="4" placeholder="'+q.ph+'" oninput="chk()">'+(ANS[n-1]||'')+'</textarea>' +
    '<p class="idk">&#128161; Du kannst auch schreiben: <strong>Ich weiss es nicht</strong></p>' +
    '<div class="btn-row">'+back+'<button class="'+nextCls+'" id="nbtn" onclick="goNext()">'+nextLbl+'</button></div>' +
    '<button class="btn-lnk" onclick="reset()">&#8635; Von vorne starten</button>' +
    '</div>';
  chk();
}

function chk(){
  var ta=getEl("ta"), btn=getEl("nbtn");
  if(ta&&btn) btn.disabled = !ta.value.trim();
}

function goNext(){
  var ta=getEl("ta");
  if(!ta||!ta.value.trim()) return;
  ANS[STEP-1]=ta.value.trim();
  if(STEP<5){showQ(STEP+1);}
  else{generate();}
}

function goBack(){
  var ta=getEl("ta");
  if(ta) ANS[STEP-1]=ta.value.trim();
  showQ(STEP-1);
}

function showLoading(){
  getEl("card").innerHTML='<div class="body"><div class="spin-wrap"><div class="spin"></div><p style="font-size:14px;color:#6B8A7E;font-family:system-ui;font-style:italic">Susanne entlarvt deine Blockade...</p></div></div>';
}

function generate(){
  showLoading();
  var msg="";
  var labels=["Business-Gefuehl","Was immer wieder aufgeschoben wird","Innerer Einwand","Beziehung zu Sichtbarkeit","Beziehung zu Geld und Preisen"];
  for(var i=0;i<5;i++) msg+=labels[i]+": "+(ANS[i]||"keine Angabe")+"\n";

  var sys = "Du bist Susanne, Hundetrainerin und Business-Coach fuer Tierberufler mit ueber 30 Jahren Erfahrung. Du arbeitest mit dem Tierberufler-Kompass Bereich 3: Mentale Muster.\n\nDiese App entlarvt die echten Blockaden von Tierberuflern. Nicht Marketing-Probleme - sondern innere Muster:\n- Angst vor Bewertung und Ablehnung\n- Helfersyndrom (helfen duerfen, aber nicht verdienen)\n- Ich bin nicht gut genug\n- Sichtbarkeitsvermeidung\n- Preisscham\n- Perfektionismus als Aufschub-Strategie\n\nDu schreibst direkt, warm, ohne Beschoenigung. Nenne die Blockade beim Namen.\n\nSchreibe fuenf Abschnitte mit diesen exakten Ueberschriften:\n\nDas ist der wahre Grund:\n[2-3 Saetze direkt und klar]\n\nDeine Hauptblockade:\n[1 praegnanter Satz - so dass der Mensch denkt: Das bin ja ich]\n\nDein innerer Satz:\n[Der Glaubenssatz in Anfuehrungszeichen, z.B. Ich darf nur helfen, aber nicht wirklich verdienen.]\n\nWarum das passiert:\n[2-3 Saetze Erklaerung ohne Entschuldigung]\n\nDein erster Schritt raus:\n[1-2 Saetze konkrete sofort machbare Handlung]\n\nKein Markdown. Deutsch, du-Ansprache.";

  fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": API_KEY,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1000,
      system: sys,
      messages: [{role:"user",content:"Hier sind die fuenf Antworten:\n\n"+msg}]
    })
  })
  .then(function(r){if(!r.ok)throw new Error("Fehler "+r.status);return r.json();})
  .then(function(d){
    if(d.error)throw new Error(d.error.message);
    RES=d.content&&d.content[0]?d.content[0].text:"";
    showResult();
  })
  .catch(function(e){
    getEl("card").innerHTML='<div class="body"><div class="err">&#9888; '+e.message+'<br><button class="btn-p" style="margin-top:12px;width:auto;padding:9px 16px" onclick="generate()">&#8635; Nochmal versuchen</button></div></div>';
  });
}

function showResult(){
  var secs=[
    {key:"das ist der wahre grund",lbl:"&#128270; Das ist der wahre Grund",col:"#2D4A3E",type:"normal"},
    {key:"deine hauptblockade",lbl:"&#128161; Deine Hauptblockade",col:"#C4923A",type:"blockade"},
    {key:"dein innerer satz",lbl:"&#129309; Dein innerer Satz",col:"#D4A853",type:"satz"},
    {key:"warum das passiert",lbl:"&#128260; Warum das passiert",col:"#4A7C6F",type:"normal"},
    {key:"dein erster schritt",lbl:"&#128336; Dein erster Schritt raus",col:"#2D4A3E",type:"copy"}
  ];
  var parsed=[],cur=null;
  var lines=RES.split("\n");
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim(),low=line.toLowerCase();
    var found=false;
    for(var j=0;j<secs.length;j++){
      if(low.indexOf(secs[j].key)!==-1){
        if(cur)parsed.push(cur);
        cur={lbl:secs[j].lbl,col:secs[j].col,type:secs[j].type,txt:""};
        found=true;break;
      }
    }
    if(!found&&cur&&line) cur.txt+=(cur.txt?"\n":"")+line;
  }
  if(cur)parsed.push(cur);
  if(!parsed.length)parsed=[{lbl:"&#128270; Deine Blockade",col:"#2D4A3E",type:"blockade",txt:RES}];

  var html='<div class="body">' +
    '<p style="font-size:16px;font-weight:700;color:#2D4A3E;margin-bottom:4px">Entlarvt. &#128270;</p>' +
    '<p style="font-size:13px;color:#6B8A7E;font-family:system-ui;margin-bottom:16px;line-height:1.65">Lies es langsam. Atme einmal durch. Das hier ist kein Urteil &ndash; es ist Klarheit.</p>';

  for(var k=0;k<parsed.length;k++){
    var s=parsed[k];
    if(s.type==="blockade"){
      html+='<div class="blockade-box"><div class="bt">'+s.lbl+'</div><div class="btext">'+s.txt.replace(/\n/g,"<br>")+'</div></div>';
    } else if(s.type==="satz"){
      html+='<div class="satz-box"><div class="st">'+s.lbl+'</div><div class="stext">'+s.txt.replace(/\n/g,"<br>")+'</div>' +
        '<p style="font-size:11px;color:rgba(255,255,255,.6);margin-top:10px;font-family:system-ui">&#128070; Klick ins Feld &#8594; markieren &#8594; Strg+C</p>' +
        '<textarea style="width:100%;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.4);border-radius:8px;padding:9px 11px;font-size:13px;color:white;font-family:inherit;line-height:1.7;resize:none;outline:none;cursor:text;display:block;margin-top:4px" readonly rows="2" onclick="this.select()">'+s.txt+'</textarea>' +
        '</div>';
    } else if(s.type==="copy"){
      html+='<div class="rbox" style="border-left:4px solid '+s.col+'">' +
        '<div class="rs-lbl" style="color:'+s.col+'">'+s.lbl+'</div>' +
        '<div class="rs-txt">'+s.txt.replace(/\n/g,"<br>")+'</div>' +
        '<p class="copy-hint">&#128070; Klick ins Feld &#8594; markieren &#8594; Strg+C</p>' +
        '<textarea class="copy-field" readonly rows="3" onclick="this.select()">'+s.txt+'</textarea>' +
        '</div>';
    } else {
      html+='<div class="rbox" style="border-left:4px solid '+s.col+'">' +
        '<div class="rs-lbl" style="color:'+s.col+'">'+s.lbl+'</div>' +
        '<div class="rs-txt">'+s.txt.replace(/\n/g,"<br>")+'</div>' +
        '</div>';
    }
  }

  html+='<div style="background:linear-gradient(135deg,#F5F0E8,#E8DCC8);border-radius:12px;padding:14px 16px;margin-bottom:14px;font-size:13px;color:#1E2E28;line-height:1.7;font-family:system-ui;border-left:4px solid #C4923A">' +
    '<strong style="color:#C4923A">&#128161; Und jetzt?</strong> Die Blockade zu kennen ist der erste Schritt. Dein Tierbusiness wartet nicht auf Perfektion. Es wartet auf dich &ndash; so wie du bist.' +
    '</div>';

  html+='<button class="btn-p" onclick="reset()" style="margin-top:4px">&#8635; Nochmal von vorne</button></div>';
  getEl("card").innerHTML=html;
}

function reset(){ANS=["","","","",""];STEP=0;RES="";showWelcome();}

showWelcome();
</script>
</body>
</html>
