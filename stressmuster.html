h<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stressmuster · Die unsichtbaren Fäden</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Georgia, serif; background: linear-gradient(160deg, #4A3728 0%, #2E1F14 40%, #1a0f08 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 28px 16px 48px; }
@keyframes spin { to { transform: rotate(360deg); } }
::-webkit-scrollbar{width:5px} ::-webkit-scrollbar-thumb{background:#C4923A;border-radius:3px}

/* Farben Hundehalter-Community: warme Erdtöne */
/* deep:    #4A3728  (tiefbraun)     */
/* warm:    #8B5E3C  (warmbraun)     */
/* sand:    #C4A882  (sandig)        */
/* cream:   #F5EFE6  (cremig warm)   */
/* light:   #EDE3D8  (hellbeige)     */
/* ochre:   #C4923A  (gold-orange)   */
/* gold:    #D4A853  (gold)          */
/* rust:    #8B4513  (rostrot)       */
/* text:    #2E1A0E  (dunkel warm)   */
/* muted:   #7D6352  (gedämpft warm) */

.hdr{text-align:center;margin-bottom:26px}
.ey{font-size:11px;color:#D4A853;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;font-family:system-ui}
.hdr h1{font-size:24px;font-weight:700;color:white;margin-bottom:4px;line-height:1.2}
.hdr .sub{font-size:13px;color:#C4A882;font-family:system-ui}
.card{width:100%;max-width:580px;background:white;border-radius:20px;overflow:hidden;box-shadow:0 20px 70px rgba(0,0,0,.4)}
.card-hdr{background:linear-gradient(135deg,#4A3728,#8B5E3C);padding:22px 24px 18px;color:white}
.card-hdr .e{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#D4A853;margin-bottom:6px;font-family:system-ui}
.card-hdr h2{font-size:19px;font-weight:700;margin-bottom:8px;line-height:1.3}
.card-hdr p{font-size:13px;color:rgba(255,255,255,.82);line-height:1.7;font-family:system-ui}
.body{padding:20px 24px 26px}
.feat{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.feat-icon{width:36px;height:36px;border-radius:10px;background:#F5EFE6;border:1px solid #EDE3D8;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;margin-top:1px}
.feat-text{font-size:13px;color:#2E1A0E;font-family:system-ui;line-height:1.6}
.feat-text strong{color:#4A3728}
.tip{background:linear-gradient(135deg,#FFF8EC,#FFF0D4);border-left:4px solid #C4923A;border-radius:10px;padding:13px 15px;font-size:13px;color:#2E1A0E;line-height:1.7;font-family:system-ui;margin:14px 0}
.btn-p{background:linear-gradient(135deg,#4A3728,#8B5E3C);color:white;border:none;border-radius:10px;padding:13px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;width:100%}
.btn-p:disabled{background:#C4A882;cursor:not-allowed}
.btn-g{background:linear-gradient(135deg,#C4923A,#D4A853);color:white;border:none;border-radius:10px;padding:13px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;width:100%}
.btn-o{background:transparent;border:1.5px solid #4A3728;color:#4A3728;border-radius:10px;padding:12px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-lnk{background:none;border:none;color:#7D6352;font-size:12px;cursor:pointer;text-decoration:underline;font-family:inherit;padding:8px 0 0;display:block}
.btn-row{display:flex;gap:10px;margin-top:14px}
.btn-row .btn-p,.btn-row .btn-g{flex:1}
.prog-meta{display:flex;justify-content:space-between;font-size:11px;color:#7D6352;font-family:system-ui;margin-bottom:6px}
.prog-track{background:#EDE3D8;border-radius:999px;height:6px;overflow:hidden;margin-bottom:8px}
.prog-fill{height:100%;background:linear-gradient(90deg,#4A3728,#C4923A);border-radius:999px}
.dots{display:flex;gap:6px;margin-bottom:20px}
.dot{flex:1;height:4px;border-radius:999px}
.q-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#C4923A;font-family:system-ui;margin-bottom:4px}
.q-title{font-size:18px;font-weight:700;color:#4A3728;margin-bottom:8px;line-height:1.35}
.q-hint{font-size:13px;color:#7D6352;font-style:italic;font-family:system-ui;line-height:1.6}
.idk{font-size:12px;color:#7D6352;font-family:system-ui;line-height:1.6;margin:6px 0 12px;font-style:italic}
textarea{width:100%;font-family:Georgia,serif;font-size:14px;color:#2E1A0E;background:#F5EFE6;border:1.5px solid #C4A882;border-radius:10px;padding:11px 13px;outline:none;resize:vertical;line-height:1.65;margin:12px 0 0;display:block}
textarea:focus{border-color:#C4923A}
.rbox{background:linear-gradient(135deg,#F5EFE6,#EDE3D8);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.rs-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.rs-txt{font-size:14px;color:#2E1A0E;line-height:1.8}
.copy-hint{font-size:11px;color:#7D6352;font-family:system-ui;margin:10px 0 4px}
.copy-field{width:100%;background:white;border:1.5px solid #C4923A;border-radius:8px;padding:9px 11px;font-size:13px;color:#2E1A0E;font-family:inherit;line-height:1.7;resize:none;outline:none;cursor:text;display:block}
.spin-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:40px 0}
.spin{width:36px;height:36px;border:3px solid #EDE3D8;border-top-color:#C4923A;border-radius:50%;animation:spin .8s linear infinite}
.err{background:#fff0f0;border-left:4px solid #cc4444;border-radius:10px;padding:14px 16px;font-size:13px;color:#7a2222;font-family:system-ui}
.badge-5f{display:inline-block;background:#4A3728;color:#D4A853;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;font-family:system-ui;letter-spacing:1px;text-transform:uppercase;margin-bottom:12px}
.footer{margin-top:18px;font-size:11px;color:rgba(196,168,130,.5);font-family:system-ui}
.pw-box{background:#fff;border-radius:16px;padding:32px;max-width:420px;margin:0 auto;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,0.15)}.pw-box h2{font-family:Georgia,serif;color:#2C4A3E;font-size:1.3rem;margin-bottom:8px}.pw-box p{color:#7D6352;font-size:0.9rem;margin-bottom:20px}.pw-inp{width:100%;padding:12px 16px;border:2px solid #D4A853;border-radius:8px;font-size:1rem;text-align:center;outline:none;box-sizing:border-box;color:#2C4A3E}.pw-inp:focus{border-color:#2C4A3E}.pw-btn{width:100%;margin-top:12px;padding:12px;background:#B8860B;color:#fff;border:none;border-radius:8px;font-size:1rem;cursor:pointer;font-family:Georgia,serif}.pw-btn:hover{background:#2C4A3E}.pw-err{color:#c0392b;font-size:0.85rem;margin-top:8px;display:none}</style>
</head>
<body>
<div class="hdr">
  <div class="ey">Die unsichtbaren Fäden</div>
  <h1>Welches Stressmuster<br>bringst du mit?</h1>
  <div class="sub">7-Felder-Modell der Mensch-Hund-Dynamik</div>
</div>
<div class="card" id="card"></div>
<div class="footer">🐾 Susanne Zischgl · Die unsichtbaren Fäden zwischen Mensch und Hund</div>

<script>
var QS = [
  {
    lbl: "Wenn es schwierig wird",
    q: "Wie reagierst du, wenn dein Hund sich nicht so verhält wie erwartet?",
    hint: "Denk an einen konkreten Moment – letzten Spaziergang, beim Besuch, im Training. Was passiert in dir und was tust du?",
    ph: "z. B. Ich werde angespannt, zerre an der Leine und sage laut Nein..."
  },
  {
    lbl: "Dein Koerper unter Stress",
    q: "Was passiert in deinem Koerper, wenn du gestresst bist – und dein Hund dabei ist?",
    hint: "Atem, Haltung, Muskelspannung, Stimme... Dein Hund liest all das, bevor du ein Wort sagst.",
    ph: "z. B. Ich halte die Luft an, meine Schultern werden hochgezogen, ich werde still..."
  },
  {
    lbl: "Dein Muster",
    q: "Gibt es Situationen, die sich mit deinem Hund immer wieder wiederholen?",
    hint: "Nicht einmalige Vorfaelle – sondern Muster, die du kennst. Die Dinge, bei denen du dir denkst: Warum passiert das schon wieder?",
    ph: "z. B. Er zieht immer wenn andere Hunde kommen, ich verliere dann die Ruhe..."
  },
  {
    lbl: "Was du glaubst",
    q: "Was glaubst du, wenn du ehrlich bist: Warum zeigt dein Hund dieses Verhalten?",
    hint: "Nicht was du weisst – sondern was du in diesen Momenten wirklich denkst und fuehlst. Das ist wichtig.",
    ph: "z. B. Ich glaube manchmal, er macht das absichtlich. Oder: Ich bin einfach keine gute Hundehalterin..."
  },
  {
    lbl: "Deine Energie",
    q: "Wie wuerdest du die Energie beschreiben, die du in schwierigen Momenten ausstrahlst?",
    hint: "Wenn du von aussen auf dich schauen wuerdest – was sieht dein Hund? Unsicherheit, Druck, Rueckzug, Kontrolle, Angst, etwas anderes?",
    ph: "z. B. Ich glaube ich wirke hektisch und unberechenbar in solchen Momenten..."
  }
];

var ANS = ["","","","",""];
var STEP = 0;
var RES = "";

function $(id){return document.getElementById(id);}


var ACCESS="Klarheit";
function showGate(){
  var h='<div class="pw-box">';
  h+='<h2>Zugangswort eingeben</h2>';
  h+='<p>Diese App ist nur mit Zugangswort verfügbar.</p>';
  h+='<input class="pw-inp" id="pwi" type="text" placeholder="Zugangswort...">';
  h+='<button class="pw-btn" onclick="checkPW()">Weiter</button>';
  h+='<div class="pw-err" id="pwe">Das Zugangswort ist nicht korrekt.</div>';
  h+='</div>';
  $("card").innerHTML=h;
  document.getElementById("pwi").addEventListener("keydown",function(e){if(e.key==="Enter")checkPW();});
  document.getElementById("pwi").focus();
}
function checkPW(){
  var v=document.getElementById("pwi").value.trim();
  if(v===ACCESS){showWelcome();}
  else{document.getElementById("pwe").style.display="block";document.getElementById("pwi").value="";document.getElementById("pwi").focus();}
}
function showWelcome(){
  $("card").innerHTML =
    '<div class="card-hdr">'+
    '<div class="e">Feld 1 · Stressmuster</div>'+
    '<h2>Hier geht es nicht um deinen Hund.<br>Hier geht es um dich.</h2>'+
    '<p>Viele Hundehalter denken: „Mein Hund hat ein Problem." Aber oft passiert etwas ganz anderes: Du bringst eine bestimmte Energie mit – vielleicht Unsicherheit, Kontrolle, Druck oder Rueckzug – und dein Hund reagiert genau darauf.</p>'+
    '</div>'+
    '<div class="body">'+
    '<div class="badge-5f">7-Felder-Modell · Feld 1</div>'+
    '<div class="feat"><div class="feat-icon">&#129704;</div><div class="feat-text"><strong>Wie du unter Stress reagierst</strong> – und wie genau das automatisch in die Beziehung zu deinem Hund einfließt.</div></div>'+
    '<div class="feat"><div class="feat-icon">&#128262;</div><div class="feat-text"><strong>Was du aussendest, ohne es zu merken</strong> – dein Hund liest Koerpersprache, Atem und Energie, bevor du ein Wort sagst.</div></div>'+
    '<div class="feat"><div class="feat-icon">&#128270;</div><div class="feat-text"><strong>Welches Muster sich wiederholt</strong> – und warum es sich wiederholt, obwohl du es so nicht willst.</div></div>'+
    '<div class="feat"><div class="feat-icon">&#129309;</div><div class="feat-text"><strong>Was sich veraendern koennte</strong> – wenn du dieses Muster erkennst und bewusst anders reagierst.</div></div>'+
    '<div class="tip">Diese App ist wie ein Spiegel. Manchmal unbequem. Aber unglaublich befreiend.<br><br><strong style="color:#C4923A">Tipp:</strong> Antworte ehrlich und konkret – und wenn du etwas nicht weisst, schreib einfach <strong>Ich weiss es nicht</strong>.</div>'+
    '<button class="btn-p" onclick="showQ(1)">&#129704; Mein Stressmuster entdecken</button>'+
    '</div>';
}

function showQ(n){
  STEP = n;
  var q = QS[n-1];
  var pct = Math.round((n/5)*100);
  var dots = "";
  for(var i=0;i<5;i++){
    var c = i<n-1?"#8B5E3C":i===n-1?"#C4923A":"#EDE3D8";
    dots += '<div class="dot" style="background:'+c+'"></div>';
  }
  var back = n>1?'<button class="btn-o" onclick="goBack()">&#8592; Zurueck</button>':'';
  var nextCls = n===5?"btn-g":"btn-p";
  var nextLbl = n===5?"&#129704; Mein Muster zeigen":"Weiter &#8594;";
  $("card").innerHTML =
    '<div class="body">'+
    '<div class="prog-meta"><span>Frage '+n+' von 5</span><span>'+pct+'%</span></div>'+
    '<div class="prog-track"><div class="prog-fill" style="width:'+pct+'%"></div></div>'+
    '<div class="dots">'+dots+'</div>'+
    '<div class="q-label">'+q.lbl+'</div>'+
    '<div class="q-title">'+q.q+'</div>'+
    '<div class="q-hint">'+q.hint+'</div>'+
    '<textarea id="ta" rows="4" placeholder="'+q.ph+'" oninput="chk()">'+(ANS[n-1]||'')+'</textarea>'+
    '<p class="idk">&#128161; Du kannst auch schreiben: <strong>Ich weiss es nicht</strong> – das ist eine vollwertige Antwort.</p>'+
    '<div class="btn-row">'+back+'<button class="'+nextCls+'" id="nbtn" onclick="goNext()">'+nextLbl+'</button></div>'+
    '<button class="btn-lnk" onclick="reset()">&#8635; Von vorne starten</button>'+
    '</div>';
  chk();
}

function chk(){
  var ta=$("ta"), btn=$("nbtn");
  if(ta&&btn) btn.disabled = !ta.value.trim();
}

function goNext(){
  var ta=$("ta");
  if(!ta||!ta.value.trim()) return;
  ANS[STEP-1]=ta.value.trim();
  if(STEP<5){showQ(STEP+1);}
  else{generate();}
}

function goBack(){
  var ta=$("ta");
  if(ta) ANS[STEP-1]=ta.value.trim();
  showQ(STEP-1);
}

function showLoading(){
  $("card").innerHTML='<div class="body"><div class="spin-wrap"><div class="spin"></div><p style="font-size:14px;color:#7D6352;font-family:system-ui;font-style:italic">Susanne schaut in den Spiegel mit dir...</p></div></div>';
}

function generate(){
  showLoading();
  var msg="";
  var labels=["Reaktion in schwierigen Momenten","Koerper unter Stress","Wiederkehrende Muster","Innere Ueberzeugungen","Ausgestrahlte Energie"];
  for(var i=0;i<5;i++) msg+=labels[i]+": "+(ANS[i]||"keine Angabe")+"\n";

  var sys="Du bist Susanne, erfahrene Hundetrainerin, Physiotherapeutin und systemische Coach mit ueber 30 Jahren Erfahrung in der Mensch-Hund-Beziehung. Du arbeitest mit dem 7-Felder-Modell der Mensch-Hund-Dynamik. Feld 1 ist das Stressmuster – wie der Mensch unter Stress reagiert und was er dadurch unbewusst in die Beziehung mit dem Hund einbringt.\n\nDu schreibst warm, tief, ehrlich und ohne Floskeln. Keine Ratschlaege, kein Coaching-Sprech. Du sprichst wie eine erfahrene Freundin, die wirklich hinschaut.\n\nBasierend auf den fuenf Antworten schreibst du vier Abschnitte mit diesen exakten Ueberschriften:\n\nDein Stressmuster:\n[Beschreibe in 3-4 Saetzen, welches Stressmuster du in den Antworten siehst. Konkret, warm, ohne Bewertung. Nenne das Muster beim Namen – z.B. Kontrollmuster, Rueckzugsmuster, Ueberanpassung.]\n\nWas dein Hund sieht:\n[2-3 Saetze: Was nimmt der Hund wahr, wenn dieses Muster aktiv wird? Nicht was er denkt – sondern was er koerperlich und energetisch wahrnimmt.]\n\nDer Spiegel:\n[2-3 Saetze: Was koennte das Verhalten des Hundes ueber dieses Muster spiegeln? Vorsichtig und einladend formuliert – nicht als Diagnose, sondern als Einladung zum Nachdenken.]\n\nDein naechster Schritt:\n[1-2 Saetze: Eine einzige, konkrete innere Handlung – kein Training, keine Technik. Etwas das man in sich beobachten oder ausprobieren kann.]\n\nKein Markdown. Deutsch, du-Ansprache.";

  fetch("https://tierakademie-proxy.tierakademie.workers.dev",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":"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","anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({
      model:"claude-haiku-4-5-20251001",
      max_tokens:1000,
      system:sys,
      messages:[{role:"user",content:"Hier sind die fuenf Antworten:\n\n"+msg}]
    })
  })
  .then(function(r){if(!r.ok)throw new Error("Fehler "+r.status);return r.json();})
  .then(function(d){
    if(d.error)throw new Error(d.error.message);
    RES=d.content&&d.content[0]?d.content[0].text:"";
    showResult();
  })
  .catch(function(e){
    $("card").innerHTML='<div class="body"><div class="err">&#9888; '+e.message+'<br><button class="btn-p" style="margin-top:12px;width:auto;padding:9px 16px" onclick="generate()">&#8635; Nochmal versuchen</button></div></div>';
  });
}

function showResult(){
  var secs=[
    {key:"dein stressmuster",lbl:"&#129704; Dein Stressmuster",col:"#4A3728",copy:false},
    {key:"was dein hund sieht",lbl:"&#128062; Was dein Hund sieht",col:"#8B5E3C",copy:false},
    {key:"der spiegel",lbl:"&#129781; Der Spiegel",col:"#C4923A",copy:false},
    {key:"dein naechster schritt",lbl:"&#128336; Dein naechster Schritt",col:"#D4A853",copy:true}
  ];
  var parsed=[],cur=null;
  var lines=RES.split("\n");
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim(),low=line.toLowerCase();
    var found=false;
    for(var j=0;j<secs.length;j++){
      if(low.indexOf(secs[j].key)!==-1){
        if(cur)parsed.push(cur);
        cur={lbl:secs[j].lbl,col:secs[j].col,copy:secs[j].copy,txt:""};
        found=true;break;
      }
    }
    if(!found&&cur&&line) cur.txt+=(cur.txt?"\n":"")+line;
  }
  if(cur)parsed.push(cur);
  if(!parsed.length)parsed=[{lbl:"&#129704; Dein Stressmuster",col:"#4A3728",copy:false,txt:RES}];

  var html='<div class="body">'+
    '<div class="badge-5f">7-Felder-Modell · Feld 1</div>'+
    '<p style="font-size:16px;font-weight:700;color:#4A3728;margin-bottom:4px">Dein Spiegel &#129704;</p>'+
    '<p style="font-size:13px;color:#7D6352;font-family:system-ui;margin-bottom:16px;line-height:1.65">Lies es langsam. Lass es ankommen. Es ist kein Urteil – es ist eine Einladung.</p>';

  for(var k=0;k<parsed.length;k++){
    var s=parsed[k];
    var cp=s.copy?
      '<p class="copy-hint">&#128070; Klick ins Feld &#8594; alles markiert &#8594; Strg+C</p>'+
      '<textarea class="copy-field" readonly rows="3" onclick="this.select()">'+s.txt+'</textarea>':'';
    html+='<div class="rbox" style="border-left:4px solid '+s.col+'">'+
      '<div class="rs-lbl" style="color:'+s.col+'">'+s.lbl+'</div>'+
      '<div class="rs-txt">'+s.txt.replace(/\n/g,"<br>")+'</div>'+cp+'</div>';
  }

  html+='<div style="background:#F5EFE6;border-radius:12px;padding:14px 16px;margin-bottom:14px;font-size:13px;color:#7D6352;line-height:1.7;font-family:system-ui">'+
    '<strong style="color:#4A3728">Und jetzt?</strong> Dieses Muster ist Feld 1 von 5. In Feld 2 schauen wir: Was braucht dein Hund wirklich von dir – und was ist dein innerer Hebel, um das zu geben?'+
    '</div>';
  html+='</div>';
  $("card").innerHTML=html;
}

function reset(){ANS=["","","","",""];STEP=0;RES="";showWelcome();}

showGate();
</script>
<footer style="text-align:center; padding: 20px; font-size: 0.85em; color: #6B7C47; margin-top: 40px; border-top: 1px solid #C8B89A;">

</footer>
</body>
</html>
