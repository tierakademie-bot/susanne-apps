<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dein stimmiger Weg · Die unsichtbaren Fäden</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Georgia, serif; background: linear-gradient(160deg, #2A1A3E 0%, #1A0E28 40%, #0D0714 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 28px 16px 48px; }
@keyframes spin { to { transform: rotate(360deg); } }
::-webkit-scrollbar{width:5px} ::-webkit-scrollbar-thumb{background:#9B6FD4;border-radius:3px}
.hdr{text-align:center;margin-bottom:26px}
.ey{font-size:11px;color:#D4A853;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;font-family:system-ui}
.hdr h1{font-size:24px;font-weight:700;color:white;margin-bottom:4px;line-height:1.2}
.hdr .sub{font-size:13px;color:#C4A8E0;font-family:system-ui;opacity:.85}
.card{width:100%;max-width:580px;background:white;border-radius:20px;overflow:hidden;box-shadow:0 20px 70px rgba(0,0,0,.5)}
.card-hdr{background:linear-gradient(135deg,#2A1A3E,#6B3FA0);padding:22px 24px 18px;color:white}
.card-hdr .e{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#D4A853;margin-bottom:6px;font-family:system-ui}
.card-hdr h2{font-size:19px;font-weight:700;margin-bottom:8px;line-height:1.3}
.card-hdr p{font-size:13px;color:rgba(255,255,255,.85);line-height:1.7;font-family:system-ui}
.body{padding:20px 24px 26px}
.feat{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.feat-icon{width:36px;height:36px;border-radius:10px;background:#F5F0FF;border:1px solid #E0D0F5;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;margin-top:1px}
.feat-text{font-size:13px;color:#1E2E28;font-family:system-ui;line-height:1.6}
.feat-text strong{color:#2A1A3E}
.tip{background:linear-gradient(135deg,#FFF8EC,#FFF0D4);border-left:4px solid #D4A853;border-radius:10px;padding:13px 15px;font-size:13px;color:#1E2E28;line-height:1.7;font-family:system-ui;margin:14px 0}
.erwischt{background:linear-gradient(135deg,#F5F0FF,#E0D0F5);border-left:4px solid #6B3FA0;border-radius:10px;padding:13px 15px;font-size:13px;color:#1E2E28;line-height:1.7;font-family:system-ui;margin:14px 0}
.btn-p{background:linear-gradient(135deg,#2A1A3E,#6B3FA0);color:white;border:none;border-radius:10px;padding:13px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;width:100%}
.btn-p:disabled{background:#C4A8E0;cursor:not-allowed}
.btn-g{background:linear-gradient(135deg,#C4923A,#D4A853);color:white;border:none;border-radius:10px;padding:13px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;width:100%}
.btn-o{background:transparent;border:1.5px solid #2A1A3E;color:#2A1A3E;border-radius:10px;padding:12px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-lnk{background:none;border:none;color:#7D6352;font-size:12px;cursor:pointer;text-decoration:underline;font-family:inherit;padding:8px 0 0;display:block}
.btn-row{display:flex;gap:10px;margin-top:14px}
.btn-row .btn-p,.btn-row .btn-g{flex:1}
.prog-meta{display:flex;justify-content:space-between;font-size:11px;color:#7D6352;font-family:system-ui;margin-bottom:6px}
.prog-track{background:#E0D0F5;border-radius:999px;height:6px;overflow:hidden;margin-bottom:8px}
.prog-fill{height:100%;background:linear-gradient(90deg,#2A1A3E,#D4A853);border-radius:999px}
.dots{display:flex;gap:6px;margin-bottom:20px}
.dot{flex:1;height:4px;border-radius:999px}
.q-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#6B3FA0;font-family:system-ui;margin-bottom:4px}
.q-title{font-size:18px;font-weight:700;color:#2A1A3E;margin-bottom:8px;line-height:1.35}
.q-hint{font-size:13px;color:#7D6352;font-style:italic;font-family:system-ui;line-height:1.6}
.idk{font-size:12px;color:#7D6352;font-family:system-ui;line-height:1.6;margin:6px 0 12px;font-style:italic}
textarea{width:100%;font-family:Georgia,serif;font-size:14px;color:#1E2E28;background:#F5F0FF;border:1.5px solid #C4A8E0;border-radius:10px;padding:11px 13px;outline:none;resize:vertical;line-height:1.65;margin:12px 0 0;display:block}
textarea:focus{border-color:#6B3FA0}
.rbox{background:linear-gradient(135deg,#F5F0FF,#E0D0F5);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.rs-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.rs-txt{font-size:14px;color:#1E2E28;line-height:1.8}
.copy-hint{font-size:11px;color:#7D6352;font-family:system-ui;margin:10px 0 4px}
.copy-field{width:100%;background:white;border:1.5px solid #6B3FA0;border-radius:8px;padding:9px 11px;font-size:13px;color:#1E2E28;font-family:inherit;line-height:1.7;resize:none;outline:none;cursor:text;display:block}
.spin-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:40px 0}
.spin{width:36px;height:36px;border:3px solid #E0D0F5;border-top-color:#6B3FA0;border-radius:50%;animation:spin .8s linear infinite}
.err{background:#fff0f0;border-left:4px solid #cc4444;border-radius:10px;padding:14px 16px;font-size:13px;color:#7a2222;font-family:system-ui}
.badge-5f{display:inline-block;background:#2A1A3E;color:#D4A853;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;font-family:system-ui;letter-spacing:1px;text-transform:uppercase;margin-bottom:12px}
.weg-box{background:linear-gradient(135deg,#2A1A3E,#6B3FA0);border-radius:14px;padding:18px 20px;margin-bottom:14px;color:white}
.weg-box .wt{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#D4A853;margin-bottom:6px;font-family:system-ui}
.weg-box .wt-text{font-size:15px;line-height:1.8;color:rgba(255,255,255,.95)}
.bridge-box{background:#F5F0FF;border-radius:12px;padding:14px 16px;margin-bottom:14px;font-size:13px;color:#7D6352;line-height:1.7;font-family:system-ui;border-left:4px solid #D4A853}
.footer{margin-top:18px;font-size:11px;color:rgba(196,168,224,.4);font-family:system-ui}
</style>
</head>
<body>
<div class="hdr">
  <div class="ey">Die unsichtbaren Fäden</div>
  <h1>Warum es DIE Methode nicht gibt –<br>und was zu dir und deinem Hund passt</h1>
  <div class="sub">7-Felder-Modell · Methodik</div>
</div>
<div class="card" id="card"></div>
<div class="footer">🐾 Susanne Zischgl · Die unsichtbaren Fäden zwischen Mensch und Hund</div>

<script>
var QS = [
  {
    lbl: "Deine bisherigen Versuche",
    q: "Welche Trainingsansaetze oder Methoden hast du bisher ausprobiert – und wie haben sie sich angefuehlt?",
    hint: "Nicht ob sie funktioniert haben oder nicht. Sondern wie sie sich fuer dich gefuehlt haben. Stimmig? Fremd? Erzwungen? Leicht?",
    ph: "z. B. Ich habe Clickertraining ausprobiert, das fuehlte sich gut an aber ich war zu inkonsistent. Dominanztraining hat sich falsch angefuehlt..."
  },
  {
    lbl: "Struktur oder Freiheit",
    q: "Brauchst du eher klare Struktur und feste Regeln – oder eher Freiheit und Flexibilitaet?",
    hint: "Nicht was du fuer besser haeltst – sondern womit du selbst besser funktionierst. Im Beruf, im Alltag, generell.",
    ph: "z. B. Ich brauche eigentlich Struktur, aber zu viele Regeln fuehlen sich einengend an. Ich mag klare Rahmen mit Spielraum..."
  },
  {
    lbl: "Fuehren oder begleiten",
    q: "Bist du eher jemand der fuehrt und klare Ansagen macht – oder jemand der begleitet und eher mitgeht?",
    hint: "Weder ist falsch. Aber dein Hund braucht Klarheit darueber, wer du bist. Nicht wer du sein moechtest.",
    ph: "z. B. Ich glaube ich bin eher ein Begleiter. Klare Ansagen fallen mir schwer, ich moechte nicht hart wirken..."
  },
  {
    lbl: "Dein Hund und Methoden",
    q: "Wie reagiert dein Hund auf verschiedene Trainingsansaetze – was scheint bei ihm zu wirken, was nicht?",
    hint: "Nicht was die Theorie sagt. Sondern was du direkt beobachtest. Dein Hund ist der ehrlichste Spiegel.",
    ph: "z. B. Er reagiert gut auf Lob, aber bei Korrekturen zieht er sich sofort zurueck und wird unsicher..."
  },
  {
    lbl: "Was stimmig waere",
    q: "Wenn du dir einen Weg mit deinem Hund vorstellst, der sich fuer euch beide richtig anfuehlt – wie sieht der aus?",
    hint: "Kein Trainingskonzept. Sondern ein Gefuehl. Wie moechte es sich anfuehlen, wenn du mit deinem Hund zusammen bist und alles stimmt?",
    ph: "z. B. Ich moechte, dass er auf mich schaut weil er mir vertraut – nicht weil er Angst hat. Und ich moechte mich sicher fuehlen in dem was ich tue..."
  }
];

var ANS = ["","","","",""];
var STEP = 0;
var RES = "";

function $(id){return document.getElementById(id);}

function showWelcome(){
  $("card").innerHTML =
    '<div class="card-hdr">'+
    '<div class="e">Methodik</div>'+
    '<h2>Erwischt. Du suchst noch<br>die richtige Methode.</h2>'+
    '<p>Du hast deinen Stress erkannt, deine Muster gesehen, deinen inneren Hebel gefunden, deine Bindung gespuert und begonnen anders zu handeln. Und jetzt fragst du dich: Welche Methode ist jetzt die richtige?</p>'+
    '</div>'+
    '<div class="body">'+
    '<div class="badge-5f">7-Felder-Modell</div>'+

    '<div class="erwischt">'+
    '<p style="font-size:13px;color:#1E2E28;font-family:system-ui;line-height:1.75;margin-bottom:10px">Das ist der groesste Denkfehler, den die meisten machen: Sie suchen die richtige Methode – ohne sich selbst verstanden zu haben.</p>'+
    '<p style="font-size:13px;color:#1E2E28;font-family:system-ui;line-height:1.75;margin-bottom:10px">Jetzt drehst du das um.</p>'+
    '<p style="font-size:13px;color:#2A1A3E;font-family:system-ui;line-height:1.75;font-weight:700">Methoden sind nicht falsch. Aber sie wirken nur, wenn sie zum Menschen – und zum Hund – passen.</p>'+
    '</div>'+

    '<div class="feat"><div class="feat-icon">&#128247;</div><div class="feat-text"><strong>Warum du bisher gescheitert bist</strong> – nicht wegen der falschen Methode, sondern weil die Methode nicht zu dir gepasst hat.</div></div>'+
    '<div class="feat"><div class="feat-icon">&#9878;&#65039;</div><div class="feat-text"><strong>Was wirklich zu dir passt</strong> – Struktur oder Freiheit, Fuehren oder Begleiten, Klarheit oder Sanftheit.</div></div>'+
    '<div class="feat"><div class="feat-icon">&#128062;</div><div class="feat-text"><strong>Was dein Hund braucht</strong> – keine perfekte Methode, sondern eine die durch dich klar wird.</div></div>'+
    '<div class="feat"><div class="feat-icon">&#128336;</div><div class="feat-text"><strong>Dein stimmiger Weg</strong> – nicht was die Hundeschule empfiehlt, sondern was fuer euch beide funktioniert.</div></div>'+

    '<div class="tip"><strong style="color:#D4A853">Der Satz, der sitzt:</strong> „Dein Hund braucht keine perfekte Methode. Er braucht eine Methode, die durch dich klar wird." Antworte ehrlich – und schreib <strong>Ich weiss es nicht</strong> wenn du unsicher bist.</div>'+
    '<button class="btn-p" onclick="showQ(1)">&#128247; Meinen stimmigen Weg finden</button>'+
    '</div>';
}

function showQ(n){
  STEP = n;
  var q = QS[n-1];
  var pct = Math.round((n/5)*100);
  var dots = "";
  for(var i=0;i<5;i++){
    var c = i<n-1?"#6B3FA0":i===n-1?"#2A1A3E":"#E0D0F5";
    dots += '<div class="dot" style="background:'+c+'"></div>';
  }
  var back = n>1?'<button class="btn-o" onclick="goBack()">&#8592; Zurueck</button>':'';
  var nextCls = n===5?"btn-g":"btn-p";
  var nextLbl = n===5?"&#128247; Meinen Weg zeigen":"Weiter &#8594;";
  $("card").innerHTML =
    '<div class="body">'+
    '<div class="prog-meta"><span>Frage '+n+' von 5</span><span>'+pct+'%</span></div>'+
    '<div class="prog-track"><div class="prog-fill" style="width:'+pct+'%"></div></div>'+
    '<div class="dots">'+dots+'</div>'+
    '<div class="q-label">'+q.lbl+'</div>'+
    '<div class="q-title">'+q.q+'</div>'+
    '<div class="q-hint">'+q.hint+'</div>'+
    '<textarea id="ta" rows="4" placeholder="'+q.ph+'" oninput="chk()">'+(ANS[n-1]||'')+'</textarea>'+
    '<p class="idk">&#128161; Du kannst auch schreiben: <strong>Ich weiss es nicht</strong> – das ist eine vollwertige Antwort.</p>'+
    '<div class="btn-row">'+back+'<button class="'+nextCls+'" id="nbtn" onclick="goNext()">'+nextLbl+'</button></div>'+
    '<button class="btn-lnk" onclick="reset()">&#8635; Von vorne starten</button>'+
    '</div>';
  chk();
}

function chk(){
  var ta=$("ta"), btn=$("nbtn");
  if(ta&&btn) btn.disabled = !ta.value.trim();
}

function goNext(){
  var ta=$("ta");
  if(!ta||!ta.value.trim()) return;
  ANS[STEP-1]=ta.value.trim();
  if(STEP<5){showQ(STEP+1);}
  else{generate();}
}

function goBack(){
  var ta=$("ta");
  if(ta) ANS[STEP-1]=ta.value.trim();
  showQ(STEP-1);
}

function showLoading(){
  $("card").innerHTML='<div class="body"><div class="spin-wrap"><div class="spin"></div><p style="font-size:14px;color:#7D6352;font-family:system-ui;font-style:italic">Susanne findet deinen stimmigen Weg...</p></div></div>';
}

function generate(){
  showLoading();
  var msg="";
  var labels=["Bisherige Trainingsansaetze und wie sie sich anfuehlten","Beduerfnis nach Struktur oder Freiheit","Tendenz zu Fuehren oder Begleiten","Reaktion des Hundes auf verschiedene Ansaetze","Wie ein stimmiger Weg sich anfuehlen wuerde"];
  for(var i=0;i<5;i++) msg+=labels[i]+": "+(ANS[i]||"keine Angabe")+"\n";

  var sys="Du bist Susanne, erfahrene Hundetrainerin, Physiotherapeutin und systemische Coach mit ueber 30 Jahren Erfahrung. Du arbeitest mit dem 7-Felder-Modell der Mensch-Hund-Dynamik.\n\nFeld 6 ist die Methodik: Hier geht es nicht um eine bestimmte Trainingsmethode, sondern darum, herauszufinden welcher Ansatz wirklich zum Menschen und zum Hund passt. Der Schluesselgedanke: Methoden wirken nicht an sich – sie wirken nur, wenn sie durch den Menschen klar werden. Eine Methode die sich fremd anfuehlt, wird nie konsequent umgesetzt. Eine Methode die stimmig ist, wird lebendig.\n\nDu schreibst klar, ermutigend, direkt und ohne Floskeln. Kein Lob, keine falschen Versprechen. Du zeigst dem Menschen ehrlich, welcher Weg zu ihm passt – und warum er bisher vielleicht nicht gefunden hat was er gesucht hat.\n\nBasierend auf den fuenf Antworten schreibst du fuenf Abschnitte mit diesen exakten Ueberschriften:\n\nWarum bisherige Ansaetze nicht gepasst haben:\n[2-3 Saetze: Nicht als Kritik – sondern als ehrliche Erklaerung. Was hat nicht gestimmt und warum? Lag es an der Methode oder an der Passung zum Menschen?]\n\nDein Profil als Hundehalter:\n[3-4 Saetze: Wie ist dieser Mensch? Fuehrt er oder begleitet er? Braucht er Struktur oder Freiheit? Was sind seine Staerken und wo liegt seine Herausforderung im Umgang mit dem Hund?]\n\nWas zu dir und deinem Hund passt:\n[3-4 Saetze: Benenne klar welche Art von Ansatz stimmig waere. Nicht eine spezifische Trainingsmethode beim Namen nennen – sondern beschreiben wie der Ansatz sein soll: z.B. klar und beziehungsbasiert, sanft und strukturiert, konsequent und warm.]\n\nDein stimmiger Weg:\n[2-3 Saetze als konkreten Leitsatz oder Bild: Wie sieht dieser Weg aus? Was ist der Kern? Formuliere es so dass der Mensch es mitnehmen und festhalten kann.]\n\nDein naechster Schritt:\n[1-2 Saetze: Eine einzige konkrete Handlung – nicht Theorie, sondern etwas das dieser Mensch morgen tun kann.]\n\nKein Markdown. Deutsch, du-Ansprache.";

  fetch("https://tierakademie-proxy.tierakademie.workers.dev",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":"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","anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({
      model:"claude-sonnet-4-20250514",
      max_tokens:1100,
      system:sys,
      messages:[{role:"user",content:"Hier sind die fuenf Antworten:\n\n"+msg}]
    })
  })
  .then(function(r){if(!r.ok)throw new Error("Fehler "+r.status);return r.json();})
  .then(function(d){
    if(d.error)throw new Error(d.error.message);
    RES=d.content&&d.content[0]?d.content[0].text:"";
    showResult();
  })
  .catch(function(e){
    $("card").innerHTML='<div class="body"><div class="err">&#9888; '+e.message+'<br><button class="btn-p" style="margin-top:12px;width:auto;padding:9px 16px" onclick="generate()">&#8635; Nochmal versuchen</button></div></div>';
  });
}

function showResult(){
  var secs=[
    {key:"warum bisherige",lbl:"&#128247; Warum bisherige Ansaetze nicht gepasst haben",col:"#2A1A3E",copy:false,weg:false},
    {key:"dein profil",lbl:"&#9878;&#65039; Dein Profil als Hundehalter",col:"#6B3FA0",copy:false,weg:false},
    {key:"was zu dir",lbl:"&#128062; Was zu dir und deinem Hund passt",col:"#8B5E3C",copy:false,weg:false},
    {key:"dein stimmiger weg",lbl:"&#127811; Dein stimmiger Weg",col:"#D4A853",copy:true,weg:true},
    {key:"dein naechster schritt",lbl:"&#128336; Dein naechster Schritt",col:"#4A7C6F",copy:true,weg:false}
  ];
  var parsed=[],cur=null;
  var lines=RES.split("\n");
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim(),low=line.toLowerCase();
    var found=false;
    for(var j=0;j<secs.length;j++){
      if(low.indexOf(secs[j].key)!==-1){
        if(cur)parsed.push(cur);
        cur={lbl:secs[j].lbl,col:secs[j].col,copy:secs[j].copy,weg:secs[j].weg,txt:""};
        found=true;break;
      }
    }
    if(!found&&cur&&line) cur.txt+=(cur.txt?"\n":"")+line;
  }
  if(cur)parsed.push(cur);
  if(!parsed.length)parsed=[{lbl:"&#127811; Dein stimmiger Weg",col:"#D4A853",copy:true,weg:true,txt:RES}];

  var html='<div class="body">'+
    '<div class="badge-5f">7-Felder-Modell</div>'+
    '<p style="font-size:16px;font-weight:700;color:#2A1A3E;margin-bottom:4px">Dein stimmiger Weg &#127811;</p>'+
    '<p style="font-size:13px;color:#7D6352;font-family:system-ui;margin-bottom:16px;line-height:1.65">Lies es als Einladung – nicht als Vorschrift. Du wirst erkennen, was schon immer in dir gewusst hat.</p>';

  for(var k=0;k<parsed.length;k++){
    var s=parsed[k];
    if(s.weg){
      html+='<div class="weg-box">'+
        '<div class="wt">'+s.lbl.replace("&#127811; ","")+'</div>'+
        '<div class="wt-text">'+s.txt.replace(/\n/g,"<br>")+'</div>'+
        '<p class="copy-hint" style="color:rgba(255,255,255,.6)">&#128070; Klick ins Feld &#8594; alles markiert &#8594; Strg+C</p>'+
        '<textarea class="copy-field" readonly rows="'+Math.max(3,s.txt.split("\n").length+1)+'" onclick="this.select()" style="background:rgba(255,255,255,.12);border-color:rgba(212,168,83,.5);color:white">'+s.txt+'</textarea>'+
        '</div>';
    } else {
      var cp=s.copy?
        '<p class="copy-hint">&#128070; Klick ins Feld &#8594; alles markiert &#8594; Strg+C</p>'+
        '<textarea class="copy-field" readonly rows="3" onclick="this.select()">'+s.txt+'</textarea>':'';
      html+='<div class="rbox" style="border-left:4px solid '+s.col+'">'+
        '<div class="rs-lbl" style="color:'+s.col+'">'+s.lbl+'</div>'+
        '<div class="rs-txt">'+s.txt.replace(/\n/g,"<br>")+'</div>'+cp+'</div>';
    }
  }

  html+='<div class="bridge-box">'+
    '<strong style="color:#2A1A3E">Und jetzt das Grosse Ganze.</strong> In Feld 7 · Integration fliesst alles zusammen – dein Stressmuster, deine Beziehungsmuster, dein innerer Hebel, deine Bindung, dein Handeln und jetzt dein stimmiger Weg. Daraus entsteht dein neuer Zustand in der Beziehung zu deinem Hund.'+
    '</div>';

  html+='<button class="btn-p" onclick="reset()" style="margin-top:4px">&#8635; Nochmal von vorne</button>'+
    '</div>';
  $("card").innerHTML=html;
}

function reset(){ANS=["","","","",""];STEP=0;RES="";showWelcome();}

showWelcome();
</script>
</body>
</html>
