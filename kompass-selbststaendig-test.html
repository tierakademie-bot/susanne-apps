<script>
var CATS=["Automatisch passenden Kanal wählen","Instagram","Facebook","LinkedIn","TikTok","YouTube","Pinterest","Google-Unternehmensprofil","Website / Angebotsseite","Flyer / Plakat","Kooperationen","E-Mail / Newsletter","Skool Community (Austausch)","Skool Classroom (Lernen)"];
var ANIMALS=[];
var PROFESSIONS=["Business- oder Karrierecoaching", "Mentaltraining / Persönlichkeitscoaching", "Beziehungs- oder Familiencoaching", "Unternehmens- oder Organisationsberatung", "Finanz-, Steuer- oder Rechtsberatung", "Gesundheitscoaching / Ernährungsberatung", "Therapie / Heilpraxis / Physiotherapie", "Fitness-, Bewegungs- oder Yogatraining", "Energetische oder spirituelle Begleitung", "Training, Seminare und Workshops", "Online-Kurse und Mitgliedschaften", "Aus- und Weiterbildung anbieten", "Kreative Dienstleistung (Design, Foto, Text)", "Arbeit mit Tieren und Tierhaltern", "Produkte oder Waren verkaufen", "Andere Tätigkeit"];
var SYS="Du bist Susanne, erfahrene Business-Coachin fuer Selbstständige, die Beratung, Training oder Begleitung verkaufen. Du arbeitest mit dem Business-Kompass (5 Bereiche: 1.Beziehung zu Kundinnen und Kunden 2.Businessstruktur 3.Mentale Muster 4.Wert&Geld 5.Positionierung). Warm, klar, respektvoll und ohne Floskeln. Deutsch, du-Ansprache. Richte Sprache, Kundensituationen und Beispiele konsequent am angegebenen Beruf und Schwerpunkt aus. Wenn keine Zielgruppe genannt ist, bleibe allgemein. Grundsatz: Posten allein ist noch kein Sichtbarkeitssystem. Prüfe zuerst Beruf, Angebot, Kundensituation, Sichtbarkeitswege, vorhandene Inhalte und Kaufweg, bevor du Content empfiehlst.";
var GUARDRAILS="VERBINDLICHE QUALITAETSREGELN: Nutze ausschließlich Angaben, die die Person tatsächlich gemacht hat. Erfinde keine Qualifikation, Zertifizierung, Spezialisierung, Kundenerfahrung, Erfolgsgeschichte, Preise, Gratisangebote, Vorträge, Rabatte, Verfügbarkeiten oder Fallbeispiele. Fehlende Angaben erscheinen als [Platzhalter] oder Rückfrage. Beachte Regional/Online strikt. Erstelle nur die verlangte Anzahl an Maßnahmen. Keine willkürlichen Postingzeiten oder Antwortfristen. Bei kleinen Datenmengen wie ein oder zwei Anfragen niemals von guter Quote oder zusammengebrochener Conversion sprechen; nur als vorläufigen Hinweis formulieren. Aus null Gesprächen nicht schließen, dass die Person nicht geantwortet hat. Keine Rückmeldung bedeutet nicht automatisch fehlendes Interesse. Keine garantierten Ergebnisse wie 'mindestens eine Person wird buchen'. Keine Kaltakquise. Eine freiwillige, freundliche Nachfrage ist nur für bekannte Personen erlaubt, mit denen nachweislich bereits ein Gespräch geführt wurde, und nur wenn die Zahlen Gespräche ohne Verkauf zeigen. Keine abwertenden Formulierungen. Keine unbelegten medizinischen, therapeutischen oder ernährungsbezogenen Diagnose-, Heilungs-, Wirkungs- oder Kostenversprechen. Bei gesundheitlichen Beschwerden ärztliche Abklärung nennen und Fachgrenzen respektieren. Beratung oder Coaching nie als Ersatz für ärztliche Diagnostik oder Therapie darstellen. Nutze im Diagnoseziel vier Wochen, aber im konkreten Aktionsplan ausschließlich sieben Tage und vermische die Zeiträume nicht. Schreibe in verständlichem, natürlichem Alltagsdeutsch ohne unklare Redewendungen und ohne Fachwort Conversion; sage stattdessen Übergang von Anfrage zu Buchung. Bewerte das Angebot der Person niemals als klar, gut oder schlüssig strukturiert, solange Leistungsumfang, Ablauf, Zielgruppe und Vergütungsmodell nicht aus den Angaben hervorgehen; fehlende Punkte gehören in die Unsicherheiten. Wenn alle Pflichtfragen beantwortet wurden, erstelle eine klare Arbeitsdiagnose. Sage nicht, die Datenmenge reiche nicht aus, nur weil die Werte aus vier Wochen klein sind. Formuliere bei kleinen Zahlen vorsichtig und ohne Erfolgsbehauptungen. Nur wenn Zahlen oder zentrale Angaben tatsächlich nicht gemessen, unbekannt oder nicht beantwortet sind, benenne diese konkrete Lücke. Zähle Personen nicht doppelt: Ist unklar, ob die Person aus einem Gespräch zu den genannten Anfragen gehört, behandle die Zahlen nicht als verschiedene Kontakte. Maßnahmen betreffen nur eigene Handlungen: eigene Zahlen festhalten, eigenen Antwortweg und das eigene Angebot aufschreiben, eigene Beiträge vorbereiten. Angaben, die fehlen oder 'weiß ich nicht' lauten, sind unbekannt und nicht 'nicht vorhanden': schreibe nie 'ohne Website', 'hat keine Website' oder 'gibt es nicht', sondern 'in deinen Angaben nicht genannt'. Erfinde kein Geschäftsmodell oder Angebotsdetail (zum Beispiel 'Online-Geschäftsmodell'), das nicht angegeben wurde. Sprich die Nutzerin durchgehend direkt mit du an und bezeichne sie nie als 'die Person' oder 'sie'; über Interessenten sagst du 'Interessent' oder 'anfragende Person'. Behaupte nie, eine Community allein sei nicht tragfähig; sage stattdessen, dass die Sichtbarkeit von einem Kanal abhängt und Menschen außerhalb dieses Kanals dich vielleicht nicht finden. Schreibe nur vollständige Sätze mit Großschreibung am Anfang, ohne Rohlabels wie 'nur ein kanal:', und prüfe Rechtschreibung und zusammengeschriebene Wörter. Setze Reaktionen, Anfragen und Verkäufe nie als Quote oder Verhältnis zueinander (zum Beispiel '1 Verkauf aus 4 Reaktionen') und sprich bei wenigen Verkäufen nicht von 'ersten Erfolgen'; nenne die Zahlen einzeln. Behaupte nicht, dass Kanäle (nicht) miteinander verbunden sind, wenn dazu nichts angegeben ist; sage 'in deinen Angaben nicht genannt'. Erfinde keine Beobachtungen über das Verhalten von Kunden (zum Beispiel 'der Kontakt endet mit der Telefonnummer'). Kurzfassung, Priorität und Plan nennen dieselbe nächste Aufgabe. Beschreibe nie selbst, was die Leistung inhaltlich bewirkt oder wie sie wirkt; stelle nur Fragen, was die Person über ihr Angebot aufschreiben soll, und nutze keine Beispielformulierungen, die Wirkung behaupten. Beachte die FACHGRENZEN-REGELN FÜR DIESEN BERUF in den Angaben ausnahmslos. Beschreibe bei Ernährung und Gesundheit nie, woran man eine Allergie, Unverträglichkeit oder Krankheit erkennt; nenne stattdessen, welche Angaben die Beratung benötigt und wann Beschwerden zuerst ärztlich abgeklärt werden sollten. Erfolgskriterien beschreiben nur eigene Handlungen und Dokumentation (zum Beispiel Nachrichten versendet, nächster Schritt klar erklärt, Antworten festgehalten), niemals Reaktionen oder Gespräche anderer Menschen. Empfiehl einen neuen Kanal nur, wenn die Person laut Angabe dafür offen ist, und nur aus den von ihr gewählten Kanälen. Empfiehl niemals, überall gleichzeitig aktiv zu sein. Ziel sind nicht möglichst viele Kanäle, sondern mehrere sinnvoll verbundene Wege, über die Menschen dich finden, verstehen, kennenlernen und buchen können. Nenne niemals ein Angebot, eine Qualifikation, einen Preis, ein Gratisangebot (zum Beispiel einen kostenlosen Check oder ein Erstgespräch) oder eine Zahl, die die Person nicht selbst angegeben hat; nutze dafür [Platzhalter]. Behaupte nichts Spekulatives über die Sichtbarkeit (zum Beispiel dass dich Menschen wahrscheinlich nicht finden); sage höchstens, was in deinen Angaben nicht genannt ist. Für Beiträge gilt eine einzige Anredeform für die Zielgruppe: Privatpersonen werden geduzt, Einrichtungen, Praxen und Firmen werden gesiezt; wechsle sie nie innerhalb eines Textes. Themenideen und Beitragsideen sind fertige Beitragstitel aus Kundensicht, die direkt als Überschrift taugen, keine Anweisungen an die Nutzerin (also nicht Erkläre, wie…, sondern zum Beispiel Was bei der ersten Stunde passiert). Sie beschreiben nie, woran man Symptome, Blockaden oder Beschwerden bei Menschen erkennt, und versprechen keine Wirkung; Ausnahme: Erlaubt es die Regel des Berufs ausdrücklich, gilt diese. Schritt-Titel haben keine eigene Nummerierung und kein Wort Schritt davor. Nutze einfache Wörter statt Kennzahlen-Deutsch: nicht Quote, Rate oder Conversion, sondern zum Beispiel wie viele Anfragen zu einer Buchung führen. Für Leistungen im Heilkunde-Umfeld nie Formulierungen wie was wirkt, wirksam oder hilft; sprich von Begleitung und Beobachtung. Vermeide in allen Texten Wirk- und Ergebnisformulierungen wie unterstützt die Genesung, schafft Klarheit, verschafft Sicherheit, hilft dir zu verstehen, Du weißt danach, Keine versteckten Kosten; beschreibe stattdessen, was ihr gemeinsam tut. Nenne auch als Möglichkeit keinen kostenlosen Einstieg (Checkliste, Gratisgespräch), wenn die Person ihn nicht genannt hat. Schreibe nie, was Kundinnen und Kunden allgemein denken, fühlen oder wissen (nicht Viele Selbstständige sind unsicher), und nie, dass jemand von einer Leistung profitiert. Ideentexte beginnen nie mit In diesem Beitrag stellst, teilst oder zeigst du; sie sprechen die Leserin an (In diesem Beitrag erfährst du). Behaupte nie, dass eine Zielgruppe eine andere Unterstützung braucht als andere, und vergleiche die Arbeit der Nutzerin nie mit anderen Ansätzen. Schreibe nie Quote, Sichtbarkeitssystem oder Redewendungen wie Schuss ins Dunkle, und behaupte nie, wie schnell die Nutzerin antwortet. Ein Beitrag im 7-Tage-Plan ist kurz (höchstens 150 Wörter). Schreibe Beitragsideen und Beitragstexte immer aus der Sicht der Nutzerin als Absenderin (ich, mit mir) für ihre Kundschaft; sie beschreiben nie, was die Nutzerin tun soll (nicht welche Fragen du stellst). Beweis-Ideen und Fallbeispiele nur dann inhaltlich ausformulieren, wenn die Nutzerin einen echten Fall genannt hat; sonst schreibe nur [Platzhalter: echtes Fallbeispiel einfügen] und beschreibe nie ein Ergebnis oder eine Veränderung bei Kundin oder Kunde. Schreibe nie, was Kundinnen und Kunden nach dem Termin oder Beitrag fühlen, wissen, merken oder haben (also nicht Du merkst schnell, Du hast Klarheit, Keine Überraschungen). Behaupte nichts über Gewohnheiten anderer Kundinnen und Kunden (nicht Darum beginnen viele Wiedereinsteiger mit…). Nenne nur Schritte und Wege (zum Beispiel Buchungsseite), die laut Angaben existieren; Einheiten, Dauer und Preise nur als [Platzhalter]. Bezeichne die Ausbildung nie als Person (nicht wer die Ausbildung ist). Erfinde keine persönlichen Aussagen der Nutzerin (nicht Genau das frage ich mich selbst), keine Aussagen darüber, was viele Kundinnen und Kunden dich fragen, und keine Methodendetails oder Ablaufschritte (zum Beispiel konkrete Übungen, Werkzeuge oder Methoden), die sie nicht genannt hat; beschreibe ihren Ablauf nur allgemein oder mit [Platzhalter]. Nenne kein Ziel oder Ergebnis wie dass Kundinnen oder Kunden sicherer werden oder Vertrauen bekommen. Werte keine anderen Wege wie Selbstlernen oder kurze Kurse ab. Titel beginnen nie mit Woran merkst du oder Woran erkennst du. Ideentitel sprechen die Leserin oder den Leser an, nicht die Nutzerin (nicht So arbeitest du bei…, sondern So arbeite ich bei…). Behaupte nie, welche Fragen dir Kundinnen und Kunden am häufigsten stellen oder was du am meisten hörst; schreibe stattdessen, welche Fragen hilfreich sein können. Gib Klartext ohne Markdownzeichen aus. Gliedere mit kurzen Überschriften und Leerzeilen. Beende jeden Text vollständig. Prüfe intern: Fakten erfunden? Reichweite passend? Stichprobe überinterpretiert? Fachgrenzen gewahrt? Zeitraum korrekt? Ton respektvoll? Text vollständig? Gib nur die korrigierte Endfassung aus.";
var KANALTXT="KANALROLLEN (Susannes Konzept, verbindlich bei Kanalempfehlung, Beitragsideen und Beiträgen): Jeder Kanal erfüllt eine andere Aufgabe; ein Beitrag wird nicht identisch auf allen Kanälen verteilt. Frage zuerst: Was soll der Beitrag erreichen und welcher Kanal passt dafür? Instagram = zeigen und neugierig machen (visuell, schneller Einstieg, Reels, Karussells, kurze Impulse, Alltagseinblicke; nicht für komplizierte Fachthemen). Facebook = erzählen und ins Gespräch kommen (Geschichten, längere Beiträge, Fragen an die Gruppe, Veranstaltungen, regionale Angebote; nicht nur Verkaufsbeiträge). LinkedIn = positionieren, wofür du fachlich und unternehmerisch stehst (Fachkompetenz, Haltung, Erfahrung, Preisgestaltung; besonders für Selbstständige, die mit Unternehmen arbeiten, Seminare, Vorträge oder Fortbildungen anbieten oder andere Fachleute erreichen). TikTok = schnell Aufmerksamkeit erzeugen (kurze Videos, Aha-Momente, Humor; nur wenn Video liegt und die Zielgruppe dort ist). YouTube = erklären und Vertrauen aufbauen (Tutorials, Fachvideos, Interviews, Fallbesprechungen; wird über Monate und Jahre gefunden). Pinterest = langfristig gefunden werden (Checklisten, Ratgeber, Infografiken, Blogartikel; suchorientiert, nicht für Diskussion). Skool Community = miteinander sprechen (Fragen, Austausch, Feedback, Umfragen; Mitglieder sollen miteinander sprechen, nicht nur Beiträge der Leitung lesen). Skool Classroom = strukturiert lernen (Kurse, Anleitungen, Videos, Checklisten, Vorlagen; Wissen gehört dauerhaft hierher statt als Fachpost in die Community). Niemand muss auf allen Plattformen sein: höchstens ein Hauptkanal für Sichtbarkeit, ein Kanal für Vertiefung oder Expertise und eventuell ein eigener Raum für Kunden oder Community. Entscheide Kanalempfehlungen anhand von vier Fragen: Wo ist die Zielgruppe? Welche Inhalte liegen der Person? Was ist das Ziel? Kann sie den Kanal langfristig bedienen? Die Fachgrenzen-Regeln dieses Berufs gelten auf jedem Kanal; Kanalbeispiele wie Vorher-Nachher-Beiträge, Anzeichen- oder Fehlerlisten und Erkennungsbeiträge zu Verhalten oder Gesundheit sind nur erlaubt, wenn die Fachgrenzen es zulassen.";

function repairJSON(s){
  var out="",inStr=false,esc=false,stack=[];
  for(var i=0;i<s.length;i++){
    var c=s.charAt(i);
    if(inStr){
      if(esc){out+=c;esc=false;continue;}
      if(c==="\\"){out+=c;esc=true;continue;}
      if(c==='"'){inStr=false;out+=c;continue;}
      if(c==="\n"||c==="\r"||c==="\t"){out+=" ";continue;}
      out+=c;continue;
    }
    if(c==='"'){inStr=true;out+=c;continue;}
    if(c==="{"||c==="[")stack.push(c);
    if(c==="}"||c==="]"){out=out.replace(/,\s*$/,"");stack.pop();}
    out+=c;
  }
  if(inStr)out+='"';
  out=out.replace(/,\s*$/,"");
  while(stack.length){out+=(stack.pop()==="{"?"}":"]");}
  return out;
}

function parseJSONResponse(text){

  var body=s.slice(start,end+1);
  try{return JSON.parse(body);}catch(e1){
    try{return JSON.parse(repairJSON(body));}catch(e2){throw new Error("Die Antwort konnte nicht gelesen werden.");}
  }
}

}

        '<span class="lbl">Wer hat angefragt?</span>'+sel("res-who",["Kundinnen und Kunden","Fachleute oder Kollegen","Beides","Weiß ich nicht"],a.who)+
        '<span class="lbl">Waren die Gespräche dieselben Personen wie die Anfragen?</span>'+sel("res-overlap",["Ja","Nein","Weiß ich nicht"],a.overlap)+

function selectedValues(name){return Array.prototype.slice.call(document.querySelectorAll('input[name="'+name+'"]:checked')).map(function(x){return x.value;});}
function selectedValue(name){var x=document.querySelector('input[name="'+name+'"]:checked');return x?x.value:"";}

function saveQuestion(i){
  var type=QUESTIONS[i].type,a;
  function v(id){var e=$(id);return e?e.value.trim():"";}
  if(type==="goal")a={choice:selectedValue("goal"),detail:v("goal-detail")};
  else if(type==="offer")a={offer:v("offer-name"),price:v("offer-price"),action:v("offer-action"),preisentstehung:v("offer-price-origin"),ablaufNachAnfrage:selectedValues("offer-process")};
  else if(type==="offerType")a={angebotsart:selectedValue("offer-type")};
  else if(type==="text")a=v("qa");
  else if(type==="channels"){a=selectedValues("channels");if(a.length>1)a=a.filter(function(x){return x!=="Bisher gar nicht";});}
  else if(type==="situation")a={items:selectedValues("situation").slice(0,3)};
  else if(type==="content"){var ci=selectedValues("content");if(ci.length>1)ci=ci.filter(function(x){return x!=="Kaum Content";});a={items:ci};}
  else if(type==="results")a={reactions:v("res-reactions"),inquiries:v("res-inquiries"),talks:v("res-talks"),sales:v("res-sales"),who:v("res-who"),unknown:!!($("res-unknown")&&$("res-unknown").checked),overlap:v("res-overlap"),kaufhindernisAuswahl:selectedValues("purchase-obstacle"),kaufhindernisNachfrage:v("res-last-message"),quelleAnfragen:selectedValues("inquiry-source")};
  else if(type==="path"){var pc=selectedValues("path"),NP=["Es gibt noch keinen klaren nächsten Schritt","Ich weiß es nicht"],real=pc.filter(function(x){return NP.indexOf(x)<0;});a={choices:real.length?real:pc,other:v("path-other")};}
  else if(type==="opennessSocial")a={offenheitSocialMedia:selectedValue("open-social")};
  else if(type==="opennessPage")a={offenheitEigeneSeite:selectedValue("open-page")};
  else if(type==="capacity")a={time:v("cap-time"),budget:v("cap-budget"),formats:selectedValues("formats")};
  dAnswers[i]=a;return validateAnswer(type,a);
}
function saveCurrentAnswer(){var err="";PAGES[dCurQ].forEach(function(i){var e=saveQuestion(i);if(e&&!err)err=e;});return err;}

function validateAnswer(type,a){
  if(type==="goal"&&!a.choice)return "Bitte wähle, was am besten passt.";
  if(type==="offer"&&!a.offer)return "Bitte beschreibe kurz dein Angebot – „noch nicht klar“ ist auch eine gültige Antwort.";
  if(type==="offerType"&&!a.angebotsart)return "Bitte wähle aus, was du verkaufst.";
  if(type==="text"&&!a)return "Bitte schreib ein paar Worte – „Ich weiß es nicht“ ist erlaubt.";
  if(type==="channels"&&!a.length)return "Bitte wähle mindestens eine Möglichkeit – „Bisher gar nicht“ ist auch möglich.";
  if(type==="content"&&!a.items.length)return "Bitte wähle mindestens eine Möglichkeit – „Kaum Content“ ist auch möglich.";
  if(type==="results"&&!a.unknown&&!a.reactions&&!a.inquiries&&!a.talks&&!a.sales)return "Bitte trage mindestens eine Zahl ein oder setze den Haken bei „noch nicht gemessen“.";
  if(type==="path"&&!a.choices.length)return "Bitte wähle mindestens eine Antwort – „Ich weiß es nicht“ ist möglich.";
  if(type==="opennessSocial"&&!a.offenheitSocialMedia)return "Bitte wähle eine Antwort – „Weiß ich nicht“ ist möglich.";
  if(type==="opennessPage"&&!a.offenheitEigeneSeite)return "Bitte wähle eine Antwort – „Weiß ich nicht“ ist möglich.";
  if(type==="capacity"&&(!a.time||!a.budget))return "Bitte wähle Zeit und Budget – „Weiß ich noch nicht“ ist möglich.";
  return "";
}

function saveAndGo(dir){
  var err=saveCurrentAnswer();if(dir>0&&err){$("qerror").textContent=err;return;}
  dCurQ+=dir;renderMain();window.scrollTo(0,0);
}

function answersSummary(){
  var summary="";
  for(var i=0;i<QUESTIONS.length;i++)summary+=QUESTIONS[i].title+"\nAntwort: "+answerText(i,dAnswers[i])+"\n\n";
  return summary;
}

function answerText(i,a){
  var t=QUESTIONS[i].type;
  if(!a)return "keine Angabe";
  if(Array.isArray(a))return a.join(", ")||"keine Angabe";
  if(typeof a==="string")return a||"keine Angabe";
  if(t==="goal")return a.choice+(a.detail?" – "+a.detail:"");
  if(t==="offer")return "Angebot: "+(a.offer||"nicht angegeben")+"; Preis: "+(a.price||"nicht angegeben")+"; Preisentstehung: "+(a.preisentstehung||"nicht angegeben")+"; nächster Schritt für Interessenten: "+(a.action||"nicht angegeben")+"; Ablauf nach Anfrage: "+((a.ablaufNachAnfrage&&a.ablaufNachAnfrage.length)?a.ablaufNachAnfrage.join("; "):"nicht angegeben");
  if(t==="offerType")return "Angebotsart: "+(a.angebotsart||"nicht angegeben");
  if(t==="situation"||t==="content")return (a.items&&a.items.length)?a.items.join("; "):"keine Angabe";
  if(t==="results"){
    if(a.unknown)return "bisher nicht gemessen";
    function n(x){return x||"nicht angegeben";}
    return "Reaktionen: "+n(a.reactions)+"; Anfragen: "+n(a.inquiries)+"; Gespräche: "+n(a.talks)+"; Verkäufe: "+n(a.sales)+"; Art der Anfragenden: "+n(a.who)+"; Gespräche waren dieselben Personen wie die Anfragen: "+n(a.overlap)+"; Kaufhindernisse: "+((a.kaufhindernisAuswahl&&a.kaufhindernisAuswahl.length)?a.kaufhindernisAuswahl.join("; "):"nicht angegeben")+"; zusätzlicher Eindruck zum Kaufhindernis: "+n(a.kaufhindernisNachfrage)+"; Quellen der Anfragen: "+((a.quelleAnfragen&&a.quelleAnfragen.length)?a.quelleAnfragen.join("; "):"nicht angegeben");
  }
  if(t==="path")return a.choices.join("; ")+(a.other?" – "+a.other:"");
  if(t==="opennessSocial")return "Offenheit für weiteren Social-Media-Kanal: "+(a.offenheitSocialMedia||"nicht angegeben");
  if(t==="opennessPage")return "Offenheit für eigene Angebotsseite: "+(a.offenheitEigeneSeite||"nicht angegeben");
  if(t==="capacity")return "Zeit: "+(a.time||"nicht angegeben")+"; Budget: "+(a.budget||"nicht angegeben")+"; mögliche Formate: "+((a.formats&&a.formats.length)?a.formats.join(", "):"nicht angegeben");
  return JSON.stringify(a);
}

function buildClarifications(){
  var items=[],offer=dAnswers[qIdx("offer")]||{},res=dAnswers[qIdx("results")]||{};
  if(!offer.action||offer.action==="Weiß ich noch nicht")items.push({q:qIdx("offer"),message:"Es ist noch nicht festgelegt, was ein interessierter Mensch als Nächstes tun soll."});
  if(num(res.inquiries)>0&&(!res.who||res.who==="Weiß ich nicht"))items.push({q:qIdx("results"),message:"Unklar, ob die Anfragen von potenziellen Kunden oder von Fachleuten kamen."});
  if(num(res.inquiries)>0&&num(res.talks)>0&&res.overlap!=="Ja"&&res.overlap!=="Nein")items.push({q:qIdx("results"),message:"Unklar, ob die Gespräche aus den genannten Anfragen entstanden sind oder zusätzliche Personen waren."});
  return items;
}

function evaluationLogic(){
  var r=dAnswers[qIdx("results")]||{};
  function givenNumber(value){var raw=String(value===undefined||value===null?"":value).trim();if(raw==="")return null;var parsed=Number(raw.replace(",","."));return isFinite(parsed)&&parsed>=0?parsed:null;}
  var inquiries=givenNumber(r.inquiries),talks=givenNumber(r.talks),sales=givenNumber(r.sales),reactions=givenNumber(r.reactions);
  var logic={kind:"open",inquiries:inquiries,talks:talks,sales:sales,reactions:reactions,small:inquiries!==null&&inquiries<10,text:[],conversionText:"",firstStep:{title:"Sichtbarkeit oder Kontakt stärken",action:"Mache einen kleinen, klaren nächsten Kontaktpunkt sichtbar.",goal:"Ein klarer Weg zur Anfrage ist sichtbar."}};
  if(r.unknown||sales===null){
    logic.kind="missing_sales";
    logic.text.push("Zu den Verkäufen fehlt noch eine Angabe, deshalb ist die Einschätzung vorläufig.");
    logic.firstStep={title:"Zahlen zu Verkäufen klären",action:"Notiere die Zahl der Verkäufe aus den letzten vier Wochen. Halte bei den bekannten Gesprächen kurz fest, was zuletzt gesagt oder geschrieben wurde.",goal:"Die Verkaufszahl und der Stand der Gespräche sind geklärt."};
    if(talks!==null&&talks>0)logic.firstStep.action+=" Falls es sich passend anfühlt, kannst du genau diesen bekannten Gesprächspersonen freiwillig schreiben: „Ich wollte kurz nachfragen, ob noch etwas offen ist. Wenn nicht, ist das völlig in Ordnung.“";
  } else if(talks!==null&&talks>0){
    logic.conversationToSale=sales/talks;
    var rate=Math.round(logic.conversationToSale*100);
    logic.conversionText="Von "+talks+" Gesprächen wurden "+sales+" zu Verkäufen ("+rate+" %).";
    if(logic.conversationToSale>=0.5){
      logic.kind="reach";
      logic.text.push("Der Weg zum Kauf funktioniert nach diesem ersten Bild. Es kommen noch zu wenige Anfragen.");
      logic.firstStep={title:"Sichtbarkeit und Kontakt erhöhen",action:"Veröffentliche einen kurzen, konkreten Hinweis, wie Interessierte dich erreichen können, und nenne den kleinen ersten Schritt.",goal:"Ein sichtbarer Kontaktpunkt bringt neue Anfragen näher."};
    } else {
      logic.kind="purchase_path";
      logic.text.push("Der Kaufweg vom Gespräch zum Verkauf ist der wichtigste nächste Prüfpunkt.");
      logic.firstStep={title:"Kaufweg verständlich machen",action:"Formuliere nach einem Gespräch einen kleinen, klaren nächsten Schritt mit Ablauf und Preisrahmen.",goal:"Interessierte wissen, wie es nach dem Gespräch weitergeht."};
      if(talks>sales)logic.firstStep.action+=" Falls es sich passend anfühlt, kannst du bekannten Gesprächspersonen freiwillig schreiben: „Ich wollte kurz nachfragen, ob noch etwas offen ist. Wenn nicht, ist das völlig in Ordnung.“";
    }
  } else if(inquiries!==null){logic.kind="no_talks_yet";logic.text.push("Es gibt noch keine Gesprächszahl, aus der sich der Übergang zum Verkauf berechnen lässt.");}
  if(logic.small)logic.text.push("Weniger als 10 Anfragen geben nur ein erstes Bild.");
  var sources=Array.isArray(r.quelleAnfragen)?r.quelleAnfragen.filter(Boolean):[];
  logic.sources=sources;
  if(sources.length)logic.text.push("Die meisten Anfragen kamen laut Angabe über: "+sources.join(", ")+". Das wird zuerst verstärkt.");
  if(reactions===0&&inquiries!==null&&inquiries>0)logic.text.push("Deine Anfragen kamen offenbar nicht über Beiträge.");
  if(reactions!==null&&inquiries!==null&&reactions>=10&&inquiries>0&&reactions/inquiries>=5)logic.text.push("Deine Beiträge werden gesehen, führen aber noch selten zu Anfragen. Plane einen klaren Hinweis, wie Menschen dich erreichen.");
  return logic;
}
function ownPageBlindSpot(){
  var ch=dAnswers[qIdx("channels")]||[],offer=dAnswers[qIdx("offer")]||{};
  var exists=ch.indexOf("Website oder Blog")>=0||ch.indexOf("Google-Unternehmensprofil")>=0||ch.indexOf("Angebotsseite (eigene Seite für ein Angebot)")>=0||offer.action==="Angebotsseite öffnen";
  if(exists)return null;
  var open=dAnswers[qIdx("opennessPage")]||{};
  return {open:open.offenheitEigeneSeite||"",required:open.offenheitEigeneSeite==="Nein"?"Kleine Alternative für Auffindbarkeit: prüfe einen knappen Google-Unternehmensprofil-Eintrag oder einen klaren Angebotsabschnitt an einem bestehenden Ort.":"Lege eine einfache eigene Angebotsseite oder einen Google-Unternehmensprofil-Eintrag mit Angebot, Preisrahmen und Kontaktweg an."};
}
function evaluationContract(logic){
  var c={diagnosis:"",keywords:[],firstStep:logic.firstStep,planKeywords:[],blindSpot:ownPageBlindSpot()};
  if(logic.kind==="missing_sales"){c.diagnosis="Zu den Verkäufen fehlt noch eine Angabe, deshalb ist die Einschätzung vorläufig.";c.keywords=["vorläufig"];c.planKeywords=["verkauf","zahl"];if(logic.talks!==null&&logic.talks>0)c.planKeywords.push("freiwillig");}
  else if(logic.kind==="reach"){c.diagnosis="Es kommen noch zu wenige Anfragen.";c.keywords=["anfragen"];c.planKeywords=["sichtbarkeit","kontakt"];}
  else if(logic.kind==="purchase_path"){c.diagnosis="Der Kaufweg vom Gespräch zum Verkauf ist der wichtigste nächste Prüfpunkt.";c.keywords=["kaufweg"];c.planKeywords=["kaufweg","nächsten schritt"];}
  else {c.diagnosis=logic.text[0]||"Die nächsten Schritte werden aus deinen Angaben abgeleitet.";c.keywords=["gespräch"];c.planKeywords=["sichtbarkeit","kontakt"];}
  if(c.blindSpot)c.planKeywords.push(c.blindSpot.open==="Nein"?"google":"angebot");
  return c;
}
function includesAny(text,words){text=String(text||"").toLowerCase();return words.some(function(w){return text.indexOf(String(w).toLowerCase())>=0;});}
function validateDiagnosisContract(d,contract){
  var text=[d&&d.central_problem,d&&d.summary,d&&d.bottleneck&&d.bottleneck.explanation,d&&d.rationale].join(" ");
  return includesAny(text,contract.keywords);
}
function validatePlanContract(p,contract){
  if(!p||!Array.isArray(p.steps)||p.steps.length!==3)return false;
  var first=[p.steps[0].title,p.steps[0].action,p.steps[0].goal].join(" ");
  if(contract.keywords.indexOf("vorläufig")>=0){
    if(!includesAny(first,["verkauf","zahl"])||!includesAny(first,["freiwillig","nachfrage"]))return false;
  } else if(contract.keywords.indexOf("anfragen")>=0){
    if(!includesAny(first,["sichtbarkeit","kontakt"]))return false;
  } else if(contract.keywords.indexOf("kaufweg")>=0){
    if(!includesAny(first,["kaufweg","nächsten schritt"]))return false;
  }
  var all=p.steps.map(function(s){return [s.title,s.action,s.goal].join(" ");}).join(" ");
  if(contract.blindSpot&&!includesAny(all,[contract.blindSpot.open==="Nein"?"google":"angebot","website","webseite","seite"]))return false;
  return true;
}
function applyEvaluationRules(d,logic,contract){
  d=d||{};d.evidence=Array.isArray(d.evidence)?d.evidence:[];d.uncertainties=Array.isArray(d.uncertainties)?d.uncertainties:[];
  d.central_problem=contract.diagnosis;
  if(logic.kind==="missing_sales"){d.confidence="niedrig";d.priority_type="klaerung";d.priority="Klär zuerst die Zahl der Verkäufe aus den letzten vier Wochen.";d.rationale="Ohne diese Angabe lässt sich der Übergang vom Gespräch zum Verkauf nicht berechnen.";d.bottleneck={type:"noch nicht sicher bestimmbar",explanation:contract.diagnosis};d.summary=contract.diagnosis+" Als Nächstes klärst du die Zahlen und den Stand der bekannten Gespräche.";d.uncertainties=addUnique(d.uncertainties,"Zu den Verkäufen fehlt noch eine Angabe.");}
  else if(logic.kind==="reach"){d.confidence=d.confidence||"mittel";d.priority_type="marketingkanal";d.priority="Erhöhe zuerst die Auffindbarkeit und Reichweite über sichtbare Kontaktpunkte.";d.rationale="Der Übergang vom Gespräch zum Verkauf wirkt nach diesem ersten Bild nicht als nächster Prüfpunkt.";d.bottleneck={type:"zu wenig reichweite",explanation:"Es kommen noch zu wenige Anfragen."};d.summary=(logic.conversionText?logic.conversionText+" ":"")+"Es kommen noch zu wenige Anfragen. Als Nächstes stärkst du Sichtbarkeit und Kontakt."; }
  else if(logic.kind==="purchase_path"){d.confidence=d.confidence||"mittel";d.priority_type="uebergang";d.priority="Mach den Kaufweg nach einem Gespräch klarer.";d.rationale=logic.text[0];d.bottleneck={type:"kein klarer kaufweg",explanation:contract.diagnosis};d.summary=logic.text[0]+" Als Nächstes machst du den Kaufweg verständlicher.";}
  if(logic.text.length)logic.text.forEach(function(t){d.evidence=addUnique(d.evidence,t);});
  d.topic_ideas=Array.isArray(d.topic_ideas)?d.topic_ideas.slice(0,3):[];
  d.evidence=withoutConversion(d.evidence,logic.conversionText);
  d.uncertainties=withoutConversion(d.uncertainties,logic.conversionText);
  d.rationale=removeConversion(d.rationale,logic.conversionText);
  if(d.bottleneck&&d.bottleneck.explanation)d.bottleneck.explanation=removeConversion(d.bottleneck.explanation,logic.conversionText);
  if(d.business_type_reason)d.business_type_reason=removeConversion(d.business_type_reason,logic.conversionText);
  var obstacle=((dAnswers[qIdx("results")]||{}).kaufhindernisAuswahl||[]).join(", ");
  if(obstacle){
    d.missing_info=(Array.isArray(d.missing_info)?d.missing_info:[]).filter(function(x){return !/kaufhindernis.*preis|eindruck.*preis/i.test(String(x));});
    d.uncertainties=(Array.isArray(d.uncertainties)?d.uncertainties:[]).filter(function(x){return !/kaufhindernis.*preis|eindruck.*preis/i.test(String(x));});

function renderHeilHinweis(){

einer Kammer oder rechtlich.</p></div></details><p style="color:#6B8A7E;font-size:12px;margin-top:6px">Das ist eine Orientierung und keine Rechtsberatung.</p>';

  var hits=violations(text);
  if(err)hits.unshift(err);
  [["Diagnose",dDiag],["Plan",dTask],["Maßnahme",dCont],["Ideen",cResult]].forEach(function(x){if(String(x[1]).indexOf("Fehler:")===0)hits.push(x[0]+" nicht erstellt: "+x[1]);});
  return {name:c[0],groups:activeGroups().map(function(k){return GROUP_NAMES[k];}).join(", "),hits:hits,text:text};
}
function runCase(c,cb){
  applyCase(c);startEvaluation();
  pollUntil(function(){
    if(clarifyMode){aiClarificationText="Keine weiteren Angaben möglich (Ich weiß es nicht).";clarifyMode=false;clarificationRounds=1;runStructuredDiagnosis();return false;}
    return dDiag&&(dDiag.indexOf("Fehler:")===0||dTask);
  },300000,function(){
    if(!dTask||dDiag.indexOf("Fehler:")===0){cb(caseResult(c,"Diagnose oder Plan nicht erstellt"));return;}
    genCont();
    pollUntil(function(){return dCont;},300000,function(){
      genContent();
      pollUntil(function(){return cResult;},300000,function(){cb(caseResult(c));});
    });
  });
}
function renderTestlauf(){
  var opts='<option value="">Alle 13 Berufe (dauert lange)</option>'+Object.keys(GROUP_NAMES).map(function(k){return '<option value="'+k+'">Nur Gruppe: '+GROUP_NAMES[k]+'</option>';}).join('')+'<option value="__multi">Kanal-Übertragung (Karrierecoaching, Instagram + Facebook)</option>';
  $("card").innerHTML='<div class="card-hdr"><div class="e">Nur für dich</div><h2>Testlauf</h2><p>Prüft Berufe mit Musterangaben gegen die Fachgrenzen-Regeln.</p></div><div class="body"><select id="tgroup">'+opts+'</select><button class="btn-p" onclick="startTest()" style="margin-top:12px">Testlauf starten</button><p class="field-help">Tipp: erst nur eine Gruppe testen. Die App wartet zwischen den Anfragen, damit dein KI-Zugang nicht überlastet wird.</p><div id="tprog" class="status"></div><div id="tout"></div></div>';
}
function startTest(){
  if(window.testRun)return;
  var g=$("tgroup").value;
  if(g==="__multi"){var mc=TESTCASES.filter(function(c){return /Karrierecoaching/.test(c[0]);})[0];window.testRun=true;$("tout").innerHTML="";$("tprog").textContent="Kanal-Übertragung läuft …";testResults=[];
    applyCase(mc);dAnswers[qIdx("channels")]=["Instagram","Facebook"];cTopic="Berufliche Neuorientierung: Was im Erstgespräch passiert";cMulti="";genMulti();
    pollUntil(function(){return cMulti;},300000,function(){window.testRun=false;testResults.push({name:"Kanal-Übertragung (Karrierecoaching)",groups:"Instagram + Facebook",hits:cMulti.indexOf("Fehler:")===0?["Fehler bei der Übertragung"]:violations(cMulti),text:cMulti});showTestReport(true);});
    return;}
  var cs=TESTCASES.filter(function(c){return (!g||GROUP_OF[c[0]]===g);}),i=0;testResults=[];window.testRun=true;
  $("tout").innerHTML="";
  (function next(){
    if(i>=cs.length){window.testRun=false;showTestReport(true);return;}
    $("tprog").textContent="Fall "+(i+1)+" von "+cs.length+": "+cs[i][0];
    try{
      runCase(cs[i],function(r){testResults.push(r);i++;showTestReport(false);setTimeout(next,4000);});
    }catch(e){testResults.push({name:cs[i][0],groups:"",hits:["Testfehler: "+e.message],text:""});i++;showTestReport(false);setTimeout(next,4000);}
  })();
}
function showTestReport(final){
  var bad=testResults.filter(function(r){return r.hits.length;}).length,rep="Testlauf: "+(testResults.length-bad)+" von "+testResults.length+" ohne Befund\n";
  testResults.forEach(function(r){rep+="\n"+(r.hits.length?"✗ ":"✓ ")+r.name+" ("+r.groups+")"+r.hits.map(function(h){return "\n   - "+h;}).join("");});
  $("tprog").textContent=(final?"Fertig: ":"Zwischenstand: ")+(testResults.length-bad)+" von "+testResults.length+" ohne Befund";
  $("tout").innerHTML='<p class="copy-hint">Ergebnis kopieren und an Claude schicken:</p><textarea class="copy-field" readonly rows="14" onclick="this.select()">'+esc(rep)+'</textarea>'+testResults.map(function(r){return '<details class="full"><summary>'+(r.hits.length?'✗ ':'✓ ')+esc(r.name)+'</summary><div class="rbox"><p>'+formatAI(r.text)+'</p></div></details>';}).join('');
}
