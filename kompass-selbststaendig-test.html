var KANALTXT="KANALROLLEN (Susannes Konzept, verbindlich bei Kanalempfehlung, Beitragsideen und Beiträgen): Jeder Kanal erfüllt eine andere Aufgabe; ein Beitrag wird nicht identisch auf allen Kanälen verteilt. Frage zuerst: Was soll der Beitrag erreichen und welcher Kanal passt dafür? Instagram = zeigen und neugierig machen (visuell, schneller Einstieg, Reels, Karussells, kurze Impulse, Alltagseinblicke; nicht für komplizierte Fachthemen). Facebook = erzählen und ins Gespräch kommen (Geschichten, längere Beiträge, Fragen an die Gruppe, Veranstaltungen, regionale Angebote; nicht nur Verkaufsbeiträge). LinkedIn = positionieren, wofür du fachlich und unternehmerisch stehst (Fachkompetenz, Haltung, Erfahrung, Preisgestaltung; besonders für Selbstständige, die mit Unternehmen arbeiten, Seminare, Vorträge oder Fortbildungen anbieten oder andere Fachleute erreichen). TikTok = schnell Aufmerksamkeit erzeugen (kurze Videos, Aha-Momente, Humor; nur wenn Video liegt und die Zielgruppe dort ist). YouTube = erklären und Vertrauen aufbauen (Tutorials, Fachvideos, Interviews, Fallbesprechungen; wird über Monate und Jahre gefunden). Pinterest = langfristig gefunden werden (Checklisten, Ratgeber, Infografiken, Blogartikel; suchorientiert, nicht für Diskussion). Skool Community = miteinander sprechen (Fragen, Austausch, Feedback, Umfragen; Mitglieder sollen miteinander sprechen, nicht nur Beiträge der Leitung lesen). Skool Classroom = strukturiert lernen (Kurse, Anleitungen, Videos, Checklisten, Vorlagen; Wissen gehört dauerhaft hierher statt als Fachpost in die Community). Niemand muss auf allen Plattformen sein: höchstens ein Hauptkanal für Sichtbarkeit, ein Kanal für Vertiefung oder Expertise und eventuell ein eigener Raum für Kunden oder Community. Entscheide Kanalempfehlungen anhand von vier Fragen: Wo ist die Zielgruppe? Welche Inhalte liegen der Person? Was ist das Ziel? Kann sie den Kanal langfristig bedienen? Die Fachgrenzen-Regeln dieses Berufs gelten auf jedem Kanal; Kanalbeispiele wie Vorher-Nachher-Beiträge, Anzeichen- oder Fehlerlisten und Erkennungsbeiträge zu Verhalten oder Gesundheit sind nur erlaubt, wenn die Fachgrenzen es zulassen.";

  var structure=decision.kind==="reply"?"Antworte auf eine Anfrage: Beginne mit 'Hallo [Name],'. Danach steht ein kurzer Dank, zum Beispiel 'Schön, dass du dich bei mir meldest, und danke für deine Nachricht.' Erst danach steht der kurze Hinweis, dass Beschwerden zuerst tierärztlich abgeklärt werden und die Beratung keine Diagnose oder Behandlung ersetzt. Danach folgen Angebot und Ablauf; zum Schluss ein klarer, freiwilliger nächster Schritt.":"Erstelle einen öffentlichen Beitrag: Beginne mit einem kurzen, nicht fragenden Einstieg, der das Anliegen der Zielgruppe aufgreift. Danach folgen Angebot und Ablauf. Erst danach steht der kurze Hinweis, dass Beschwerden zuerst tierärztlich abgeklärt werden und die Beratung keine Diagnose oder Behandlung ersetzt. Zum Schluss steht ein klarer nächster Schritt.";
  var prompt="Erstelle eine kurze, direkt nutzbare Marketing-Maßnahme als JSON. "+structure+" Beginne nie mit einer Frage. Nenne die Zielgruppe nur genau als '"+target+"'; verwende keine andere Geschlechtsform und ergänze keine Zielgruppe. Höchstens drei Platzhalter. Nur einen Call-to-Action. Der letzte Satz muss zu diesem ersten Schritt passen: '"+firstInterestStep()+"'. Bei individuellem Preis nie direkt zur Bestellung auffordern. Keine Diagnose, keine erfundenen Details. Verwende als Format '"+decision.format+"' und als Titel exakt '"+decision.title+"'. JSON: {\"measure_type\":\"uebergang|marketingkanal|bindung|angebotsklaerung|klaerung\",\"format\":\"antwortvorlage|beitrag\",\"title\":\"...\",\"content\":\"...\",\"adjust_notes\":[\"...\"]}.\n\n"+facts;
  callJSONChecked(SYS,prompt,function(c){
    if(c&&Array.isArray(c.content))c.content=c.content.join("\n");
    if(c){c.format=decision.format;c.title=decision.title;c=enforceMeasureContract(c);}
    if(!validMeasure(c)){
      if(!retry){generateStructuredMeasure(facts,contract,true);return;}
      dCont="Fehler: Die Maßnahme war unvollständig. Bitte erneut versuchen.";evaluationLoading.measure=false;renderMain();return;
    }
    measureData=c;dCont=measureText(c);evaluationLoading.measure=false;limitMissingPhrasesAcrossEvaluation();renderMain();
  },function(e){dCont="Fehler: "+e;evaluationLoading.measure=false;renderMain();});
}

function genContent(){
  if(!cTopic.trim()){alert("Bitte trage zuerst dein konkretes Angebot oder Thema ein.");return;}
  var btn=$("cgenbtn");if(btn)btn.disabled=true;
  cResult="";renderMain();
  var facts=profileContext()+"\nKanal/Maßnahme: "+cCat+"\nInhaltssäule: "+cPillar+"\nAngebot/Thema: "+cTopic;
  if(diagData)facts+="\n\nANGABEN AUS DEM KOMPASS:\n"+answersSummary()+"\nKOMPASS-DIAGNOSE:\n"+JSON.stringify(diagData);
  var prompt="Erstelle genau 3 konkrete Beitragsideen für genau diesen Beruf innerhalb genau eines passenden Kanals. Jede Idee gehört zu einer Inhaltssäule (erkennen, verstehen, vertrauen, beweis, angebot oder entscheiden). Ist die Säule automatisch gewählt und liegt ein content_mix vor, nimm die Säulen mit dem höchsten Anteil. KEINE ERFUNDENEN ERFAHRUNGEN: Schreibe nie, was die Anbieterin angeblich erlebt, hört, sieht oder gelernt hat, und erfinde keine persönlichen Geschichten, Gespräche oder Zitate von Kundinnen und Kunden. Formuliere stattdessen aus Sicht der Zielgruppe (Du-Ansprache) und setze für echte Erlebnisse einen Platzhalter. Verweise im Einstieg und in den Texten nie auf einen bestimmten vergangenen Termin, ein bestimmtes Tier, bestimmte Kundinnen oder Kunden oder deren Rückmeldungen ('dieser Termin', 'meine Kunden', 'was Kunden mir gesagt haben'); echte Beispiele stehen nur als Platzhalter im Feld beweis. Achte auf korrekte Grammatik und Rechtschreibung. Der Einstieg beginnt nie mit 'Das passiert', 'So läuft', 'Was passiert' oder 'So funktioniert'. Auch bei Ideen zu Angebot oder Ablauf ist der Einstieg eine Sorge oder Frage der Zielgruppe (als Sorge oder Frage, die genau zu diesem Beruf und Angebot passt, und nicht in jeder Idee dieselbe Formulierung wie bei anderen Berufen), nie nur 'Das erste Gespräch mit mir'. Sprich die Zielgruppe und die Anbieterin durchgehend mit du an, nie mit Sie oder Ihre, auch nicht im Feld measurement. Der Einstieg (title) ist ein konkreter Moment oder eine Frage aus dem Alltag der Zielgruppe, kein Themenname und keine Überschrift wie 'So funktioniert …' oder 'Was beim Erstgespräch passiert'. AUFBAU JEDER IDEE in sechs Bausteinen. (1) title ist der Einstieg (Musterunterbrechung): eine überraschende, emotional aufgeladene oder zielgruppenrelevante Überschrift, die das gewohnte Weiterscrollen unterbricht, zum Beispiel eine klare Frage oder ein mutiges Statement; nie reißerisch, ohne erfundene Zahlen oder Statistiken, ohne Wirkversprechen und ohne Abwertung anderer. hook_alternatives enthält zwei weitere Einstiegsvarianten, denn der Einstieg entscheidet, ob weitergelesen wird. (2) problem: das Problem der Zielgruppe konkret, alltagsnah und bildhaft in der Sprache der Zielgruppe, ein bis zwei Sätze; es folgt aus der Zielgruppen-Angabe der Nutzerin und behauptet nicht, was Kundschaft allgemein denkt, fühlt oder erlebt hat; nicht zu dramatisch. (3) wunsch: der Wunschzustand der Zielgruppe in Bildern und Gefühlen, als Wunsch formuliert (zum Beispiel Vielleicht wünschst du dir …) und nicht als Versprechen. (4) angebot: die Brücke vom Problem zum Wunsch: wofür das Angebot der Nutzerin gedacht ist und woran ihr gemeinsam arbeitet, nutzennah und ohne Fachsprache, ohne zu versprechen, was dabei herauskommt, und ohne Angebotsdetails zu erfinden. (5) beweis: nur ein echter Beweis aus den Angaben der Nutzerin; gibt es keinen, schreibe genau [Platzhalter: echte Kundenstimme oder echtes Beispiel einfügen]; erfinde nie Zahlen, Studien, Kundenstimmen oder Referenzen. (6) cta: genau eine einzige klare Handlung (nicht mehrere Möglichkeiten wie melde dich oder schreib mir), konkret und möglichst warm formuliert. Der cta passt zur Geschäftsart und nennt nur Wege, die laut Angaben existieren, zum Beispiel Termin ansehen, Erstgespräch vereinbaren, mehr über die Behandlung erfahren, Kurs ansehen, Platz reservieren, Angebot kennenlernen, Community beitreten, Nachricht senden oder Buchungsseite öffnen; nicht pauschal Jetzt kaufen. Bei automatischer Kanalwahl nimm nur einen Kanal, den die Person bereits nutzt oder für den sie offen ist. Keine Kaltakquise. Keine erfundenen Fakten, Fallbeispiele oder Ergebnisgarantien. Bei Gesundheitsthemen keine Diagnosen oder Heilversprechen, sondern Beobachtungen und den Hinweis auf ärztliche Abklärung. Alle sechs Felder sprechen die Leserin oder den Leser des Beitrags an, nie die Nutzerin der App (also nicht In diesem Beitrag erklärst du, sondern direkt: Du kennst das …). Setze nicht voraus, in welcher Lage die Leserin oder der Leser gerade ist (nicht Du bist gerade gekündigt worden). Keine Formulierungen wie unterstützt die Genesung, hilft, schafft Klarheit, verschafft Sicherheit, Keine versteckten Kosten oder Du weißt danach. Das Feld measurement nennt in einfachen Worten, was die Nutzerin selbst zählt (zum Beispiel wie viele Nachrichten nach dem Beitrag eingehen), ohne englische Fachbegriffe wie Saves, Shares oder Direct Messages. Wenn ein erforderlicher Link oder Preis fehlt, nutze [Platzhalter]. JSON-Schema exakt: {\"channel\":\"...\",\"ideas\":[{\"pillar\":\"...\",\"title\":\"...\",\"hook_alternatives\":[\"...\",\"...\"],\"problem\":\"...\",\"wunsch\":\"...\",\"angebot\":\"...\",\"beweis\":\"...\",\"cta\":\"...\",\"measurement\":\"...\"}]}.\n\n"+facts;
  callJSONChecked(SYS,prompt,function(r){
    if(!r||!Array.isArray(r.ideas)||r.ideas.length!==3){cResult="Fehler: Die Ideen waren unvollständig. Bitte erneut versuchen.";renderMain();return;}
    cResult="Gewählter Kanal: "+r.channel+r.ideas.map(function(x,i){var alt=Array.isArray(x.hook_alternatives)?x.hook_alternatives.filter(Boolean):[];return "\n\nIdee "+(i+1)+": "+x.title+(x.pillar?"\nSäule: "+x.pillar:"")+(alt.length?"\nWeitere Einstiege: "+alt.join(" | "):"")+(x.problem?"\nProblem: "+x.problem:"")+(x.wunsch?"\nWunschzustand: "+x.wunsch:"")+(x.angebot?"\nBrücke zu deinem Angebot: "+x.angebot:"")+(x.beweis?"\nBeweis: "+x.beweis:"")+(x.content?"\n"+x.content:"")+"\nNächster Schritt: "+x.cta+"\nMessung: "+x.measurement;}).join("");renderMain();
  },
    function(e){cResult="Fehler: "+e;renderMain();});
}

function pollUntil(fn,ms,done){var t0=Date.now();(function tick(){var r=fn();if(r||Date.now()-t0>ms){done(!!r);return;}setTimeout(tick,500);})();}
function caseResult(c,err){
  var text=[dDiag,dTask,dCont,measureData&&measureData.content?measureData.content:"",cResult].join("\n");
  var hits=violations(text);
  if(err)hits.unshift(err);
  [["Diagnose",dDiag],["Plan",dTask],["Maßnahme",dCont],["Ideen",cResult]].forEach(function(x){if(String(x[1]).indexOf("Fehler:")===0)hits.push(x[0]+" nicht erstellt: "+x[1]);});

}
function runCase(c,cb){

  },300000,function(){
    if(!dTask||dDiag.indexOf("Fehler:")===0){cb(caseResult(c,"Diagnose oder Plan nicht erstellt"));return;}
    genCont();
