<head>
<meta charset="UTF-8">

<style>
  :root {
    --forest: #2D4A35;
    --ochre:  #C4863A;
    --sand:   #E8D8B8;
    --moss:   #5A7A4A;
    --cream:  #F5F0E8;
    --teal:   #1D9E75;
    --teal-light: #E1F5EE;
    --purple: #534AB7;
    --purple-light: #EEEDFE;
    --gray:   #5F5E5A;
    --gray-light: #F1EFE8;
    --text:   #2C2C2A;
    --text-muted: #5F5E5A;
    --border: rgba(44,44,42,0.15);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --forest: #9FE1CB;
      --ochre:  #FAC775;
      --sand:   #444441;
      --moss:   #9FE1CB;
      --cream:  #2C2C2A;
      --teal:   #5DCAA5;
      --teal-light: #085041;
      --purple: #AFA9EC;
      --purple-light: #26215C;
      --gray:   #B4B2A9;
      --gray-light: #444441;
      --text:   #F1EFE8;
      --text-muted: #B4B2A9;
      --border: rgba(241,239,232,0.15);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--cream);
    color: var(--text);
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100vh;
  }

  header {
    background: var(--forest);
    color: #fff;
    padding: 20px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header h1 { font-size: 18px; font-weight: 400; letter-spacing: 0.02em; }
  header span { opacity: 0.6; font-size: 13px; }

  .layout {
    display: flex;
    gap: 0;
    min-height: calc(100vh - 64px);
  }

  .diagram-area {
    flex: 1;
    padding: 32px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .diagram-area h2 {
    font-size: 13px;
    font-weight: 400;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 20px;
  }

  svg { max-width: 680px; width: 100%; cursor: default; }

  .stage { cursor: pointer; }
  .stage rect { transition: opacity 0.15s; }
  .stage:hover rect { opacity: 0.82; }
  .stage.active rect { stroke-width: 2px !important; }

  .info-panel {
    width: 320px;
    background: var(--sand);
    border-left: 1px solid var(--border);
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .info-panel .hint {
    color: var(--text-muted);
    font-size: 13px;
    font-style: italic;
    margin-top: 48px;
    line-height: 1.6;
    text-align: center;
  }

  .info-panel h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .info-panel .stage-title {
    font-size: 20px;
    font-weight: 400;
    color: var(--text);
    margin-bottom: 4px;
    line-height: 1.3;
  }

  .info-panel .stage-price {
    font-size: 13px;
    color: var(--ochre);
    margin-bottom: 20px;
    font-family: Georgia, serif;
  }

  .info-panel .stage-desc {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text);
    margin-bottom: 20px;
  }

  .info-panel .questions-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .info-panel .question-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--cream);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    font-family: Georgia, serif;
    color: var(--text);
    cursor: pointer;
    margin-bottom: 8px;
    line-height: 1.5;
    transition: background 0.15s, border-color 0.15s;
  }
  .info-panel .question-btn:hover {
    background: #fff;
    border-color: var(--ochre);
  }

  .info-panel .open-claude {
    display: block;
    margin-top: 16px;
    padding: 10px 16px;
    background: var(--forest);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-family: Georgia, serif;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    transition: opacity 0.15s;
  }
  .info-panel .open-claude:hover { opacity: 0.85; }

  .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

  .legend {
    display: flex;
    gap: 16px;
    align-items: center;
    margin-top: 12px;
    font-size: 12px;
    color: var(--text-muted);
    font-family: Georgia, serif;
  }
  .legend-dot {
    width: 12px; height: 12px; border-radius: 3px; display: inline-block;
  }

  @media (max-width: 700px) {
    .layout { flex-direction: column; }
    .info-panel { width: 100%; border-left: none; border-top: 1px solid var(--border); }
  }
</style>
</head>

let activeId = null;

function showInfo(id) {
  if (activeId) {
    const prev = document.querySelector('.stage[data-id="'+activeId+'"]');
    if (prev) prev.classList.remove('active');
  }
  activeId = id;
  const el = document.querySelector('.stage[data-id="'+id+'"]');
  if (el) el.classList.add('active');

  const d = data[id];
  const panel = document.getElementById('info-panel');
  const prompt = encodeURIComponent(d.questions[0]);

  panel.innerHTML = `
    <h3>${d.sub}</h3>
    <div class="stage-title">${d.title}</div>
    <hr class="divider">
    <p class="stage-desc">${d.desc}</p>
    <div class="questions-label">Fragen für Claude</div>
    ${d.questions.map(q => `<button class="question-btn" onclick="copyQ(this,'${encodeURIComponent(q)}')">${q}</button>`).join('')}
    <a class="open-claude" href="https://claude.ai/new?q=${prompt}" target="_blank">In Claude öffnen ↗</a>
  `;
}

function copyQ(btn, encodedQ) {
  const q = decodeURIComponent(encodedQ);
  navigator.clipboard.writeText(q).then(() => {
    const orig = btn.textContent;
    btn.textContent = '✓ Kopiert';
    setTimeout(() => btn.textContent = orig, 1800);
  });
}
