<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dein Bindungsmuster · Die unsichtbaren Fäden</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Georgia, serif; background: linear-gradient(160deg, #1E3A2E 0%, #122318 40%, #0a160f 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 28px 16px 48px; }
@keyframes spin { to { transform: rotate(360deg); } }
::-webkit-scrollbar{width:5px} ::-webkit-scrollbar-thumb{background:#4A7C6F;border-radius:3px}
.hdr{text-align:center;margin-bottom:26px}
.ey{font-size:11px;color:#D4A853;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;font-family:system-ui}
.hdr h1{font-size:24px;font-weight:700;color:white;margin-bottom:4px;line-height:1.2}
.hdr .sub{font-size:13px;color:#8FAF9F;font-family:system-ui}
.card{width:100%;max-width:580px;background:white;border-radius:20px;overflow:hidden;box-shadow:0 20px 70px rgba(0,0,0,.4)}
.card-hdr{background:linear-gradient(135deg,#0D2B1E,#1E3A2E);padding:22px 24px 18px;color:white}
.card-hdr .e{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#D4A853;margin-bottom:6px;font-family:system-ui}
.card-hdr h2{font-size:19px;font-weight:700;margin-bottom:8px;line-height:1.3}
.card-hdr p{font-size:13px;color:rgba(255,255,255,.85);line-height:1.7;font-family:system-ui}
.body{padding:20px 24px 26px}
.feat{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.feat-icon{width:36px;height:36px;border-radius:10px;background:#F0F5F2;border:1px solid #D8EAE4;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;margin-top:1px}
.feat-text{font-size:13px;color:#1E2E28;font-family:system-ui;line-height:1.6}
.feat-text strong{color:#0D2B1E}
.tip{background:linear-gradient(135deg,#FFF8EC,#FFF0D4);border-left:4px solid #C4923A;border-radius:10px;padding:13px 15px;font-size:13px;color:#1E2E28;line-height:1.7;font-family:system-ui;margin:14px 0}
.hinweis{background:linear-gradient(135deg,#F0F5F2,#D8EAE4);border-left:4px solid #1E3A2E;border-radius:10px;padding:13px 15px;font-size:13px;color:#1E2E28;line-height:1.7;font-family:system-ui;margin:14px 0}
.btn-p{background:linear-gradient(135deg,#0D2B1E,#1E3A2E);color:white;border:none;border-radius:10px;padding:13px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;width:100%}
.btn-p:disabled{background:#8FAF9F;cursor:not-allowed}
.btn-g{background:linear-gradient(135deg,#C4923A,#D4A853);color:white;border:none;border-radius:10px;padding:13px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;width:100%}
.btn-o{background:transparent;border:1.5px solid #1E3A2E;color:#1E3A2E;border-radius:10px;padding:12px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-lnk{background:none;border:none;color:#6B8A7E;font-size:12px;cursor:pointer;text-decoration:underline;font-family:inherit;padding:8px 0 0;display:block}
.btn-row{display:flex;gap:10px;margin-top:14px}
.btn-row .btn-p,.btn-row .btn-g{flex:1}
.prog-meta{display:flex;justify-content:space-between;font-size:11px;color:#6B8A7E;font-family:system-ui;margin-bottom:6px}
.prog-track{background:#D8EAE4;border-radius:999px;height:6px;overflow:hidden;margin-bottom:8px}
.prog-fill{height:100%;background:linear-gradient(90deg,#0D2B1E,#4A7C6F);border-radius:999px}
.dots{display:flex;gap:6px;margin-bottom:20px}
.dot{flex:1;height:4px;border-radius:999px}
.q-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#4A7C6F;font-family:system-ui;margin-bottom:4px}
.q-title{font-size:18px;font-weight:700;color:#0D2B1E;margin-bottom:8px;line-height:1.35}
.q-hint{font-size:13px;color:#6B8A7E;font-style:italic;font-family:system-ui;line-height:1.6}
.idk{font-size:12px;color:#6B8A7E;font-family:system-ui;line-height:1.6;margin:6px 0 12px;font-style:italic}
textarea{width:100%;font-family:Georgia,serif;font-size:14px;color:#1E2E28;background:#F0F5F2;border:1.5px solid #8FAF9F;border-radius:10px;padding:11px 13px;outline:none;resize:vertical;line-height:1.65;margin:12px 0 0;display:block}
textarea:focus{border-color:#4A7C6F}
.rbox{background:linear-gradient(135deg,#F0F5F2,#D8EAE4);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.rs-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.rs-txt{font-size:14px;color:#1E2E28;line-height:1.8}
.copy-hint{font-size:11px;color:#6B8A7E;font-family:system-ui;margin:10px 0 4px}
.copy-field{width:100%;background:white;border:1.5px solid #4A7C6F;border-radius:8px;padding:9px 11px;font-size:13px;color:#1E2E28;font-family:inherit;line-height:1.7;resize:none;outline:none;cursor:text;display:block}
.spin-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:40px 0}
.spin{width:36px;height:36px;border:3px solid #D8EAE4;border-top-color:#4A7C6F;border-radius:50%;animation:spin .8s linear infinite}
.err{background:#fff0f0;border-left:4px solid #cc4444;border-radius:10px;padding:14px 16px;font-size:13px;color:#7a2222;font-family:system-ui}
.badge-5f{display:inline-block;background:#0D2B1E;color:#D4A853;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;font-family:system-ui;letter-spacing:1px;text-transform:uppercase;margin-bottom:12px}
.bridge-box{background:#F0F5F2;border-radius:12px;padding:14px 16px;margin-bottom:14px;font-size:13px;color:#6B8A7E;line-height:1.7;font-family:system-ui;border-left:4px solid #D4A853}
.footer{margin-top:18px;font-size:11px;color:rgba(143,175,159,.5);font-family:system-ui}
</style>
</head>
<body>
<div class="hdr">
  <div class="ey">Die unsichtbaren Fäden</div>
  <h1>Die unsichtbare Wurzel<br>deines Bindungsmusters</h1>
  <div class="sub">7-Felder-Modell · Feld 4 · Bindungsmuster</div>
</div>
<div class="card" id="card"></div>
<div class="footer">🐾 Susanne Zischgl · Die unsichtbaren Fäden zwischen Mensch und Hund</div>

<script>
var QS = [
  {
    lbl: "Fruehe Erfahrungen",
    q: "Wie war es als Kind, wenn du Naehe, Trost oder Unterstuetzung gebraucht hast?",
    hint: "Nicht als Analyse – sondern als ehrliche Erinnerung. War jemand da? Verlässlich? Manchmal ja, manchmal nein? Oder war Naehe eher schwierig?",
    ph: "z. B. Meine Eltern waren da, aber eher praktisch – Gefuehle wurden nicht so sehr besprochen..."
  },
  {
    lbl: "Sicherheit in Beziehungen",
    q: "Vertraust du generell darauf, dass andere fuer dich da sind – wenn du sie brauchst?",
    hint: "Das ist eine tiefe Frage. Nicht was du dir wuenschst – sondern was du innerlich wirklich glaubst. Vertrauen faellt leicht? Oder ist da immer ein kleines Aber?",
    ph: "z. B. Ich vertraue schon, aber ich merke dass ich nicht gerne um Hilfe bitte. Lieber mache ich es selbst..."
  },
  {
    lbl: "Wenn du dich unverstanden fuehlst",
    q: "Was passiert in dir, wenn du dich in einer Beziehung unverstanden oder alleingelassen fuehlst?",
    hint: "Rueckzug, Klammern, Anger, Erstarren, Erklaeren, Kontrollieren...? Was ist dein typisches Muster in solchen Momenten?",
    ph: "z. B. Ich ziehe mich zurueck und sage nichts mehr. Oder ich versuche es so lange zu erklaeren bis der andere versteht..."
  },
  {
    lbl: "Naehe und Eigenstaendigkeit",
    q: "Wie ist das Verhaeltnis bei dir zwischen Naehe und Eigenstaendigkeit?",
    hint: "Brauchst du viel Naehe und leidest wenn sie fehlt? Oder ist dir Eigenstaendigkeit wichtiger und Naehe manchmal eher ueberwältigend? Oder irgendwo dazwischen?",
    ph: "z. B. Ich brauche eigentlich beides, aber manchmal wenn jemand zu nah kommt, weiche ich innerlich aus..."
  },
  {
    lbl: "Dein Hund als Bindungsobjekt",
    q: "Was bedeutet dein Hund fuer dich – wenn du ganz ehrlich bist?",
    hint: "Nicht die schoene Antwort. Die echte. Ist er Begleiter, Troester, bester Freund, Sicherheitsanker, Projektion, alles davon?",
    ph: "z. B. Er ist mein konstantester Begleiter. Ich glaube er versteht mich manchmal besser als Menschen..."
  }
];

var ANS = ["","","","",""];
var STEP = 0;
var RES = "";

function $(id){return document.getElementById(id);}

function showWelcome(){
  $("card").innerHTML =
    '<div class="card-hdr">'+
    '<div class="e">Feld 4 · Bindungsmuster</div>'+
    '<h2>Dein Bindungsmuster –<br>und was dein Hund davon traegt.</h2>'+
    '<p>Im letzten Schritt hast du geschaut, wie du Beziehungen gestaltest. Jetzt gehen wir eine Ebene tiefer: zu dem, was diese Muster erst erzeugt.</p>'+
    '</div>'+
    '<div class="body">'+
    '<div class="badge-5f">7-Felder-Modell · Feld 4</div>'+

    '<div style="background:linear-gradient(135deg,#F0F5F2,#D8EAE4);border-radius:12px;padding:14px 16px;margin-bottom:16px;border-left:4px solid #4A7C6F">'+
    '<p style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#4A7C6F;font-family:system-ui;margin-bottom:8px">Der Unterschied: Beziehungsmuster vs. Bindungsmuster</p>'+
    '<p style="font-size:13px;color:#1E2E28;font-family:system-ui;line-height:1.7;margin-bottom:10px">&#129309; <strong>Beziehungsmuster</strong> (Feld 3) zeigt, <em>wie</em> du Beziehungen im Alltag lebst – ob du dich anpasst, kontrollierst, Naehe suchst oder meidest. Das ist das Sichtbare.</p>'+
    '<p style="font-size:13px;color:#1E2E28;font-family:system-ui;line-height:1.7;margin-bottom:10px">&#128247; <strong>Bindungsmuster</strong> (Feld 3b) geht eine Stufe tiefer: Es zeigt, <em>warum</em> du so reagierst. Es ist die innere Grundstruktur, die sich sehr frueh geformt hat – und die deine Beziehungsmuster erst erzeugt.</p>'+
    '<p style="font-size:13px;color:#1E2E28;font-family:system-ui;line-height:1.7"><strong>Kurz gesagt:</strong> Das Beziehungsmuster ist das, was man sieht. Das Bindungsmuster ist das, was dahintersteckt.</p>'+
    '</div>'+

    '<div class="feat"><div class="feat-icon">&#128247;</div><div class="feat-text"><strong>Wie du innerlich in Beziehungen verdrahtet bist</strong> – die Grundstruktur, die alle deine Beziehungen praegt. Auch die zu deinem Hund.</div></div>'+
    '<div class="feat"><div class="feat-icon">&#128062;</div><div class="feat-text"><strong>Was dein Hund davon traegt</strong> – was er unbewusst von dir uebernimmt, was eigentlich nicht ihm gehoert.</div></div>'+
    '<div class="feat"><div class="feat-icon">&#128270;</div><div class="feat-text"><strong>Selbstreflexion & eine konkrete Veraenderung</strong> – was du erkennen kannst und was du diese Woche anders beobachten oder ausprobieren koenntest.</div></div>'+

    '<div class="hinweis"><strong style="color:#0D2B1E">Wichtiger Hinweis:</strong> Dieses Thema geht in tiefes persoenliches Terrain. Diese App ist kein Ersatz fuer Therapie oder professionelle Begleitung – sondern eine Einladung zur ehrlichen Selbstbetrachtung.</div>'+
    '<div class="tip"><strong style="color:#C4923A">Tipp:</strong> Nimm dir Zeit bei jeder Frage. Antworte langsam und ehrlich. Und wenn du nicht weisst – schreib <strong>Ich weiss es nicht</strong>.</div>'+
    '<button class="btn-p" onclick="showQ(1)">&#128247; Mein Bindungsmuster erkunden</button>'+
    '</div>';
}

function showQ(n){
  STEP = n;
  var q = QS[n-1];
  var pct = Math.round((n/5)*100);
  var dots = "";
  for(var i=0;i<5;i++){
    var c = i<n-1?"#4A7C6F":i===n-1?"#0D2B1E":"#D8EAE4";
    dots += '<div class="dot" style="background:'+c+'"></div>';
  }
  var back = n>1?'<button class="btn-o" onclick="goBack()">&#8592; Zurueck</button>':'';
  var nextCls = n===5?"btn-g":"btn-p";
  var nextLbl = n===5?"&#128247; Mein Bindungsmuster zeigen":"Weiter &#8594;";
  $("card").innerHTML =
    '<div class="body">'+
    '<div class="prog-meta"><span>Frage '+n+' von 5</span><span>'+pct+'%</span></div>'+
    '<div class="prog-track"><div class="prog-fill" style="width:'+pct+'%"></div></div>'+
    '<div class="dots">'+dots+'</div>'+
    '<div class="q-label">'+q.lbl+'</div>'+
    '<div class="q-title">'+q.q+'</div>'+
    '<div class="q-hint">'+q.hint+'</div>'+
    '<textarea id="ta" rows="4" placeholder="'+q.ph+'" oninput="chk()">'+(ANS[n-1]||'')+'</textarea>'+
    '<p class="idk">&#128161; Du kannst auch schreiben: <strong>Ich weiss es nicht</strong> – das ist eine vollwertige Antwort.</p>'+
    '<div class="btn-row">'+back+'<button class="'+nextCls+'" id="nbtn" onclick="goNext()">'+nextLbl+'</button></div>'+
    '<button class="btn-lnk" onclick="reset()">&#8635; Von vorne starten</button>'+
    '</div>';
  chk();
}

function chk(){
  var ta=$("ta"), btn=$("nbtn");
  if(ta&&btn) btn.disabled = !ta.value.trim();
}

function goNext(){
  var ta=$("ta");
  if(!ta||!ta.value.trim()) return;
  ANS[STEP-1]=ta.value.trim();
  if(STEP<5){showQ(STEP+1);}
  else{generate();}
}

function goBack(){
  var ta=$("ta");
  if(ta) ANS[STEP-1]=ta.value.trim();
  showQ(STEP-1);
}

function showLoading(){
  $("card").innerHTML='<div class="body"><div class="spin-wrap"><div class="spin"></div><p style="font-size:14px;color:#6B8A7E;font-family:system-ui;font-style:italic">Susanne geht mit dir auf Tiefgang...</p></div></div>';
}

function generate(){
  showLoading();
  var msg="";
  var labels=["Fruehe Erfahrungen mit Naehe und Unterstuetzung","Vertrauen in Beziehungen","Reaktion auf Unverstanden-Fuehlen","Verhaeltnis Naehe und Eigenstaendigkeit","Was der Hund bedeutet"];
  for(var i=0;i<5;i++) msg+=labels[i]+": "+(ANS[i]||"keine Angabe")+"\n";

  var sys="Du bist Susanne, erfahrene Hundetrainerin, Physiotherapeutin und systemische Coach mit ueber 30 Jahren Erfahrung. Du arbeitest mit dem 7-Felder-Modell der Mensch-Hund-Dynamik.\n\nFeld 4 sind die Bindungsmuster: die tiefste Schicht der Beziehungsgestaltung. Bindungsmuster entstehen frueh und zeigen sich in allen Beziehungen – auch mit dem Hund. Es gibt im Wesentlichen vier Grundmuster: sicher (Vertrauen faellt leicht, Naehe und Eigenstaendigkeit balanciert), aengstlich-ambivalent (starkes Beduerfnis nach Naehe, Angst vor Verlust), vermeidend (Eigenstaendigkeit wird bevorzugt, Naehe kann ueberwaetigend sein), desorganisiert (gemischte und widersprüchliche Muster, oft nach schwierigen fruehen Erfahrungen).\n\nDu schreibst warm, tief, behutsam und ohne Floskeln. Kein Coaching-Sprech, keine Diagnosen. Du benennt was du siehst als Einladung, nicht als Urteil. Du weist darauf hin, dass tiefe Bindungsmuster professionelle Begleitung verdienen – ohne zu dramatisieren.\n\nBasierend auf den fuenf Antworten schreibst du fuenf Abschnitte mit diesen exakten Ueberschriften:\n\nDein Bindungsmuster:\n[3-4 Saetze: Welches Grundmuster erkennst du? Benenne es klar und behutsam. Erklaere kurz was es bedeutet – nicht als Diagnose, sondern als Orientierung.]\n\nWas du auf deinen Hund uebertragst:\n[2-3 Saetze: Wie zeigt sich dieses Bindungsmuster konkret in der Beziehung zum Hund? Was uebertraegst du unbewusst?]\n\nWas dein Hund davon traegt:\n[2-3 Saetze: Was bedeutet dieses Muster fuer deinen Hund? Was tragt er mit, was eigentlich nicht ihm gehoert?]\n\nSelbstreflexion:\n[2-3 Saetze: Was koennte der Mensch erkennen und annehmen – ohne sich dafuer zu verurteilen? Was waere ein erster behutsamer Blick auf sich selbst?]\n\nDeine eine Veraenderung diese Woche:\n[1-2 Saetze: Eine einzige innere Beobachtungsaufgabe – kein Training, kein Druck. Etwas das man in Ruhe wahrnehmen kann.]\n\nKein Markdown. Deutsch, du-Ansprache.";

  fetch("https://tierakademie-proxy.tierakademie.workers.dev",{
    method:"POST",
    headers:{"Content-Type":"application/json",},
    body:JSON.stringify({
      model:"claude-sonnet-4-20250514",
      max_tokens:1100,
      system:sys,
      messages:[{role:"user",content:"Hier sind die fuenf Antworten:\n\n"+msg}]
    })
  })
  .then(function(r){if(!r.ok)throw new Error("Fehler "+r.status);return r.json();})
  .then(function(d){
    if(d.error)throw new Error(d.error.message);
    RES=d.content&&d.content[0]?d.content[0].text:"";
    showResult();
  })
  .catch(function(e){
    $("card").innerHTML='<div class="body"><div class="err">&#9888; '+e.message+'<br><button class="btn-p" style="margin-top:12px;width:auto;padding:9px 16px" onclick="generate()">&#8635; Nochmal versuchen</button></div></div>';
  });
}

function showResult(){
  var secs=[
    {key:"dein bindungsmuster",lbl:"&#128247; Dein Bindungsmuster",col:"#0D2B1E",copy:false},
    {key:"was du auf deinen hund",lbl:"&#128062; Was du auf deinen Hund uebertraegst",col:"#1E3A2E",copy:false},
    {key:"was dein hund davon",lbl:"&#129309; Was dein Hund davon traegt",col:"#4A7C6F",copy:false},
    {key:"selbstreflexion",lbl:"&#128270; Selbstreflexion",col:"#C4923A",copy:false},
    {key:"deine eine veraenderung",lbl:"&#128336; Deine eine Veraenderung diese Woche",col:"#D4A853",copy:true}
  ];
  var parsed=[],cur=null;
  var lines=RES.split("\n");
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim(),low=line.toLowerCase();
    var found=false;
    for(var j=0;j<secs.length;j++){
      if(low.indexOf(secs[j].key)!==-1){
        if(cur)parsed.push(cur);
        cur={lbl:secs[j].lbl,col:secs[j].col,copy:secs[j].copy,txt:""};
        found=true;break;
      }
    }
    if(!found&&cur&&line) cur.txt+=(cur.txt?"\n":"")+line;
  }
  if(cur)parsed.push(cur);
  if(!parsed.length)parsed=[{lbl:"&#128247; Dein Bindungsmuster",col:"#0D2B1E",copy:false,txt:RES}];

  var html='<div class="body">'+
    '<div class="badge-5f">7-Felder-Modell · Feld 4</div>'+
    '<p style="font-size:16px;font-weight:700;color:#0D2B1E;margin-bottom:4px">Dein Bindungsmuster &#128247;</p>'+
    '<p style="font-size:13px;color:#6B8A7E;font-family:system-ui;margin-bottom:16px;line-height:1.65">Lies es langsam und in Ruhe. Lass es sacken. Manche Erkenntnisse brauchen Zeit.</p>';

  for(var k=0;k<parsed.length;k++){
    var s=parsed[k];
    var cp=s.copy?
      '<p class="copy-hint">&#128070; Klick ins Feld &#8594; alles markiert &#8594; Strg+C</p>'+
      '<textarea class="copy-field" readonly rows="3" onclick="this.select()">'+s.txt+'</textarea>':'';
    html+='<div class="rbox" style="border-left:4px solid '+s.col+'">'+
      '<div class="rs-lbl" style="color:'+s.col+'">'+s.lbl+'</div>'+
      '<div class="rs-txt">'+s.txt.replace(/\n/g,"<br>")+'</div>'+cp+'</div>';
  }

  html+='<div class="hinweis" style="background:linear-gradient(135deg,#F0F5F2,#D8EAE4);border-left:4px solid #0D2B1E">'+
    '<strong style="color:#0D2B1E">Ein ehrlicher Hinweis:</strong> Wenn du merkst, dass diese Erkenntnisse etwas in dir beruehren das groesser ist – ist das ein Zeichen, dass professionelle Begleitung wertvoll sein koennte. Das ist keine Schwaeche. Das ist Selbstfuersorge.'+
    '</div>';

  html+='<div class="bridge-box">'+
    '<strong style="color:#1E3A2E">Und weiter?</strong> In Feld 4 verlassen wir die Tiefe und schauen auf dein konkretes Tun: Wie handelst du im Alltag mit deinem Hund – und was wirkt davon, wie du es dir vorstellst?'+
    '</div>';

  html+='<button class="btn-p" onclick="reset()" style="margin-top:4px">&#8635; Nochmal von vorne</button>'+
    '</div>';
  $("card").innerHTML=html;
}

function reset(){ANS=["","","","",""];STEP=0;RES="";showWelcome();}

showWelcome();
</script>
</body>
</html>
