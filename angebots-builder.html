<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angebots-Builder · Tierbusiness Community</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Georgia, serif; background: linear-gradient(160deg, #2D4A3E 0%, #1a3329 40%, #0f1e18 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 28px 16px 48px; }
@keyframes spin { to { transform: rotate(360deg); } }
::-webkit-scrollbar{width:5px} ::-webkit-scrollbar-thumb{background:#8FAF9F;border-radius:3px}
.hdr{text-align:center;margin-bottom:26px}
.ey{font-size:11px;color:#D4A853;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;font-family:system-ui}
.hdr h1{font-size:24px;font-weight:700;color:white;margin-bottom:4px}
.hdr .sub{font-size:13px;color:#8FAF9F;font-family:system-ui}
.card{width:100%;max-width:580px;background:white;border-radius:20px;overflow:hidden;box-shadow:0 20px 70px rgba(0,0,0,.3)}
.card-hdr{background:linear-gradient(135deg,#2D4A3E,#4A7C6F);padding:22px 24px 18px;color:white}
.card-hdr .e{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#D4A853;margin-bottom:6px;font-family:system-ui}
.card-hdr h2{font-size:19px;font-weight:700;margin-bottom:8px;line-height:1.3}
.card-hdr p{font-size:13px;color:rgba(255,255,255,.8);line-height:1.7;font-family:system-ui}
.body{padding:20px 24px 26px}
.feat{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.feat-icon{width:34px;height:34px;border-radius:10px;background:#F5F0E8;border:1px solid #E8DCC8;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.feat-text{font-size:13px;color:#1E2E28;font-family:system-ui;line-height:1.5}
.tip{background:linear-gradient(135deg,#FFF8EC,#FFF0D4);border-left:4px solid #C4923A;border-radius:10px;padding:13px 15px;font-size:13px;color:#1E2E28;line-height:1.65;font-family:system-ui;margin:14px 0}
.btn-p{background:linear-gradient(135deg,#2D4A3E,#4A7C6F);color:white;border:none;border-radius:10px;padding:13px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;width:100%}
.btn-p:disabled{background:#8FAF9F;cursor:not-allowed}
.btn-g{background:linear-gradient(135deg,#C4923A,#D4A853);color:white;border:none;border-radius:10px;padding:13px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;width:100%}
.btn-o{background:transparent;border:1.5px solid #2D4A3E;color:#2D4A3E;border-radius:10px;padding:12px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-row{display:flex;gap:10px;margin-top:14px}
.btn-row .btn-p,.btn-row .btn-g{flex:1}
.btn-lnk{background:none;border:none;color:#6B8A7E;font-size:12px;cursor:pointer;text-decoration:underline;font-family:inherit;padding:8px 0 0;display:block}
.prog-meta{display:flex;justify-content:space-between;font-size:11px;color:#6B8A7E;font-family:system-ui;margin-bottom:6px}
.prog-track{background:#E8DCC8;border-radius:999px;height:6px;overflow:hidden;margin-bottom:8px}
.prog-fill{height:100%;background:linear-gradient(90deg,#2D4A3E,#4A7C6F);border-radius:999px}
.dots{display:flex;gap:6px;margin-bottom:20px}
.dot{flex:1;height:4px;border-radius:999px}
.q-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#C4923A;font-family:system-ui;margin-bottom:4px}
.q-title{font-size:18px;font-weight:700;color:#2D4A3E;margin-bottom:8px;line-height:1.35}
.q-hint{font-size:13px;color:#6B8A7E;font-style:italic;font-family:system-ui;line-height:1.6}
.idk{font-size:12px;color:#6B8A7E;font-family:system-ui;line-height:1.6;margin:6px 0 12px;font-style:italic}
textarea,input[type=text]{width:100%;font-family:Georgia,serif;font-size:14px;color:#1E2E28;background:#F5F0E8;border:1.5px solid #8FAF9F;border-radius:10px;padding:11px 13px;outline:none;resize:vertical;line-height:1.65;margin:12px 0 0;display:block}
textarea:focus,input[type=text]:focus{border-color:#C4923A}
.rbox{background:linear-gradient(135deg,#F5F0E8,#E8DCC8);border-radius:12px;padding:14px 16px;margin-bottom:14px;border-left:4px solid #C4923A}
.rs-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.rs-txt{font-size:14px;color:#1E2E28;line-height:1.75}
.copy-hint{font-size:11px;color:#6B8A7E;font-family:system-ui;margin:10px 0 4px}
.copy-field{width:100%;background:white;border:1.5px solid #C4923A;border-radius:8px;padding:9px 11px;font-size:13px;color:#1E2E28;font-family:inherit;line-height:1.7;resize:none;outline:none;cursor:text;display:block}
.spin-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:40px 0}
.spin{width:36px;height:36px;border:3px solid #E8DCC8;border-top-color:#C4923A;border-radius:50%;animation:spin .8s linear infinite}
.err{background:#fff0f0;border-left:4px solid #cc4444;border-radius:10px;padding:14px 16px;font-size:13px;color:#7a2222;font-family:system-ui;margin-top:10px}
.footer{margin-top:18px;font-size:11px;color:rgba(143,175,159,.5);font-family:system-ui}
.pw-box{background:#fff;border-radius:16px;padding:32px;max-width:420px;margin:0 auto;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,0.15)}.pw-box h2{font-family:Georgia,serif;color:#2C4A3E;font-size:1.3rem;margin-bottom:8px}.pw-box p{color:#7D6352;font-size:0.9rem;margin-bottom:20px}.pw-inp{width:100%;padding:12px 16px;border:2px solid #D4A853;border-radius:8px;font-size:1rem;text-align:center;outline:none;box-sizing:border-box;color:#2C4A3E}.pw-inp:focus{border-color:#2C4A3E}.pw-btn{width:100%;margin-top:12px;padding:12px;background:#B8860B;color:#fff;border:none;border-radius:8px;font-size:1rem;cursor:pointer;font-family:Georgia,serif}.pw-btn:hover{background:#2C4A3E}.pw-err{color:#c0392b;font-size:0.85rem;margin-top:8px;display:none}</style>
</head>
<body>
<div class="hdr">
  <div class="ey">Tierbusiness Community</div>
  <h1>Angebots-Builder</h1>
  <div class="sub">„Was machst du genau?" – jetzt klar beantwortet</div>
</div>
<div class="card" id="card"></div>
<div class="footer">🐾 Susanne Zischgl · Tierberufler-Kompass-System</div>

<script>
var QS = [
  {
    lbl: "Deine Zielgruppe",
    q: "Fuer wen ist dein Angebot?",
    hint: "Wer sind die Menschen, die zu dir kommen? Je konkreter, desto staerker wird dein Angebot.",
    ph: "z. B. Hundehalter mit reaktiven Hunden, die sich auf der Strasse schaemen..."
  },
  {
    lbl: "Das Problem",
    q: "Welches konkrete Problem loest du?",
    hint: "Was bringt jemanden dazu, dich zu suchen? Was nervt, belastet oder blockiert ihn gerade?",
    ph: "z. B. Der Hund zieht, bellt andere Hunde an und der Spaziergang ist zum Stress geworden..."
  },
  {
    lbl: "Deine Leistung",
    q: "Was tust du genau – und wie?",
    hint: "Beschreibe dein Angebot so, als wuerdest du es einem Freund erklaeren. Kein Fachjargon noetig.",
    ph: "z. B. Ich arbeite in 6 Einzelstunden direkt im Alltag des Hundes, mit klaren Uebungen und viel Begleitung..."
  },
  {
    lbl: "Das Ergebnis",
    q: "Was veraendert sich fuer den Kunden – danach?",
    hint: "Nicht was du machst, sondern was der Kunde danach hat, kann oder fuehlt.",
    ph: "z. B. Der Hund laeuft entspannt neben ihm, der Halter geht wieder gerne raus..."
  },
  {
    lbl: "Dein Angebot",
    q: "Wie ist dein Angebot aufgebaut – und was kostet es?",
    hint: "Einzelstunden, Pakete, Online, Praesenz? Preis muss nicht exakt sein – eine Groessenordnung reicht.",
    ph: "z. B. 6er-Paket Einzeltraining, 90 Min. pro Einheit, 480 Euro, vor Ort oder hybrid..."
  },
  {
    lbl: "Dein Unterschied",
    q: "Was macht dein Angebot besonders – verglichen mit anderen?",
    hint: "Was bringst du mit, was andere nicht haben? Erfahrung, Methode, Haltung, Kombination?",
    ph: "z. B. Ich verbinde Verhaltensarbeit mit Koerpertherapie, weil Stress oft koerperlich sitzt..."
  }
];

var ANS = ["","","","","",""];
var STEP = 0;
var RES = "";

function $(id){return document.getElementById(id);}


var ACCESS="Klarheit";
function showGate(){
  var h='<div class="pw-box">';
  h+='<h2>Zugangswort eingeben</h2>';
  h+='<p>Diese App ist nur mit Zugangswort verfügbar.</p>';
  h+='<input class="pw-inp" id="pwi" type="text" placeholder="Zugangswort...">';
  h+='<button class="pw-btn" onclick="checkPW()">Weiter</button>';
  h+='<div class="pw-err" id="pwe">Das Zugangswort ist nicht korrekt.</div>';
  h+='</div>';
  $("card").innerHTML=h;
  document.getElementById("pwi").addEventListener("keydown",function(e){if(e.key==="Enter")checkPW();});
  document.getElementById("pwi").focus();
}
function checkPW(){
  var v=document.getElementById("pwi").value.trim();
  if(v===ACCESS){showWelcome();}
  else{document.getElementById("pwe").style.display="block";document.getElementById("pwi").value="";document.getElementById("pwi").focus();}
}
function showWelcome(){
  $("card").innerHTML =
    '<div class="card-hdr"><div class="e">Schritt fuer Schritt</div><h2>Dein Angebot – klar, buchbar, unverwechselbar.</h2><p>Viele Tierberufler koennen ihr Angebot schwer erklaeren – nicht weil es schlecht ist, sondern weil die richtigen Worte fehlen. Dieser Builder hilft dir, dein Angebot so zu formulieren, dass Interessenten sofort verstehen: Das ist genau das, was ich brauche.</p></div>'+
    '<div class="body">'+
    '<div class="feat"><div class="feat-icon">&#128269;</div><div class="feat-text">6 gezielte Fragen zu deinem Angebot</div></div>'+
    '<div class="feat"><div class="feat-icon">&#128203;</div><div class="feat-text">Fertiger Angebotstext – klar und buchbar formuliert</div></div>'+
    '<div class="feat"><div class="feat-icon">&#128172;</div><div class="feat-text">Kurzversion fuer das naechste Erstgespraech</div></div>'+
    '<div class="feat"><div class="feat-icon">&#128241;</div><div class="feat-text">Social-Media-Version fuer einen Post oder deine Bio</div></div>'+
    '<div class="feat"><div class="feat-icon">&#129517;</div><div class="feat-text">Susannes Blick – was sie in deinem Angebot sieht</div></div>'+
    '<div class="tip"><strong style="color:#C4923A">Tipp:</strong> Antworte so konkret wie moeglich – und wenn du etwas nicht weisst, schreib einfach <strong>Ich weiss es nicht</strong>. Das ist eine vollwertige Antwort.</div>'+
    '<button class="btn-p" onclick="showQ(1)">&#128203; Angebot aufbauen</button>'+
    '</div>';
}

function showQ(n){
  STEP = n;
  var q = QS[n-1];
  var pct = Math.round((n/6)*100);
  var dots = "";
  for(var i=0;i<6;i++){
    var c = i<n-1?"#4A7C6F":i===n-1?"#C4923A":"#E8DCC8";
    dots += '<div class="dot" style="background:'+c+'"></div>';
  }
  var back = n>1?'<button class="btn-o" onclick="goBack()">&#8592; Zurueck</button>':'';
  var nextCls = n===6?"btn-g":"btn-p";
  var nextLbl = n===6?"&#128203; Angebot formulieren":"Weiter &#8594;";
  $("card").innerHTML =
    '<div class="body">'+
    '<div class="prog-meta"><span>Frage '+n+' von 6</span><span>'+pct+'%</span></div>'+
    '<div class="prog-track"><div class="prog-fill" style="width:'+pct+'%"></div></div>'+
    '<div class="dots">'+dots+'</div>'+
    '<div class="q-label">'+q.lbl+'</div>'+
    '<div class="q-title">'+q.q+'</div>'+
    '<div class="q-hint">'+q.hint+'</div>'+
    '<textarea id="ta" rows="4" placeholder="'+q.ph+'" oninput="chk()">'+(ANS[n-1]||'')+'</textarea>'+
    '<p class="idk">&#128161; Du kannst auch schreiben: <strong>Ich weiss es nicht</strong> – das ist eine vollwertige Antwort.</p>'+
    '<div class="btn-row">'+back+'<button class="'+nextCls+'" id="nbtn" onclick="goNext()">'+nextLbl+'</button></div>'+
    '<button class="btn-lnk" onclick="reset()">&#8635; Von vorne starten</button>'+
    '</div>';
  chk();
}

function chk(){
  var ta=$("ta"), btn=$("nbtn");
  if(ta&&btn) btn.disabled = !ta.value.trim();
}

function goNext(){
  var ta=$("ta");
  if(!ta||!ta.value.trim()) return;
  ANS[STEP-1]=ta.value.trim();
  if(STEP<6){showQ(STEP+1);}
  else{generate();}
}

function goBack(){
  var ta=$("ta");
  if(ta) ANS[STEP-1]=ta.value.trim();
  showQ(STEP-1);
}

function showLoading(){
  $("card").innerHTML='<div class="body"><div class="spin-wrap"><div class="spin"></div><p style="font-size:14px;color:#6B8A7E;font-family:system-ui;font-style:italic">Susanne formuliert dein Angebot...</p></div></div>';
}

function generate(){
  showLoading();
  var msg="";
  var labels=["Zielgruppe","Problem","Leistung","Ergebnis","Angebotsstruktur","Unterschied"];
  for(var i=0;i<6;i++) msg+=labels[i]+": "+(ANS[i]||"keine Angabe")+"\n";

  var sys="Du bist Susanne, erfahrene Hundetrainerin und Business-Coach fuer Tierberufler mit ueber 30 Jahren Erfahrung. Du hilfst Tierberuflern, ihr Angebot klar und buchbar zu formulieren.\n\nBasierend auf den sechs Antworten formulierst du vier Abschnitte mit diesen exakten Ueberschriften:\n\nAngebotstext:\n[Ein klarer, buchbarer Angebotstext in 4-6 Saetzen: Fuer wen, welches Problem, was du tust, welches Ergebnis, wie das Angebot aufgebaut ist.]\n\nKurzversion:\n[1-2 Saetze fuer das Erstgespraech oder wenn jemand fragt: Was machst du?]\n\nSocial-Media-Version:\n[3-4 Saetze fuer einen Post oder Bio. Spricht den Wunschkunden direkt an. Warm, ohne Floskeln.]\n\nSusannes Blick:\n[3-4 Saetze: Was du in diesem Angebot siehst, was stark ist, und was noch geschaerft werden koennte. Ehrlich, konstruktiv, warm.]\n\nKein Markdown. Deutsch, du-Ansprache.";

  fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":"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","anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({
      model:"claude-haiku-4-5-20251001",
      max_tokens:1200,
      system:sys,
      messages:[{role:"user",content:"Hier sind die Angaben zum Angebot:\n\n"+msg}]
    })
  })
  .then(function(r){if(!r.ok)throw new Error("Fehler "+r.status);return r.json();})
  .then(function(d){
    if(d.error)throw new Error(d.error.message);
    RES=d.content&&d.content[0]?d.content[0].text:"";
    showResult();
  })
  .catch(function(e){
    $("card").innerHTML='<div class="body"><div class="err">&#9888; '+e.message+'<br><button class="btn-p" style="margin-top:12px;width:auto;padding:9px 16px" onclick="generate()">&#8635; Nochmal versuchen</button></div></div>';
  });
}

function showResult(){
  var secs=[
    {key:"angebotstext",lbl:"&#128203; Dein Angebotstext",col:"#2D4A3E",copy:true},
    {key:"kurzversion",lbl:"&#128172; Kurzversion",col:"#4A7C6F",copy:true},
    {key:"social-media",lbl:"&#128241; Social-Media-Version",col:"#C4923A",copy:true},
    {key:"susannes blick",lbl:"&#129517; Susannes Blick",col:"#D4A853",copy:false}
  ];
  var parsed=[],cur=null;
  var lines=RES.split("\n");
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim(),low=line.toLowerCase();
    var found=false;
    for(var j=0;j<secs.length;j++){
      if(low.indexOf(secs[j].key)!==-1){
        if(cur)parsed.push(cur);
        cur={lbl:secs[j].lbl,col:secs[j].col,copy:secs[j].copy,txt:""};
        found=true;break;
      }
    }
    if(!found&&cur&&line) cur.txt+=(cur.txt?"\n":"")+line;
  }
  if(cur)parsed.push(cur);
  if(!parsed.length)parsed=[{lbl:"&#128203; Dein Angebot",col:"#2D4A3E",copy:true,txt:RES}];

  var html='<div class="body">'+
    '<p style="font-size:16px;font-weight:700;color:#2D4A3E;margin-bottom:4px">Dein Angebot &#128203;</p>'+
    '<p style="font-size:13px;color:#6B8A7E;font-family:system-ui;margin-bottom:16px;line-height:1.6">Lies es in Ruhe durch – nimm dir den Text, der sich am echtesten anfuehlt und passe ihn gerne noch an.</p>';

  for(var k=0;k<parsed.length;k++){
    var s=parsed[k];
    var rows=Math.max(3,s.txt.split("\n").length+2);
    var cp=s.copy?
      '<p class="copy-hint">&#128070; Klick ins Feld &#8594; alles markiert &#8594; Strg+C</p>'+
      '<textarea class="copy-field" readonly rows="'+rows+'" onclick="this.select()">'+s.txt+'</textarea>':'';
    html+='<div class="rbox" style="border-left-color:'+s.col+'">'+
      '<div class="rs-lbl" style="color:'+s.col+'">'+s.lbl+'</div>'+
      '<div class="rs-txt">'+s.txt.replace(/\n/g,"<br>")+'</div>'+cp+'</div>';
  }
  html+='</div>';
  $("card").innerHTML=html;
}

function reset(){ANS=["","","","","",""];STEP=0;RES="";showWelcome();}

showGate();
</script>
</body>
</html>
